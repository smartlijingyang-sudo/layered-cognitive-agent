# bundles/concept/effect_execute.yaml — Layer 2 概念图
# ADR-0220 §3.3 — CommandEnvelope → EffectReceipt typed boundary (effect
# dispatcher, act subgraph 的 dispatch 节点)。
#
# 节点命名:1 节点以 effect. 起首,与 §0.4 N9 action-domain 闭集一致
# (effect.* 在闭集内)。
#
# 跨图引用:
#   inputs  -> act.dispatch 的 envelope port
#   outputs -> act.join 的 receipts port (list[EffectReceipt], length 1)
#
# delete-when: N/A(纯加法,act subgraph 引用)。

id: concept.effect.execute
region: concept
purpose: CommandEnvelope → EffectReceipt typed boundary (effect gateway dispatcher)

nodes:
  - id: effect.execute
    factory: effect.execute
    inputs: [envelope]
    # PR-3.8.5 fix1: emit ``receipts`` (list-of-one) to match the inner
    # entry's typed ``declared_outputs`` and the downstream ``act.join``'s
    # ``declared_inputs``. Loader silently ignores yaml outputs for subgraph
    # nodes (subgraph_resolver.py §154-156), so this field is documentation
    # only — runtime port names come from the inner entry's typed contract.
    outputs: [receipts]
    config:
      emit_on_enter: []
      emit_on_exit: []

edges: []
