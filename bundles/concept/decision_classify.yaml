# bundles/concept/decision_classify.yaml — Layer 2 概念图
# ADR-0221 — LLMResponse → Decision typed boundary(cross-graph transport)。
#
# 节点命名:2 节点(ADR-0221 合并原 ADR-0220 §3.3 的 3 节点图)。
# decision.parse.response 单 pass 同时产出 tool_calls / delegations /
# intent,消解 fan-out 隐式假设(v2 graph driver 单 cursor 不支持 fan-out;
# 原 3 节点图在 run_dfa3f8615ea6 触发 act.validate TypeError)。
# §3.3 节点数 ≤ 4 (本图 2 节点,符合 G1 职责单一)。
#
# 跨图引用:
#   inputs  -> primitive.llm.call 节点的 response port
#   outputs -> business.reasoning.turn 的 decision 端口
#
# delete-when: N/A(纯加法,business.reasoning.turn 在 P5 引用)。

id: concept.decision.classify
region: concept
purpose: LLMResponse → Decision typed boundary — single-node typed parse + compose pipeline

nodes:
  - id: decision.parse.response
    factory: decision.parse.response
    inputs: [response]
    outputs: [tool_calls, delegations, intent]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: decision.compose.action
    factory: decision.compose.action
    inputs: [tool_calls, delegations, intent]
    outputs: [decision]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

edges:
  - source: decision.parse.response
    target: decision.compose.action