# bundles/concept/perceive_turn.yaml — Layer 2 概念图
# ADR-0220 §3.4 — run_input + memory → ContextManifest (4-node perceive
# sequence: collect + sensor-run + observation-fold + manifest-compose)。
#
# 节点命名:4 节点全部以 perceive. 起首,与 §0.4 N9 action-domain 闭集一致
# (perceive.* 在闭集内)。§3.3 节点数 ≤ 4 (本图 4 节点,正好顶格)。
#
# 跨图引用:
#   inputs  -> business.perceive.turn 的 run_input + state port
#   outputs -> business.perceive.turn 的 manifest port
#
# delete-when: N/A(纯加法,business.perceive.turn 在 P8 引用)。

id: concept.perceive.turn
region: concept
purpose: run_input → ContextManifest typed boundary (4-node perceive sequence)

nodes:
  - id: perceive.input.collect
    factory: perceive.input.collect
    inputs: [run_input]
    outputs: [raw_inputs]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: perceive.sensor.run
    factory: perceive.sensor.run
    inputs: [raw_inputs]
    outputs: [observations]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: perceive.observation.fold
    factory: perceive.observation.fold
    inputs: [observations]
    outputs: [context_items]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: perceive.manifest.compose
    factory: perceive.manifest.compose
    inputs: [context_items, state]
    outputs: [manifest]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

edges:
  - source: perceive.input.collect
    target: perceive.sensor.run
  - source: perceive.sensor.run
    target: perceive.observation.fold
  - source: perceive.observation.fold
    target: perceive.manifest.compose