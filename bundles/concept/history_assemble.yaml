# bundles/concept/history_assemble.yaml — Layer 2 概念图
# Spec §D — think.history.assemble 内部图。
#
# 单节点 inner graph:history.derive 从 RunSessionWriter + ForkedTools 投影
# messages + system + tools,经 orphan-drop 后的 ModelVisibleRequest typed
# boundary。
#
# 跨图引用:
#   inputs  -> business.reasoning.turn 的 writer + forked_tools port
#   outputs -> primitive.llm.call 节点的 model_visible_request port
#
# PR-3.8.borrow-tools-wire: forked_tools added as a typed input port;
# before this, history.derive emitted ``tools=()`` regardless of fork,
# so the LLM never saw the per-run tool schema (spec §E / §J).
#
# delete-when: N/A(纯加法,think.history.assemble 节点在 think.yaml 引用)。

id: concept.history.assemble
region: concept
purpose: RunSessionWriter + ForkedTools → ModelVisibleRequest typed boundary (orphan-drop applied)

nodes:
  - id: history.derive
    factory: history.derive
    inputs: [writer, state, forked_tools]
    outputs: [model_visible_request]
    config:
      emit_on_enter: []
      emit_on_exit:  []

edges: []