# bundles/concept/effect_execute.yaml — Layer 2 概念图
# ADR-0220 §3.3 — CommandEnvelope → EffectReceipt typed boundary (effect
# dispatcher, act subgraph 的 dispatch 节点)。
#
# 节点命名:1 节点以 effect. 起首,与 §0.4 N9 action-domain 闭集一致
# (effect.* 在闭集内)。
#
# 跨图引用:
#   inputs  -> act.dispatch 的 envelope port
#   outputs -> act.observe 的 receipt port
#
# delete-when: N/A(纯加法,act subgraph 引用)。

id: concept.effect.execute
region: concept
purpose: CommandEnvelope → EffectReceipt typed boundary (effect gateway dispatcher)

nodes:
  - id: effect.execute
    factory: effect.execute
    inputs: [envelope]
    outputs: [receipt]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit: []

edges: []
