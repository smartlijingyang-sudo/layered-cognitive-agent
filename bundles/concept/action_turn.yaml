# bundles/concept/action_turn.yaml — Layer 2 概念图
# ADR-0220 §3.4 — Decision → EffectReceipt typed boundary (3-node
# action sequence: resolve + capability-grant + effect.execute)。
#
# 节点命名:3 节点全部以 act. 起首,与 §0.4 N9 action-domain 闭集一致
# (act.* 在闭集内 — Decision 的 Decision.action_type 同 namespace)。
#
# 跨图引用:
#   inputs  -> business.action.turn 的 decision port
#   outputs -> business.action.turn 的 receipt port
#
# delete-when: N/A(纯加法,business.action.turn 在 P8 引用)。

id: concept.action.turn
region: concept
purpose: Decision → EffectReceipt typed boundary (3-node action sequence)

nodes:
  - id: act.action.resolve
    factory: act.action.resolve
    inputs: [decision]
    outputs: [decision]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: act.capability.grant
    factory: act.capability.grant
    inputs: [decision]
    outputs: [decision]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: act.effect.execute
    factory: act.effect.execute.ref
    inputs: [decision, state]
    outputs: [receipt]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []
      sub_spec_ref:
        plan_ref: bundles/concept/effect_execute.yaml
        entry_node: effect.execute
        binding_edge: act.effect.execute

edges:
  - source: act.action.resolve
    target: act.capability.grant
  - source: act.capability.grant
    target: act.effect.execute