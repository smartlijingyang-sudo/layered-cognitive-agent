# bundles/concept/decision_enforce.yaml — Layer 2 概念图
# ADR-0220 §3.3 — candidate Decision + AgentState → enforced Decision typed
# boundary (cross-graph transport)。
#
# 节点命名:2 节点全部以 gate. 起首,与 §0.4 N9 action-domain 闭集一致。
# §3.3 节点数 ≤ 4 (本图 2 节点,符合 G1 职责单一)。
#
# 跨图引用:
#   inputs  -> concept.decision.classify 的 decision port + state
#   outputs -> business.reasoning.turn 的 enforced decision port
#
# delete-when: N/A(纯加法,business.reasoning.turn 在 P5 引用)。

id: concept.decision.enforce
region: concept
purpose: candidate Decision + AgentState → enforced Decision (gate chain rewrite + rejection provenance)

nodes:
  - id: gate.chain.run
    factory: gate.chain.run
    inputs: [decision, state]
    # ``decision`` is passthrough: gate.chain.run reads it from
    # upstream, runs the gate chain, and forwards the original
    # decision to gate.chain.reject alongside the enforced copy
    # (which downstream uses to stamp ``routing``).
    outputs: [enforced_decision, decision]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

  - id: gate.chain.reject
    factory: gate.chain.reject
    inputs: [decision, enforced_decision]
    outputs: [decision, routing]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

edges:
  - source: gate.chain.run
    target: gate.chain.reject