# bundles/loop-dsh.yaml — opt-in DSH loop driver.
#
# Profile that needs DSH (``execution_target=dsh``) must include this
# bundle alongside ``bundles/base.yaml``. Web-app.yaml does NOT load it
# by default, because the DSH runtime (sidecar / SDK) is a separate
# deployment artifact — registering the driver without the runtime would
# surface a worse error ("machine offline") than the clean "loop plugin
# missing" we get from a smaller registry.

entries:
  - id: lca-loop-dsh
    name: lca_loop_dsh
    $module: lca.plugins.loop_dsh
    config:
      target: dsh