# bundles/remember_subgraph.yaml — remember 多节点子图
# ADR-0217 Bundle Graph Schema v2 + ADR-0221 six-phase subgraph cutover.
#
# 拓扑:write → fold(双节点 typed port pipeline)。
# write mint memory envelope + 调 effect_gateway dispatch;fold 转发
# ``memory_receipt`` port 到 outer。

id: remember.subgraph
region: remember
purpose: remember 三步执行 — admit (filter & authority gate) → write (mint envelope + dispatch) → fold (memory_receipt)

nodes:
  - id: phase.remember.admit
    factory: phase.remember.admit
    inputs: [decision, observation, reflection]
    outputs: [decision, observation, reflection, admitted, candidate, routing]
    config:

  - id: phase.remember.write
    factory: phase.remember.write
    inputs: [decision, observation, reflection, admitted, candidate]
    outputs: [memory_receipt]
    config:

  - id: phase.remember.fold
    factory: phase.remember.fold
    inputs: [memory_receipt]
    outputs: [memory_receipt]
    config:

edges:
  - from: phase.remember.admit
    to: phase.remember.write
    when: true

  - from: phase.remember.write
    to: phase.remember.fold
    when: true
