# bundles/phase_main_outer.yaml — outer plan, explicit phase topology.
#
# ADR-0221 P3 cutover: the v2 driver no longer reads
# ``phase.topology.standard`` / ``phase.topology.standard`` Cordis
# providers. Topology is declared here as a v2 BundleGraphSpec
# (ADR-0217) — the runtime kernel reads this yaml directly.
#
# D4 typed-port cutover: all edge ``when:`` predicates are typed
# :class:`Predicate` dicts (no string DSL). Cross-node reads go through
# :class:`PortReader` which resolves :class:`PortRef` against declared
# output ports. The ``routing`` port carries a :class:`RoutingDecision`
# that replaces the legacy ``result_kind`` / ``next_hint`` / ``next_hints``
# ad-hoc fields.

id: phase.main.outer
region: phase:agent
purpose: Six-phase outer plan (perceive → think → act → reflect → remember → terminal.commit) wired through sub_spec_ref into per-phase subgraphs.

nodes:
  - id: perceive.main
    region: phase:perceive
    entry: true
    sub_spec_ref:
      plan_ref: bundles/perceive/perceive_subgraph.yaml
      entry_node: phase.perceive.observe
      binding_edge: perceive.main
    declared_inputs: []
    # ``in_assembled_manifest`` is what ``think.main`` consumes next;
    # ``observation`` is the closed-port projection that downstream
    # reflect nodes may also need. Both are produced by the inner
    # ``perceive.subgraph`` fold node.
    declared_outputs: [in_assembled_manifest, observation, routing]

  - id: think.main
    region: phase:think
    sub_spec_ref:
      plan_ref: bundles/think/think_subgraph.yaml
      entry_node: think.shortcut
      binding_edge: think.main
    # think.subgraph's entry ``think.shortcut`` declares inputs:
    # ``[in_assembled_manifest]`` (per ThinkShortcutExecutor's
    # declared_inputs). The outer-facing name matches the inner
    # entry's input so SubgraphStrategy's name-based fallback
    # forwards the registry value into the inner.
    declared_inputs: [in_assembled_manifest]
    # Inner think.subgraph emits ``decision`` (the typed Decision
    # produced by decision.compose.action). SubgraphStrategy's
    # positional translation maps inner_outputs[0] to the outer
    # ``decision`` port. terminal.commit and act.main read this
    # port via the kernel-wide port registry.
    declared_outputs: [decision]

  - id: act.main
    region: phase:act
    sub_spec_ref:
      plan_ref: bundles/act/act_subgraph.yaml
      entry_node: act.validate
      binding_edge: act.main
    # Inner act.subgraph's entry ``act.validate`` reads ``decision``
    # (per ActValidateExecutor.declared_inputs). The kernel-wide
    # port registry exposes ``decision`` (the typed-port D4 boundary
    # carried from think.subgraph via the registry) so act subgraph
    # receives it.
    declared_inputs: [decision]
    # Inner act.subgraph emits ``should_terminate`` (via act.observe)
    # and the ``decision`` carried through validate/authorize/envelope.
    # ``routing`` is not produced by act's typed-port boundary;
    # routing decisions propagate via the kernel-wide port registry.
    declared_outputs: [decision, should_terminate]

  - id: reflect.main
    region: phase:reflect
    sub_spec_ref:
      plan_ref: bundles/reflect/reflect_subgraph.yaml
      entry_node: phase.reflect.score
      binding_edge: reflect.main
    # No ``declared_inputs``: the reflect subgraph reads
    # ``observation`` from the kernel-wide port registry (perceive
    # produced it earlier; the registry persists across phases).
    # Forwarding an explicit name here would fail the typed-port
    # contract check when the upstream phase doesn't produce it
    # under the same name.
    # Inner reflect.subgraph emits ``reflection`` (via score) and
    # ``routing`` (via admit_recovery); ``reflect_outcome`` was a
    # legacy alias. Downstream remember.main reads ``reflection``
    # directly from the port registry.
    declared_outputs: [reflection, routing]

  - id: remember.main
    region: phase:remember
    sub_spec_ref:
      plan_ref: bundles/remember/remember_subgraph.yaml
      entry_node: phase.remember.write
      binding_edge: remember.main
    # Inner ``phase.remember.write`` declared_inputs are
    # ``[decision, observation, reflection]`` per the executor's
    # contract; ``reflect_outcome`` was a legacy alias. The reflect
    # subgraph emits ``reflection`` upstream which we forward under
    # the same name so SubgraphStrategy's name-based fallback
    # delivers it.
    declared_inputs: [decision, observation, reflection]
    # ``memory_record`` is a legacy alias; the inner emits
    # ``memory_receipt``. ``routing`` is not produced by the
    # remember subgraph; routing decisions propagate via the
    # kernel-wide port registry.
    declared_outputs: [memory_receipt]

  - id: terminal.commit
    region: phase:terminal
    binding: terminate
    terminal: true
    # The typed-port D4 boundary emits ``decision`` (the stamped
    # Decision from think.subgraph). ``reflection`` flows through
    # from the reflect subgraph's outer port declaration.
    declared_inputs: [decision, reflection]
    declared_outputs: [terminal_outcome]
    config:
      emit_on_exit: [terminal.commit]

  # PR-3.8.6: act.approve.gate — typed-boundary HITL gate under
  # region:intervene (sibling subgraph, NOT a 7th phase — ADR-0228 §3).
  # Reads decision + command ports; emits decision + routing. Routing
  # next_hint semantics drive the outer edges below:
  #   - approve_skipped → act.envelope (needs_approval absent/False)
  #   - approve_interrupt → intervene.interrupt (needs_approval + no cmd)
  #   - approve_approved → act.envelope (command.kind == "approve")
  #   - approve_rejected → terminal.commit (reject/redirect/resume-abandon)
  - id: act.approve.gate
    factory: act.approve.gate
    region: phase:intervene
    # The gate is a pure transform of the ``decision`` port; the
    # ``command`` port is optional (consumed only on resume re-entry
    # when the kernel re-projects a persisted Command into the
    # registry). Outer plan uses ``inputs``/``outputs`` (the leaf
    # node shape; ``declared_inputs``/``declared_outputs`` only
    # apply when ``sub_spec_ref`` is present). The executor's own
    # ``declared_inputs=("decision", "command")`` keeps the typed-
    # boundary contract intact at the NodeExecutor layer.
    inputs: [decision]
    outputs: [decision, routing]

  # PR-3.8.6: intervene.interrupt outer-level wiring stub — the
  # interrupt subgraph node is reached from act.approve.gate via the
  # approve_interrupt next_hint. The subgraph itself stays the source
  # of truth (intervene.interrupt emits the typed Command +
  # RoutingDecision(should_terminate=True)).
  - id: intervene.interrupt
    region: phase:intervene
    sub_spec_ref:
      plan_ref: bundles/intervene/interrupt_subgraph.yaml
      entry_node: intervene.interrupt
      binding_edge: intervene.interrupt
    declared_inputs: [decision]
    declared_outputs: [command, routing]

  # PR-3.8.6: intervene.resume outer-level wiring stub — on resume
  # the kernel re-projects the persisted Command into the
  # kernel-wide port registry, then routes back to act.approve.gate
  # with the command port populated.
  - id: intervene.resume
    region: phase:intervene
    sub_spec_ref:
      plan_ref: bundles/intervene/resume_subgraph.yaml
      entry_node: intervene.resume
      binding_edge: intervene.resume
    declared_inputs: [command]
    declared_outputs: [decision]

edges:
  # perceive → think (model-driven continuation).
  - from: perceive.main
    to: think.main

  # think → act when decision.action_type == use_tool.
  - from: think.main
    to: act.main
    when:
      kind: eq
      port: { name: decision, field: action_type }
      value: use_tool

  # think → terminal.commit when decision.action_type == respond
  # AND decision.response_text is non-empty.
  - from: think.main
    to: terminal.commit
    when:
      kind: and
      children:
        - { kind: eq, port: { name: decision, field: action_type }, value: respond }
        - { kind: ne, port: { name: decision, field: response_text }, value: "" }

  # act → think on USE_TOOL (the re-ask-model loop).
  - from: act.main
    to: think.main
    when:
      kind: eq
      port: { name: decision, field: action_type }
      value: use_tool

  # act → terminal.commit on should_terminate.
  - from: act.main
    to: terminal.commit
    when:
      kind: eq
      port: { name: should_terminate }
      value: true

  # act → reflect.main (reflect reads observation/reflection from the
  # kernel-wide port registry; the wiring edge just routes control).
  # PR-3.8.6: route through act.approve.gate first so the gate can
  # consult needs_approval (approve_skipped / approve_approved →
  # reflect.main pass-through; approve_interrupt → intervene.interrupt;
  # approve_rejected → terminal.commit).
  - from: act.main
    to: act.approve.gate

  # reflect → remember.
  - from: reflect.main
    to: remember.main

  # remember → terminal.commit (always; commit closes the loop).
  - from: remember.main
    to: terminal.commit

  # PR-3.8.6: act.approve.gate routing edges. The gate emits a
  # ``RoutingDecision`` whose ``next_hint`` is the discriminated tag:
  #
  #   - approve_skipped / approve_approved → reflect.main (gate ran
  #     after act.main; envelope/dispatch/observe already completed
  #     inside the act subgraph, so pass-through continues to reflect)
  #   - approve_interrupt → intervene.interrupt (needs_approval + no
  #     command yet; pause for the user's typed Command)
  #   - approve_rejected → terminal.commit (reject / redirect-abandon
  #     / resume-as-timeout: abort cleanly, never re-enter act)
  #
  # Note: the plan informally references ``act.envelope`` / ``act.authorize``
  # as edge targets — those are inner nodes of ``act.subgraph``. At the
  # outer level, after act.main completes, the equivalent of "approve →
  # continue act" is to route to ``reflect.main`` (the next phase after
  # act). Re-entering ``act.main`` would re-run the act subgraph, which
  # is wrong. The ideal integration puts the gate INSIDE act.subgraph
  # (between authorize and envelope), which requires editing
  # ``bundles/act/act_subgraph.yaml`` — outside this PR's edit scope
  # per the file-modification constraint.
  - from: act.approve.gate
    to: intervene.interrupt
    when:
      kind: eq
      port: { name: routing, field: next_hint }
      value: approve_interrupt

  - from: act.approve.gate
    to: terminal.commit
    when:
      kind: eq
      port: { name: routing, field: next_hint }
      value: approve_rejected

  - from: act.approve.gate
    to: reflect.main
    when:
      kind: in
      port: { name: routing, field: next_hint }
      value: [approve_skipped, approve_approved]

  # PR-3.8.6: resume edge — intervene.resume re-feeds the journal-
  # persisted Command as a typed Decision port, then the kernel re-
  # enters the gate so the Command is consulted on resume.
  #
  # Predicate note: the plan specifies ``kind: exists, port: { name:
  # command }`` but ``intervene.resume``'s declared outputs are
  # ``[decision]`` (the Command is consumed to produce the Decision;
  # it is not re-emitted). At the outer level predicates are validated
  # against the source node's declared outputs, so a ``command``
  # predicate fails lift. The resume edge therefore fires
  # unconditionally — the kernel re-projects the persisted Command
  # into the registry before re-entering the gate, and the gate's
  # internal logic reads ``command`` from its inputs.
  #
  # NOTE (architectural gap, see task-6-report §Concerns): the plan
  # also specifies an ``act.authorize → act.approve.gate`` entry edge.
  # ``act.authorize`` is an inner node of ``act.subgraph`` (out of
  # this PR's edit scope per the file-modification constraint), so
  # that wiring belongs inside ``act_subgraph.yaml``. At the outer
  # level, the gate is reached via this resume edge only; the
  # pass-through from ``act.main`` requires act_subgraph to route
  # ``act.authorize → act.approve.gate → act.envelope`` (a follow-up
  # to this PR).
  - from: intervene.resume
    to: act.approve.gate
    when: true

  # PR-3.8.6: on resume the kernel re-projects the persisted Command
  # and re-enters via intervene.resume (which consumes command →
  # emits decision). This edge makes intervene.resume reachable from
  # intervene.interrupt (the pause point) so the resume cycle is a
  # closed loop at the outer level.
  - from: intervene.interrupt
    to: intervene.resume
    when: true
