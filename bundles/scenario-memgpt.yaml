# bundles/scenario-memgpt.yaml — memgpt scenario bundle.
# Per spec §13.5.2: working / episodic / semantic / procedural, paging policy.

entries:
  # 4-layer memory
  - id: lca-memory-four-layer
    name: lca_memory_four_layer
    $module: lca.plugins.memory.four_layer
    config:
      default_authority: tool_observation
      shared_layers:
        - semantic

  # Compaction policy — MemGPT-style paging.
  - id: lca-compaction-policy
    name: lca_compaction_policy
    $module: lca.plugins.policy.compaction
    config:
      type: memgpt-style
      summarize_after: 30
      keep_tool_pairs: true
      keep_active_approvals: true

  # Context budgeter — MemGPT context window planner.
  - id: lca-context-budgeter
    name: lca_context_budgeter
    $module: lca.plugins.budgeter.memgpt
    config:
      pin_anchors:
        - active_task
        - current_goal
        - tool_pair
