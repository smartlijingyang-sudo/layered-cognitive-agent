# bundles/reflect_subgraph.yaml — reflect 多节点子图
# ADR-0217 Bundle Graph Schema v2 + ADR-0221 six-phase subgraph cutover.
#
# 拓扑:score → admit_recovery(双节点 typed port pipeline)。
# score 调 reflection pipeline / brain 产 typed reflection;admit_recovery
# 根据 observation.success 决定 next_hint + 决定 outer loop 是否走 recovery
# 边(replaces 旧 RecoveryReflectExecutor)。

id: reflect.subgraph
region: phase:reflect
purpose: reflect 双步执行 — score (reflection pipeline) → admit_recovery (recovery hint)

nodes:
  - id: reflect.score
    factory: phase.reflect.score
    inputs: [observation]
    outputs: [reflection]
    config:
      max_visits: 1

  - id: reflect.admit_recovery
    factory: phase.reflect.admit_recovery
    inputs: [observation, reflection]
    outputs: [reflection, admit_recovery]
    config:
      max_visits: 1

edges:
  - from: reflect.score
    to: reflect.admit_recovery
    when: true
