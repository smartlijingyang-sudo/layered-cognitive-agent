# bundles/spine-default.yaml — 18-plugin spine composition (PR-7/PR-8 §7.6.6).
#
# Per ADR-0165 + ADR-0165.1, the EventSpine is composed from 18 close-set
# plugins (L2 spine.core + L1 emit_pipeline + 15 L0 producers / classifiers /
# derivers / sinks / wraps). Profile decides which subset is enabled;
# this bundle declares the full set with:
#
# - plugins already implemented under lca/plugins/observability/spine/
#   (PR-1 .. PR-7 landing): enabled.
# - plugins whose module path is not yet present in the tree: declared
#   ``disabled: true`` so the profile boots today without missing-import
#   errors. PR-8 / follow-up PRs remove the disabled flag once the module
#   lands.
#
# The 19th spine plugin — `spine.reflector.source` (source-level
# introspection, PR-9) — is intentionally omitted here. oii-debug.yaml
# loads it via a separate bundle entry + patch.
#
# requires: observability-default (EventDescriptor registry) — not
# declared as a hard ``requires:`` because that field is purely
# informational in the bundle schema; the DAG check in resolve_profile
# enforces ordering via provides→requires across entries.

name: spine-default
description: |
  Spine 18-plugin composition (PR-7 + PR-8 §7.6.6). Enabled plugins match
  the spec; unimplemented modules are declared disabled for forward
  compatibility. Profile overrides via `patch:` per spine design §7.6.6.

# Informational: which spine-side plugins this bundle wires.
# Source-level attacher (spine.reflector.source) is omitted here per
# brief §7.6.6: it ships only with the oii-debug profile. The web
# standard profile uses this bundle as-is.
plugins:
  - spine.core
  - spine.emit_pipeline
  - spine.reflector.signature
  - spine.reflector.context
  - spine.reflector.runtime
  - spine.classifier.exception.builtin
  - spine.classifier.exception.unclass
  - spine.spantree
  - spine.deriver.anomaly
  - spine.deriver.step_tree
  - spine.deriver.narrative
  - spine.deriver.graph
  - spine.deriver.live_tail
  - spine.sink.file
  - spine.sink.console
  - spine.wrap.ctx_effect
  - spine.wrap.ctx_intercept
  - spine.wrap.assembler

entries:
  # ── L2 composer ────────────────────────────────────────────────
  - id: spine.core
    name: spine_core
    $module: lca.plugins.observability.spine.core
    disabled: true   # forward-looking; lands with PR-8 spine.core
    config: {}

  # ── L1 pipeline ────────────────────────────────────────────────
  - id: spine.emit_pipeline
    name: spine_emit_pipeline
    $module: lca.plugins.observability.spine.emit_pipeline
    config: {}

  # ── L0 reflectors (4) ───────────────────────────────────────────
  - id: spine.reflector.signature
    name: spine_reflector_signature
    $module: lca.plugins.observability.spine.reflectors.signature
    config: {}

  - id: spine.reflector.context
    name: spine_reflector_context
    $module: lca.plugins.observability.spine.reflectors.context
    config: {}

  - id: spine.reflector.runtime
    name: spine_reflector_runtime
    $module: lca.plugins.observability.spine.reflectors.runtime
    config: {}

  # ── L0 classifiers (2) ──────────────────────────────────────────
  - id: spine.classifier.exception.builtin
    name: spine_classifier_exception_builtin
    $module: lca.plugins.observability.spine.classifiers.exception_builtin
    config: {}

  - id: spine.classifier.exception.unclass
    name: spine_classifier_exception_unclass
    $module: lca.plugins.observability.spine.classifiers.exception_unclass
    config: {}

  # ── L0 span tree (1) ────────────────────────────────────────────
  - id: spine.spantree
    name: spine_spantree
    $module: lca.plugins.observability.spine.spantree
    config: {}

  # ── L0 derivers (5) ─────────────────────────────────────────────
  - id: spine.deriver.anomaly
    name: spine_deriver_anomaly
    $module: lca.plugins.observability.spine.derivers.anomaly
    config: {}

  - id: spine.deriver.step_tree
    name: spine_deriver_step_tree
    $module: lca.plugins.observability.spine.derivers.step_tree
    disabled: true   # forward-looking; PR-8 derivers
    config: {}

  - id: spine.deriver.narrative
    name: spine_deriver_narrative
    $module: lca.plugins.observability.spine.derivers.narrative
    disabled: true   # forward-looking; PR-8 derivers
    config: {}

  - id: spine.deriver.graph
    name: spine_deriver_graph
    $module: lca.plugins.observability.spine.derivers.graph
    disabled: true   # forward-looking; PR-8 derivers
    config: {}

  - id: spine.deriver.live_tail
    name: spine_deriver_live_tail
    $module: lca.plugins.observability.spine.derivers.live_tail
    disabled: true   # forward-looking; PR-8 derivers (requires webserver_bootstrap)
    config: {}

  # ── L0 sinks (2) ────────────────────────────────────────────────
  - id: spine.sink.file
    name: spine_sink_file
    $module: lca.plugins.observability.spine.sinks.file
    disabled: true   # forward-looking; PR-8 sinks (provides file_sink)
    config:
      path: .lca/spine/events.jsonl

  - id: spine.sink.console
    name: spine_sink_console
    $module: lca.plugins.observability.spine.sinks.console
    disabled: true   # forward-looking; PR-8 sinks
    config: {}

  # ── L0 wraps (3) ────────────────────────────────────────────────
  - id: spine.wrap.ctx_effect
    name: spine_wrap_ctx_effect
    $module: lca.plugins.observability.spine.wraps.ctx_effect
    disabled: true   # forward-looking; PR-8 wraps
    config: {}

  - id: spine.wrap.ctx_intercept
    name: spine_wrap_ctx_intercept
    $module: lca.plugins.observability.spine.wraps.ctx_intercept
    disabled: true   # forward-looking; PR-8 wraps
    config: {}

  - id: spine.wrap.assembler
    name: spine_wrap_assembler
    $module: lca.plugins.observability.spine.wraps.assembler
    disabled: true   # forward-looking; PR-8 wraps (requires compile_profile)
    config: {}