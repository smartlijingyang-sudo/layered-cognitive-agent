# bundles/scenario-voyager.yaml — voyager scenario bundle.
# Per spec §13.5.1: Skill 习得 → procedural memory; Critic 提炼.

entries:
  # Skill auto-acquisition — the heart of Voyager.
  - id: lca-skill-auto-acquire
    name: lca_skill_auto_acquire
    $module: lca.plugins.skill.auto_acquire
    config:
      enabled: true
      min_confidence: 0.7
      min_evidence: 3

  # Memory (4 layers; procedural is the storage for skills)
  - id: lca-memory-four-layer
    name: lca_memory_four_layer
    $module: lca.plugins.memory.four_layer
    config:
      max_procedural: 10000
      default_authority: model_inference

  # Tools — Voyager exercises shell + file-write + test-run.
  - id: lca-tool-bash
    name: lca_tool_bash
    $module: lca.plugins.tools.bash
    config:
      allowed: true

  - id: lca-tool-file-write
    name: lca_tool_file_write
    $module: lca.plugins.tools.file_write
    config:
      allowed: true

  - id: lca-tool-test-run
    name: lca_tool_test_run
    $module: lca.plugins.tools.test_run
    config:
      allowed: true
