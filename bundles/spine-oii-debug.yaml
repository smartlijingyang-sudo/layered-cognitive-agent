# bundles/spine-oii-debug.yaml — source-level attacher for OII debugging.
#
# Adds `spine.reflector.source` (PR-9) on top of the spine-default
# composition. The reflector captures `inspect.currentframe()` location
# and a 4 KB redact-truncated locals snapshot on every emit call; it is
# intentionally kept out of web-standard / benchmark because the
# snapshotting cost and the secret-redaction surface are not justified
# for normal production traffic.
#
# Used by profiles/oii-debug.yaml.

name: spine-oii-debug
description: |
  Spine source-level attacher bundle (PR-9). Loaded only by oii-debug
  profiles; web-standard / benchmark deliberately omit it.

# Informational: which spine-side plugins this bundle wires.
plugins:
  - spine.reflector.source

entries:
  - id: spine.reflector.source
    name: spine_reflector_source
    $module: lca.plugins.observability.spine.reflectors.source
    config:
      max_locals_bytes: 4096
      redact_patterns:
        - "sk-[A-Za-z0-9]{16,}"
        - "AKIA[0-9A-Z]{16}"
        - "xox[baprs]-[A-Za-z0-9-]{10,}"
        - "ghp_[A-Za-z0-9]{36}"
        - "gho_[A-Za-z0-9]{36}"