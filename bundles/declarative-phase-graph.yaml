# ADR-0075 + ADR-0221: 默认认知阶段只通过显式 PhaseExecutor capability 选择。
#
# .. note::
#   Backward-compat only (ADR-0210 §6.3 P7 §6.5). The P7 region-tag
#   path is the recommended runtime: ``spec.region + spec.phase`` +
#   ``profile.regions.declare``. This bundle is kept so legacy profiles
#   that wire ``declarative-phase-graph.yaml`` still resolve. New
#   profiles should NOT depend on this bundle — the region-tag path
#   covers all use cases.
#
# ADR-0221 cutover: every phase main now enters its dedicated subgraph
# bundle via node-level ``sub_spec_ref`` — no ``binding: phase.<x>.standard``
# references remain. Control plugins are registered under ``bundles/base.yaml``
# and wired into the subgraphs by the active Profile / Bundle patch.
#
# delete-when: All production profiles migrated to region-tag path AND
# ADR-0210 升 Accepted.
entries:
  - id: phase.topology.standard
    name: phase_topology_standard
    $module: lca.plugins.loop.graph.topology.standard.plugin
    config:
      nodes:
        - id: perceive.main
          phase: perceive
          max_visits: 8
          entry: true
          # ADR-0221: phase main is subgraph-driven; no phase.<x>.standard
          # binding remains. The interpreter enters the subgraph via
          # ``sub_spec_ref`` and dispatches NodeExecutor plugins.
          sub_spec_ref:
            plan_ref: bundles/perceive_subgraph.yaml
            entry_node: perceive.observe
            binding_edge: perceive.main
        - id: think.main
          phase: think
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/think.yaml
            entry_node: think.shortcut
            binding_edge: think.main
        - id: act.main
          phase: act
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/act.yaml
            entry_node: act.validate
            binding_edge: act.main
        - id: reflect.main
          phase: reflect
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/reflect_subgraph.yaml
            entry_node: reflect.score
            binding_edge: reflect.main
        - id: remember.main
          phase: remember
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/remember_subgraph.yaml
            entry_node: remember.write
            binding_edge: remember.main
        - id: stop.main
          phase: stop
          max_visits: 8
          terminal: true
          sub_spec_ref:
            plan_ref: bundles/stop_subgraph.yaml
            entry_node: stop.should_check
            binding_edge: stop.main

  # 生产默认值：非副作用阶段可处理瞬时故障；动作阶段依赖 Effect Gateway 的
  # 幂等语义，超时后不重放。所有常规阶段耗尽后均由图显式收敛至 stop。
  - id: phase.execution_policy.resilient
    name: phase_execution_policy_resilient
    $module: lca.plugins.loop.graph.resilient.plugin
    config:
      policies:
        perceive:
          max_attempts: 2
          timeout_seconds: 20
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        think:
          max_attempts: 2
          timeout_seconds: 90
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.5
          on_exhausted: route_to_stop
        act:
          max_attempts: 1
          timeout_seconds: 90
          on_exhausted: route_to_stop
        reflect:
          max_attempts: 2
          timeout_seconds: 30
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        remember:
          max_attempts: 1
          timeout_seconds: 30
          on_exhausted: route_to_stop

  # ADR-0075: 图的所有阶段连边由 Profile/Bundle 声明，编译器只验证并解释。
  - id: phase.edge.standard
    name: phase_edge_standard
    $module: lca.plugins.loop.graph.edges.standard.plugin
    config:
      approval_resume_node: think.main
      edges:
        - source: perceive.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: perceive.main
          target: think.main
          when: true
        - source: think.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: think.main
          target: act.main
          when: true
        - source: act.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: act.main
          target: reflect.main
          when: true
        - source: reflect.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: reflect.main
          target: remember.main
          when: true
        - source: remember.main
          target: stop.main
          when: true
        - source: stop.main
          target: perceive.main
          when: not result.payload.should_stop
          loop:
            max_iterations: 8
            budget: run.steps
            terminal_predicate: result.payload.should_stop == true
