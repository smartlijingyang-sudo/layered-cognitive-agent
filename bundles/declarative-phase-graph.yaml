# HISTORY / RESIDUAL (M1 Issue #14 — 2026-09-15)
#
# This bundle is NO LONGER a ControlPlan edge source of truth.
# Production outer topology + edges (including recovery + terminal.commit)
# live solely in ``bundles/outer/phase_main.yaml``.
#
# The former ``phase.edge.standard`` edge table (stop.main short-circuits,
# stop→perceive loop) is retired. Do not reintroduce a second outer edge
# table here.
#
# Optional residual: resilient execution *policy* (retry/timeout) is kept
# below for non-production profiles that still opt in — it is NOT an edge
# table. Prefer moving policy onto outer edge obligations / Gate later.
#
# delete-when: 2026-10-15 — drop resilient residual once no profile lists
# this file AND ADR-0210 Accepted migration note updated; then delete file.
#
# .. note::
#   Backward-compat residual only. New profiles MUST pull
#   ``bundles/outer/phase_main.yaml`` (+ phase subgraphs) and must NOT
#   depend on this bundle for edges.

entries:
  # Non-edge residual: phase execution policy (retry/timeout). Not ControlPlan edges.
  - id: phase.execution_policy.resilient
    name: phase_execution_policy_resilient
    $module: lca.plugins.loop.graph.resilient.plugin
    config:
      policies:
        perceive:
          max_attempts: 2
          timeout_seconds: 20
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        think:
          max_attempts: 2
          timeout_seconds: 90
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.5
          on_exhausted: route_to_stop
        act:
          max_attempts: 1
          timeout_seconds: 90
          on_exhausted: route_to_stop
        reflect:
          max_attempts: 2
          timeout_seconds: 30
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        remember:
          max_attempts: 1
          timeout_seconds: 30
          on_exhausted: route_to_stop
