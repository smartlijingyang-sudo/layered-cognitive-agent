# ADR-0075 + ADR-0221: 默认认知阶段只通过显式 PhaseExecutor capability 选择。
#
# .. note::
#   Backward-compat only (ADR-0210 §6.3 P7 §6.5). The P7 region-tag
#   path is the recommended runtime: ``spec.region + spec.phase`` +
#   ``profile.regions.declare``. This bundle is kept so legacy profiles
#   that wire ``declarative-phase-graph.yaml`` still resolve. New
#   profiles should NOT depend on this bundle — the region-tag path
#   covers all use cases.
#
# ADR-0221 cutover: every phase main now enters its dedicated subgraph
# bundle via node-level ``sub_spec_ref`` — no ``binding: phase.<x>.standard``
# references remain. Control plugins are registered under ``bundles/base.yaml``
# and wired into the subgraphs by the active Profile / Bundle patch.
#
# delete-when: All production profiles migrated to region-tag path AND
# ADR-0210 升 Accepted.
entries:
  # ADR-0221 P3 + outer-plan cutover: the legacy ``phase.topology.standard``
  # Cordis provider is gone; outer plan topology lives in
  # ``bundles/phase_main_outer.yaml``. Profiles that previously relied on
  # this entry now pull ``phase_main_outer.yaml`` into their bundles list.

  # 生产默认值：非副作用阶段可处理瞬时故障；动作阶段依赖 Effect Gateway 的
  # 幂等语义，超时后不重放。所有常规阶段耗尽后均由图显式收敛至 stop。
  - id: phase.execution_policy.resilient
    name: phase_execution_policy_resilient
    $module: lca.plugins.loop.graph.resilient.plugin
    config:
      policies:
        perceive:
          max_attempts: 2
          timeout_seconds: 20
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        think:
          max_attempts: 2
          timeout_seconds: 90
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.5
          on_exhausted: route_to_stop
        act:
          max_attempts: 1
          timeout_seconds: 90
          on_exhausted: route_to_stop
        reflect:
          max_attempts: 2
          timeout_seconds: 30
          retry_on: [timeout, transient]
          initial_backoff_seconds: 0.25
          on_exhausted: route_to_stop
        remember:
          max_attempts: 1
          timeout_seconds: 30
          on_exhausted: route_to_stop

  # ADR-0075: 图的所有阶段连边由 Profile/Bundle 声明，编译器只验证并解释。
  - id: phase.edge.standard
    name: phase_edge_standard
    $module: lca.plugins.loop.graph.edges.standard.plugin
    config:
      approval_resume_node: think.main
      edges:
        - source: perceive.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: perceive.main
          target: think.main
          when: true
        - source: think.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: think.main
          target: act.main
          when: true
        - source: act.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: act.main
          target: reflect.main
          when: true
        - source: reflect.main
          target: stop.main
          when: result.payload.should_stop == true and result.payload.reason == "error"
        - source: reflect.main
          target: remember.main
          when: true
        - source: remember.main
          target: stop.main
          when: true
        - source: stop.main
          target: perceive.main
          when: not result.payload.should_stop
          loop:
            max_iterations: 8
            budget: run.steps
            terminal_predicate: result.payload.should_stop == true
