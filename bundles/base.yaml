  - id: lca-cli-debug-trace
    name: lca_providers_cli_debug_trace
    $module: lca.plugins.providers.cli_debug_trace
    config: {}

  # ── ADR-0063 PR-10: GenAI semantic mappers ──
  - id: lca-genai-semantic-mapper-seam
    name: lca_seam_genai
