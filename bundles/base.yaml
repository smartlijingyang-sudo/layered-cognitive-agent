# bundles/base.yaml — LCA core capability services (cordis YAML format).
# Replaces the legacy bundles/base-spine.yaml.
#
# YAML format: top-level `entries:` list. Each entry has id, name, $module, config.
#   $module is the importable Python module path; boot.py resolves it via
#   importlib.import_module() and invokes module.setup.setup(ctx, config)
#   (the cordis @plugin decorator wraps the function in a Plugin dataclass
#   whose `setup` field holds the original async function).

entries:
  # ── Tier-1: Service Definitions (13 base capabilities) ───────────
  - id: lca-llm-service
    name: lca_llm_service
    $module: lca.plugins.seam_definitions.llm
    config: {}

  - id: lca-tools-service
    name: lca_tools_service
    $module: lca.plugins.seam_definitions.tools
    config: {}

  - id: lca-transport-service
    name: lca_transport_service
    $module: lca.plugins.seam_definitions.transport
    config: {}

  - id: lca-skills-service
    name: lca_skills_service
    $module: lca.plugins.seam_definitions.skills
    config: {}

  - id: lca-file-store-service
    name: lca_file_store_service
    $module: lca.plugins.seam_definitions.file_store
    config: {}

  - id: lca-observability-service
    name: lca_observability_service
    $module: lca.plugins.seam_definitions.observability_service
    config: {}

  - id: lca-sandbox-service
    name: lca_sandbox_service
    $module: lca.plugins.seam_definitions.sandbox
    config: {}

  - id: lca-memory-service
    name: lca_memory_service
    $module: lca.plugins.seam_definitions.memory
    config: {}

  - id: lca-search-service
    name: lca_search_service
    $module: lca.plugins.seam_definitions.search
    config: {}

  - id: lca-state-store-service
    name: lca_state_store_service
    $module: lca.plugins.seam_definitions.state_store
    config: {}

  # Sole owner of LLM credentials (.env + aliases) and the chat adapter.
  - id: lca-llm-resolver
    name: lca_llm_resolver
    $module: lca.plugins.seam_definitions.llm_resolver
    config:
      default_model: qwen3.7-plus

  - id: lca-memory-provider
    name: lca_providers_memory
    $module: lca.plugins.providers.memory
    config:
      providers: [simple]

  - id: lca-state-store-provider
    name: lca_providers_state_store
    $module: lca.plugins.providers.state_store
    config:
      providers: [memory]

  - id: lca-search-provider
    name: lca_providers_search
    $module: lca.plugins.providers.search
    config:
      providers: [tavily]

  - id: lca-tools-provider
    name: lca_providers_tools
    $module: lca.plugins.providers.tools
    config:
      factories: [g2a]

  - id: lca-transport-provider
    name: lca_providers_transport
    $module: lca.plugins.providers.transport
    config:
      providers: [internal, a2a, mcp]

  - id: lca-skills-provider
    name: lca_providers_skills
    $module: lca.plugins.providers.skills
    config:
      providers: [disk]

  - id: lca-file-store-provider
    name: lca_providers_file_store
    $module: lca.plugins.providers.file_store
    config:
      providers: [local]

  - id: lca-sandbox-provider
    name: lca_providers_sandbox
    $module: lca.plugins.providers.sandbox
    config:
      providers: [local]

  # ── ADR-0063 PR-7: EventDescriptor 单一源 + Registry ──
  - id: lca-event-descriptor-registry
    name: lca_seam_event_descriptor
    $module: lca.plugins.seam_definitions.observability.event_descriptor
    config: {}

  - id: lca-event-descriptor-bootstrap
    name: lca_providers_event_descriptor
    $module: lca.plugins.providers.event_descriptor
    config: {}

  # ── ADR-0063 PR-8: JournalStoreBackend factory registry ──
  - id: lca-journal-store-factory-registry
    name: lca_seam_journal_store
    $module: lca.plugins.seam_definitions.journal_store_factories
    config: {}

  - id: lca-fact-store-memory-factory
    name: lca_providers_fact_store_memory
    $module: lca.plugins.providers.fact_store_memory
    config: {}

  # ── Facade plugin-ification: 4 backend seams + providers ──
  - id: lca-journal-seam
    name: lca_seam_journal
    $module: lca.plugins.seam_definitions.observability.journal
    config: {}

  - id: lca-tracer-seam
    name: lca_seam_tracer
    $module: lca.plugins.seam_definitions.observability.tracer
    config: {}

  - id: lca-attribute-policy-seam
    name: lca_seam_attribute_policy
    $module: lca.plugins.seam_definitions.observability.attribute_policy
    config: {}

  - id: lca-fact-reader-seam
    name: lca_seam_fact_reader
    $module: lca.plugins.seam_definitions.observability.fact_reader
    config: {}

  - id: lca-fact-scorer-seam
    name: lca_seam_fact_scorer
    $module: lca.plugins.seam_definitions.observability.fact_scorer
    config: {}

  - id: lca-journal-memory-factory
    name: lca_providers_journal_memory
    $module: lca.plugins.providers.journal_memory
    config: {}

  - id: lca-tracer-otel-factory
    name: lca_providers_tracer_otel
    $module: lca.plugins.providers.tracer_otel
    config: {}

  - id: lca-attribute-policy-default-factory
    name: lca_providers_attribute_policy
    $module: lca.plugins.providers.attribute_policy
    config: {}

  - id: lca-fact-reader-console-factory
    name: lca_providers_fact_reader_console
    $module: lca.plugins.providers.fact_reader_console
    config: {}

  - id: lca-fact-reader-jsonl-factory
    name: lca_providers_fact_reader_jsonl
    $module: lca.plugins.providers.fact_reader_jsonl
    config: {}

  - id: lca-fact-reader-otel-factory
    name: lca_providers_fact_reader_otel
    $module: lca.plugins.providers.fact_reader_otel
    config: {}

  - id: lca-fact-reader-langfuse-factory
    name: lca_providers_fact_reader_langfuse
    $module: lca.plugins.providers.fact_reader_langfuse
    config: {}

  - id: lca-langfuse-eval-scorer
    name: lca_providers_fact_scorer_langfuse
    $module: lca.plugins.providers.fact_scorer_langfuse
    config: {}

  # ── ADR-0063 PR-9: TraceInspector tools + CLI debug commands ──
  - id: lca-trace-tool-seam
    name: lca_seam_trace_tool
    $module: lca.plugins.seam_definitions.observability.trace_tool
    config: {}

  - id: lca-trace-tool-provider
    name: lca_providers_trace_tool
    $module: lca.plugins.providers.trace_tool
    config: {}

  - id: lca-cli-debug-command-seam
    name: lca_seam_cli_debug
    $module: lca.plugins.seam_definitions.observability.cli_debug
