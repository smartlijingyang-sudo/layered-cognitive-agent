# Guard Stack bundle — Hermes convergence + DSH guard analogs (ADR-0197)
#
# Compose after gates service, before safe_executor.simple.
entries:
- id: loop.policy.default
  name: loop_policy_default
  $module: lca.plugins.cognitive.loop.policy.plugin
  config:
    repeat_warn: 3
    break_failures: 3
    break_stalled: 3
    progress_warn: 3
    progress_break: 6
    repeat_thresholds: [3, 5, 8]
    arguments_preview_chars: 500
- id: tool.guards.service
  name: tool_guards_service
  $module: lca.plugins.cognitive.body.tool_guards_service.plugin
  config: {}
- id: guard.tool-timeout
  name: guard_tool_timeout
  $module: lca.plugins.cognitive.body.guard_tool_timeout.plugin
  config:
    enabled: true
- id: guard.tool-result-spill
  name: guard_tool_result_spill
  $module: lca.plugins.cognitive.body.guard_tool_result_spill.plugin
  config:
    max_inline_bytes: 50000
