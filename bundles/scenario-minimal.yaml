# bundles/scenario-minimal.yaml — minimal scenario bundle.
# Per spec §13.2.1 (scenario 1): only bash + str_replace_editor tools.
# Other v3 primitives stay Null by default.

entries:
  # Tools (Tier-3) — minimal allowed set
  - id: lca-tool-bash
    name: lca_tool_bash
    $module: lca.plugins.tools.bash
    config:
      allowed: true

  - id: lca-tool-str-replace-editor
    name: lca_tool_str_replace_editor
    $module: lca.plugins.tools.str_replace_editor
    config:
      allowed: true

  # Loop driver (Tier-3) — cognitive runtime is the only assembly path.
  - id: lca-loop-cognitive
    name: lca_loop_cognitive
    $module: lca.plugins.loop_drivers.cognitive
    config: {}
