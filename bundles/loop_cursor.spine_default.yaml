# bundles/loop_cursor.spine_default.yaml — spine composition (PR-7/PR-8 §7.6.6 + transport).
#
# Per ADR-0165 + ADR-0165.1, the EventSpine is composed from close-set
# plugins (L2 spine.core + L1 emit_pipeline + L0 producers / classifiers /
# derivers / sinks / wraps). Profile decides which subset is enabled.
#
# Debug-only plugins (spine.reflector.signature, spine.reflector.transport,
# spine.wrap.ctx_effect, spine.wrap.ctx_intercept) live in
# ``bundles/loop_cursor.spine_debug.yaml`` and are only loaded by the
# ``oii-debug`` profile.
#
# Source-level attacher (spine.reflector.source, ADR-0165.1 §96 + PR-9 /
# ADR-2026-09-02-i17-traceback §D3) is **mandatory** here — I17 is a
# spine-wide contract; enabling any profile that uses this bundle
# implicitly opts in. The historical "skip on production / enable on
# debug" toggle is removed: without source_location in every start
# event, traces are unrecoverable.
#
# requires: observability-default (EventDescriptor registry) — not
# declared as a hard ``requires:`` because that field is purely
# informational in the bundle schema; the DAG check in resolve_profile
# enforces ordering via provides→requires across entries.

name: loop_cursor.spine_default
kind: loop_cursor_bundle
description: |
  Spine 15-plugin composition (PR-7 + PR-8 §7.6.6 + PR-9 source
  attacher). All production modules are present and enabled. Profile
  overrides via `patch:` per spine design §7.6.6.

# ADR-0174 §D2 loop_cursor bundle 契约(每 profile 一个 loop_cursor.spine_*
# bundle,必 declares provides 列表)。
provides:
  - loop_cursor_factory
  - projection_host
  - persistence
  - model_visible
  - close_barrier

# ADR-0174 §D2 影响面:本 bundle 不依赖 coord.emit_phase / coord.begin_step
# 等(renovated),所有阶段信号由 LoopCursor.advance(...) 单一入口产生。
profile_aliases:
  - web-standard

# Informational: which spine-side plugins this bundle wires.
# Source-level attacher is mandatory (ADR-2026-09-02 §D3).
plugins:
  - spine.core
  - spine.emit_pipeline
  - spine.reflector.source
  - spine.reflector.context
  - spine.reflector.runtime
  - spine.classifier.exception.builtin
  - spine.classifier.exception.unclass
  - spine.spantree
  - spine.deriver.anomaly
  # ADR-0167 D11.4: default writable matrix assembly
  # (Emitter=SpineEmitter + Driver=StandardDriver + Coalescer=LineCoalescer
  #  + Serializer=NdjsonSerializer + Storage=RoutingFileStorage).
  # Provides writable_face_registry consumed by transport/journal_setup
  # to construct StepCoordinator per run.
  - writable.matrix.default
  - spine.deriver.narrative
  - spine.deriver.graph
  - spine.deriver.live_tail
  - spine.sink.file
  - spine.sink.console
  - spine.wrap.assembler

entries:
  # ── L2 composer ────────────────────────────────────────────────
  - id: spine.core
    name: spine_core
    $module: lca.plugins.observability.spine.core
    config: {}

  # ── L1 pipeline ────────────────────────────────────────────────
  - id: spine.emit_pipeline
    name: spine_emit_pipeline
    $module: lca.plugins.observability.spine.emit_pipeline
    config: {}

  # ── L0 reflectors (3) ───────────────────────────────────────────
  - id: spine.reflector.source
    name: spine_reflector_source
    $module: lca.plugins.observability.spine.reflectors.source
    config: {}

  - id: spine.reflector.context
    name: spine_reflector_context
    $module: lca.plugins.observability.spine.reflectors.context
    config: {}

  # ── L0 classifiers (2) ──────────────────────────────────────────
  - id: spine.classifier.exception.builtin
    name: spine_classifier_exception_builtin
    $module: lca.plugins.observability.spine.classifiers.exception_builtin
    config: {}

  - id: spine.classifier.exception.unclass
    name: spine_classifier_exception_unclass
    $module: lca.plugins.observability.spine.classifiers.exception_unclass
    config: {}

  # ── L0 span tree (1) ────────────────────────────────────────────
  - id: spine.spantree
    name: spine_spantree
    $module: lca.plugins.observability.spine.spantree
    config: {}

  # ── L0 derivers (5) ─────────────────────────────────────────────
  - id: spine.deriver.anomaly
    name: spine_deriver_anomaly
    $module: lca.plugins.observability.spine.derivers.anomaly
    config: {}

  - id: spine.deriver.narrative
    name: spine_deriver_narrative
    $module: lca.plugins.observability.spine.derivers.narrative
    config: {}

  - id: spine.deriver.graph
    name: spine_deriver_graph
    $module: lca.plugins.observability.spine.derivers.graph
    config: {}

  - id: spine.deriver.live_tail
    name: spine_deriver_live_tail
    $module: lca.plugins.observability.spine.derivers.live_tail
    config: {}

  # ── L0 sinks (2) ────────────────────────────────────────────────
  - id: spine.sink.file
    name: spine_sink_file
    $module: lca.plugins.observability.spine.sinks.file
    config:
      # ADR-0165.1: boot → .lca/spine/boot-events.jsonl;
      # real runs → traces/runs/<run_id>/events.jsonl
      boot_path: .lca/spine/boot-events.jsonl
      runs_root: traces/runs


  # ── L2 writable matrix assembly (ADR-0167 D11.4) ─────────────
  - id: writable.matrix.default
    name: writable_matrix_default
    $module: lca.plugins.observability.writable_matrix.assembly
    config: {}

  - id: spine.sink.console
    name: spine_sink_console
    $module: lca.plugins.observability.spine.sinks.console
    config: {}

  # ── L0 wraps (1) ────────────────────────────────────────────────
  - id: spine.wrap.assembler
    name: spine_wrap_assembler
    $module: lca.plugins.observability.spine.wraps.assembler
    config: {}
