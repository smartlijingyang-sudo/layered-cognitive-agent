# Think 5-step phase graph node executors.
# Loaded by web-standard and think-subgraph-dev profiles to ensure
# all five phase.think.{shortcut,route,reason,classify,gate} providers are
# registered when the subgraph compiles.

entries:
  - id: phase.think.shortcut
    name: phase_think_shortcut
    $module: lca.plugins.think.shortcut.plugin
    config: {}

  - id: phase.think.route
    name: phase_think_route
    $module: lca.plugins.think.route.plugin
    config: {}

  - id: phase.think.reason
    name: phase_think_reason
    $module: lca.plugins.think.reason.plugin
    config: {}

  - id: phase.think.classify
    name: phase_think_classify
    $module: lca.plugins.think.classify.plugin
    config: {}

  - id: phase.think.gate
    name: phase_think_gate
    $module: lca.plugins.think.gate.plugin
    config: {}
