# bundles/primitive/llm_call.yaml — Layer 1 原语图
# ADR-0220 §3.2 — ReasonerTurnRender + ForkedTools + AgentState → LLMResponse。
#
# 单节点 llm.invoke 是唯一的 LLM 调用入口(原语图,运行时原语),把所有
# ModelVisible ContextVar bind / reset 收口到 typed boundary。PromptReasoner
# 在 P5 后不再直接调 execute_llm_turn,改走本图节点。
#
# §0.4 N9 action-domain 闭集:节点 id 第一段必须是 llm。
# §3.2 node count ≤ 6 (本图 1 节点)。

id: primitive.llm.call
region: primitive
purpose: per-turn typed LLM call — ReasonerTurnRender + ForkedTools + AgentState → LLMResponse

nodes:
  - id: llm.invoke
    factory: llm.invoke
    inputs: [render, tools, state]
    outputs: [response]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []

edges: []