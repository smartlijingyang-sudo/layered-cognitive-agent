# bundles/researcher-doc-tools.yaml — researcher (doc) role bundle.
# Per spec §3.7.4: doc researcher — read/search docs only; no shell/web/git.

entries:
  - id: lca-tool-file-read
    name: lca_tool_file_read
    $module: lca.plugins.tools.file_read
    config:
      allowed: true

  - id: lca-tool-doc-search
    name: lca_tool_doc_search
    $module: lca.plugins.tools.doc_search
    config:
      allowed: true

  - id: lca-tool-fs-search
    name: lca_tool_fs_search
    $module: lca.plugins.tools.fs_search
    config:
      allowed: true
