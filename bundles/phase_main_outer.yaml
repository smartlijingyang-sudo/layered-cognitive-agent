# bundles/phase_main_outer.yaml — outer plan, explicit phase topology.
#
# ADR-0221 P3 cutover: the v2 driver no longer reads
# ``phase.topology.standard`` / ``phase.topology.standard`` Cordis
# providers. Topology is declared here as a v2 BundleGraphSpec
# (ADR-0217) — the runtime kernel reads this yaml directly.
#
# Each ``phase.<x>.main`` node carries a ``sub_spec_ref`` that
# delegates to the corresponding phase subgraph bundle. The interpreter
# enters the subgraph via ``sub_spec_ref.entry_node`` and returns to
# the outer traversal at ``sub_spec_ref.binding_edge``.
#
# The post-stop-decision-retirement shape: the outer plan advances
# perceive → think → act → reflect → remember on the data shape
# ``decision.action_type`` and ``decision.response_text``. The
# ``terminal.commit`` outer node is dispatched by the v2 driver through
# the new ``BindingKind.TERMINAL_COMMIT`` binding kind. Loop control is
# no longer a host-side policy; ``terminal.commit`` runs once and the
# kernel commits a typed ``StopDecision`` to the reducer. The driver
# emits ``SPINE_TERMINAL_COMMIT`` at the same site.
#
# Edges: ``act.main → think.main`` carries the USE_TOOL → re-ask-model
# loop. ``<phase>.main → terminal.commit`` carries the model-driven
# RESPOND-with-output path. There is no legacy ``should_stop`` predicate.

id: phase.main.outer
region: phase:agent
purpose: Six-phase outer plan (perceive → think → act → reflect → remember → terminal.commit) wired through sub_spec_ref into per-phase subgraphs.

nodes:
  - id: perceive.main
    region: phase:perceive
    max_visits: 8
    entry: true
    sub_spec_ref:
      plan_ref: bundles/perceive_subgraph.yaml
      entry_node: phase.perceive.observe
      binding_edge: perceive.main
    declared_inputs: []
    declared_outputs: [perceive_payload]

  - id: think.main
    region: phase:think
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/think.yaml
      entry_node: think.shortcut
      binding_edge: think.main
    declared_inputs: [perceive_payload]
    declared_outputs: [decision]

  - id: act.main
    region: phase:act
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/act.yaml
      entry_node: act.validate
      binding_edge: act.main
    declared_inputs: [decision]
    declared_outputs: [act_outcome, should_terminate]

  - id: reflect.main
    region: phase:reflect
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/reflect_subgraph.yaml
      entry_node: phase.reflect.score
      binding_edge: reflect.main
    declared_inputs: [act_outcome]
    declared_outputs: [reflect_outcome]

  - id: remember.main
    region: phase:remember
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/remember_subgraph.yaml
      entry_node: phase.remember.write
      binding_edge: remember.main
    declared_inputs: [reflect_outcome]
    declared_outputs: [memory_record]

  - id: terminal.commit
    region: phase:terminal
    binding: terminate
    max_visits: 1
    terminal: true
    declared_inputs: [decision, act_outcome, reflect_outcome]
    declared_outputs: [terminal_outcome]

edges:
  # perceive → think (model-driven continuation).
  - from: perceive.main
    to: think.main
    when: true

  # think → act (model-driven continuation); think → terminal.commit
  # when the model emitted RESPOND with non-empty response_text.
  - from: think.main
    to: act.main
    when: result.payload.decision.action_type == "use_tool"
  - from: think.main
    to: terminal.commit
    when: result.payload.decision.action_type == "respond" and result.payload.decision.response_text != ""

  # act → think on USE_TOOL (the re-ask-model loop); act → terminal.commit
  # on Body-raised DeterministicToolError (FAILURE_KIND_EXECUTION).
  - from: act.main
    to: think.main
    when: result.payload.decision.action_type == "use_tool"
  - from: act.main
    to: terminal.commit
    when: result.payload.should_terminate == true

  # reflect → remember.
  - from: reflect.main
    to: remember.main
    when: true

  # remember → terminal.commit (always; commit closes the loop).
  - from: remember.main
    to: terminal.commit
    when: true

  # terminal.commit never loops back; the kernel exits via the new
  # BindingKind.TERMINATE executor.
  - from: terminal.commit
    to: think.main
    when: false