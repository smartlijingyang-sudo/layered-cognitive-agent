# bundles/phase_main_outer.yaml — outer plan, explicit phase topology.
#
# ADR-0221 P3 cutover: the v2 driver no longer reads
# ``phase.topology.standard`` / ``phase.topology.standard`` Cordis
# providers. Topology is declared here as a v2 BundleGraphSpec
# (ADR-0217) — the runtime kernel reads this yaml directly.
#
# D4 typed-port cutover: all edge ``when:`` predicates are typed
# :class:`Predicate` dicts (no string DSL). Cross-node reads go through
# :class:`PortReader` which resolves :class:`PortRef` against declared
# output ports. The ``routing`` port carries a :class:`RoutingDecision`
# that replaces the legacy ``result_kind`` / ``next_hint`` / ``next_hints``
# ad-hoc fields.

id: phase.main.outer
region: phase:agent
purpose: Six-phase outer plan (perceive → think → act → reflect → remember → terminal.commit) wired through sub_spec_ref into per-phase subgraphs.

nodes:
  - id: perceive.main
    region: phase:perceive
    max_visits: 8
    entry: true
    sub_spec_ref:
      plan_ref: bundles/perceive_subgraph.yaml
      entry_node: phase.perceive.observe
      binding_edge: perceive.main
    declared_inputs: []
    declared_outputs: [perceive_payload, routing]

  - id: think.main
    region: phase:think
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/think.yaml
      entry_node: think.shortcut
      binding_edge: think.main
    declared_inputs: [perceive_payload]
    declared_outputs: [decision, routing]

  - id: act.main
    region: phase:act
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/act.yaml
      entry_node: act.validate
      binding_edge: act.main
    declared_inputs: [decision]
    declared_outputs: [act_outcome, should_terminate, routing]

  - id: reflect.main
    region: phase:reflect
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/reflect_subgraph.yaml
      entry_node: phase.reflect.score
      binding_edge: reflect.main
    declared_inputs: [act_outcome]
    declared_outputs: [reflect_outcome, routing]

  - id: remember.main
    region: phase:remember
    max_visits: 8
    sub_spec_ref:
      plan_ref: bundles/remember_subgraph.yaml
      entry_node: phase.remember.write
      binding_edge: remember.main
    declared_inputs: [reflect_outcome]
    declared_outputs: [memory_record, routing]

  - id: terminal.commit
    region: phase:terminal
    binding: terminate
    max_visits: 1
    terminal: true
    declared_inputs: [decision, act_outcome, reflect_outcome, routing]
    declared_outputs: [terminal_outcome]

edges:
  # perceive → think (model-driven continuation).
  - from: perceive.main
    to: think.main

  # think → act when routing.action_type == use_tool.
  - from: think.main
    to: act.main
    when:
      kind: eq
      port: { name: routing, field: action_type }
      value: use_tool

  # think → terminal.commit when routing.action_type == respond
  # AND decision.response_text is non-empty.
  - from: think.main
    to: terminal.commit
    when:
      kind: and
      children:
        - { kind: eq, port: { name: routing, field: action_type }, value: respond }
        - { kind: ne, port: { name: decision, field: response_text }, value: "" }

  # act → think on USE_TOOL (the re-ask-model loop).
  - from: act.main
    to: think.main
    when:
      kind: eq
      port: { name: routing, field: action_type }
      value: use_tool

  # act → terminal.commit on should_terminate.
  - from: act.main
    to: terminal.commit
    when:
      kind: eq
      port: { name: routing, field: should_terminate }
      value: true

  # reflect → remember.
  - from: reflect.main
    to: remember.main

  # remember → terminal.commit (always; commit closes the loop).
  - from: remember.main
    to: terminal.commit

  # terminal.commit never loops back; the kernel exits via the
  # BindingKind.TERMINATE executor.
  - from: terminal.commit
    to: think.main
    when:
      kind: eq
      port: { name: routing, field: should_terminate }
      value: false
