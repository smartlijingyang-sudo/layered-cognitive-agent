# bundles/think.yaml — think 子图纯图描述(精简)
# ADR-0217 Bundle Graph Schema v2。
#
# D4 typed-port cutover: edge predicates use typed :class:`Predicate`
# dicts. The legacy string-DSL edge conditions are gone.

id: think.subgraph
region: phase:think
purpose: think 5 步执行 — shortcut 可 short-circuit,route → reason → history.assemble → llm.dispatch → decision.parse → gate 收敛

nodes:
  - id: think.shortcut
    factory: think.shortcut
    inputs: [in_assembled_manifest]
    outputs: [decision]
    entry: true
    config:

  - id: think.route.decide
    factory: think.route.decide
    inputs: [decision]
    outputs: [routing]
    config:

  # PR-3.8.1: budget gate sits between ``think.route.decide`` and the
  # miss-path reasoning chain. Reads ``state.budget`` and either stops
  # the run (subgraph terminates here, ``routing.should_terminate=true``
  # bubbles up to ``phase.main.outer`` which routes ``think.main`` →
  # ``terminal.commit``) or continues to ``think.context.compact``
  # (re-wired by PR-3.8.2 once the compaction node exists).
  #
  # Not marked ``terminal: true``: this node has one conditional
  # outgoing edge (→ think.context.compact on should_terminate=false)
  # and the lift-time validator forbids outgoing edges on terminal
  # nodes. Termination is edge-driven per ADR-0217 D4 — when the
  # executor emits ``should_terminate=true`` the only edge's predicate
  # does not match, ``select_edge`` returns ``None``, and
  # ``traversal.advance(edge=None)`` terminates the plan. The
  # think.subgraph terminates cleanly via ``think.gate`` on the
  # normal path (also edge-driven via no outgoing edges).
  #
  # Honors ADR-0225 (no per-node max_visits).
  - id: think.budget.check
    factory: think.budget.check
    # state lives on context.runtime (mirrors think.shortcut), not on
    # the port registry — the executor reads it from
    # context.runtime.state directly.
    outputs: [routing]
    config:

  # PR-3.8.2: typed-boundary context-compaction node. Reads ``writer``
  # + ``state`` from ``context.runtime`` (mirrors history.derive pattern)
  # and emits a ``CompactReceipt`` plus a ``RoutingDecision``. Threshold
  # gate (``used_tokens / max_tokens >= 0.7``) selects between the noop
  # and ``truncate_oldest`` paths; the node never raises out of the graph
  # (error path produces an empty receipt + a ``compact_skipped_error``
  # re-route).
  - id: think.context.compact
    factory: think.context.compact
    # writer and state live on context.runtime (mirrors history.derive),
    # not on the port registry — the executor reads them from
    # context.runtime via _resolve_port.
    outputs: [compact_receipt, routing]
    config:

  - id: think.route
    factory: think.route
    config:

  - id: think.reason
    factory: think.reason
    inputs: [in_assembled_manifest]
    # PR-3.8.borrow-tools-wire: ``forked_tools`` now exposed on the
    # subgraph surface so think.history.assemble can read it as a typed
    # boundary input (spec §E). Previously hidden inside the inner plan.
    outputs: [response, forked_tools]
    config:
      sub_spec_ref:
        plan_ref: bundles/think_reason.yaml
        entry_node: think.reason.fork_tools
        binding_edge: think.reason
      emit_on_enter: []
      emit_on_exit:  []

  - id: think.history.assemble
    factory: think.history.assemble.ref
    inputs: [response, state, forked_tools]
    outputs: [model_visible_request]
    config:
      emit_on_enter: []
      emit_on_exit:  []
      # Spec §D: think.history.assemble runs immediately before llm.dispatch;
      # it projects ModelVisibleRequest from RunSessionWriter with orphan-drop
      # applied. T3 wires think.llm.dispatch + think.decision.parse after it.
      sub_spec_ref:
        plan_ref: bundles/concept/history_assemble.yaml
        entry_node: history.derive
        binding_edge: think.history.assemble

  - id: think.llm.dispatch
    factory: think.llm.dispatch.ref
    inputs: [state, writer, model_visible_request]
    outputs: [llm_response, usage]
    config:
      emit_on_enter: []
      emit_on_exit:  []
      # Spec §E: think.llm.dispatch is one of three single-responsibility
      # nodes that replace think.reason.complete. It calls the LLM adapter
      # with the ModelVisibleRequest, persists the assistant row + tool_calls
      # to RunSessionWriter (persist-before-execute, spec §C), and forwards
      # (LLMResponse, TokenUsage) to think.decision.parse.
      sub_spec_ref:
        plan_ref: bundles/concept/llm_dispatch.yaml
        entry_node: llm.call
        binding_edge: think.llm.dispatch

  - id: think.decision.parse
    factory: think.decision.parse.ref
    inputs: [state, llm_response]
    outputs: [decision]
    config:
      emit_on_enter: []
      emit_on_exit:  []
      # Spec §E: think.decision.parse is the third single-responsibility
      # node; it projects LLMResponse into a typed Decision. Its
      # terminal_predicate routes action_type ∈ {respond, ask_user}
      # to the outer graph.
      sub_spec_ref:
        plan_ref: bundles/concept/decision_parse.yaml
        entry_node: decision.parse
        binding_edge: think.decision.parse

  # PR-3.8.3: typed-boundary repair node between decision.parse
  # and think.gate. Reads the parsed Decision + the per-run tools
  # registry (via context.runtime) and emits either the original
  # Decision (well-formed / irreparable) or the repaired Decision
  # (truncated JSON successfully repaired). The accompanying
  # RoutingDecision's reason gates downstream routing: decision_ok
  # and decision_repaired forward to think.gate;
  # decision_rejected_{schema,truncated} re-route to
  # think.route.decide for a full re-reason.
  - id: think.decision.repair
    factory: think.decision.repair
    inputs: [decision]
    outputs: [decision, routing]
    config:

  - id: think.gate
    factory: think.gate.ref
    inputs: [decision]
    outputs: [decision, routing]
    terminal: true
    config:
      emit_on_enter: []
      emit_on_exit:  [think.gate.end]
      # ADR-0220 P6: think.gate 改为 sub_spec_ref delegate 到
      # concept.decision.enforce (P5 落地的 2 节点 gate chain + reject
      # stamp)。typed decision port 由上游 think.decision.parse 经 close-out
      # 投影转发,inner 图第一节点 gate.chain.run 直接消费。state port
      # 缺失时 gate chain run 走 no-op(decision 不被 enforce),保证 think
      # 路径不依赖 AgentState 透传。
      sub_spec_ref:
        plan_ref: bundles/concept/decision_enforce.yaml
        entry_node: gate.chain.run
        binding_edge: think.gate

edges:
  # shortcut → route.decide → {budget.check → context.compact, gate}: think.route.decide
  # 读 decision 端口并 emit RoutingDecision typed port,next_node 决定下游图
  # 节点。miss-path (routing.next_node == "think.route") 改道先经
  # budget.check, 由 budget.check 决定继续到 think.context.compact
  # (PR-3.8.2 wiring) 还是 terminal.commit (should_terminate)。
  # short-circuit path 不变。
  - from: think.shortcut
    to: think.route.decide
  - from: think.route.decide
    to: think.budget.check
    when:
      kind: eq
      port: { name: routing, field: next_node }
      value: think.route
  - from: think.budget.check
    to: think.context.compact
    when:
      kind: eq
      port: { name: routing, field: should_terminate }
      value: false
  # When ``routing.should_terminate=true`` no outgoing edge from
  # ``think.budget.check`` matches; the subgraph terminates naturally
  # via ``traversal.advance(edge=None)``. The outer ``phase.main.outer``
  # reads the bubbled ``routing`` port from ``think.main`` and routes
  # to ``terminal.commit``. We deliberately do NOT wire to
  # ``terminal.commit`` here — that node is declared in
  # ``bundles/outer/phase_main.yaml``, not in this subgraph, and a
  # cross-subgraph edge fails the ``Plan._one_entry`` validator
  # (``terminal.commit`` is unknown in the inner node set). See
  # ``tests/unit/test_think_budget_check_wiring.py`` for the pin.
  # PR-3.8.2: context.compact routes to think.route on success
  # or noop (OR'd predicate over ``next_hint``), and re-routes to
  # ``think.route.decide`` on the error path so Gate can fail-loud
  # downstream.
  - from: think.context.compact
    to: think.route
    when:
      kind: in
      port: { name: routing, field: next_hint }
      value: [compact_done, compact_noop]
  - from: think.context.compact
    to: think.route.decide
    when:
      kind: eq
      port: { name: routing, field: next_hint }
      value: compact_skipped_error
  - from: think.route.decide
    to: think.gate
    when:
      kind: eq
      port: { name: routing, field: next_node }
      value: think.gate

  # route → reason → history.assemble → llm.dispatch → decision.parse → gate
  - from: think.route
    to: think.reason
  - from: think.reason
    to: think.history.assemble
  - from: think.history.assemble
    to: think.llm.dispatch
  - from: think.llm.dispatch
    to: think.decision.parse
  - from: think.decision.parse
    to: think.decision.repair
  # PR-3.8.3: decision.repair routes to think.gate when the
  # Decision is well-formed or successfully repaired; rejects
  # re-route to think.route.decide so Gate never sees a malformed
  # payload (ADR-0047 wire-block split: schema repair here,
  # wire-level blocking in Body).
  - from: think.decision.repair
    to: think.gate
    when:
      kind: in
      port: { name: routing, field: next_hint }
      value: [decision_ok, decision_repaired]
  - from: think.decision.repair
    to: think.route.decide
    when:
      kind: in
      port: { name: routing, field: next_hint }
      value: [decision_rejected_schema, decision_rejected_truncated]

# terminal: think.gate 直接回 outer graph(binding_edge=think.main),
#           无需显式返回边。
