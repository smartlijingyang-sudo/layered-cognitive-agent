; supervisord-compatible config for the LCA kernel dev path.
;
; Use with `lca-ops kernel-supervisor --config <this>`:
;
;     ./scripts/lca-ops kernel-supervisor start --config bundles/ops/lca-kernel-dev.conf --json
;     ./scripts/lca-ops kernel-supervisor status --config bundles/ops/lca-kernel-dev.conf --json
;     ./scripts/lca-ops kernel-supervisor stop --config bundles/ops/lca-kernel-dev.conf --json
;
; Or with the real supervisord (drop-in compatible):
;
;     supervisord -c bundles/ops/lca-kernel-dev.conf
;
; Note: LCA's bundled supervisor only consumes [program:...] sections;
; [supervisord] / [unix_http_server] / [rpcinterface:...] are valid
; supervisord syntax but ignored by LCA.

[program:lca_kernel_dev]
command=/opt/lca/venv/bin/python
args=-m lca_kernel serve --profile profiles/web-standard.yaml --host 0.0.0.0 --port 8765 --allow-unknown-env
directory=/home/lichao/layered-cognitive-agent

; Autorestart on unexpected exit; clean exits (0/2/3) are not restarted
; unless `autorestart=true` AND exit was unexpected (the LCA supervisor
; follows supervisord's expected/unexpected exit semantics).
autorestart=true

; Retries before going FATAL.
startretries=3

; Seconds to wait between SIGTERM and SIGKILL during `stop`.
stopwaitsecs=15

; LCA-specific: how long to wait for /health to return status=ok after
; subprocess spawn. NOT a supervisord key — ignored if supervisord is
; driving this program.
readiness_timeout=30

; Logs land in stable files for `kernel-supervisor logs --follow`.
; If LCA's Journal backend is reachable, prefer `journal:query` over
; tailing these files — Journal is the SSOT.
stdout_logfile=/tmp/lca-kernel.stdout.log
stderr_logfile=/tmp/lca-kernel.stderr.log