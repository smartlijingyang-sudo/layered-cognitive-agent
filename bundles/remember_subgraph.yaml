# bundles/remember_subgraph.yaml — remember 单节点子图(Bundle Graph Schema v2,ADR-0217)。
#
# Framework 子树不再持有 PhaseExecutor/PhaseInput/PhaseResult 概念;
# 顶层 plan 通过节点级 sub_spec_ref 进入本子图,kernel 通过 NodeExecutorStrategy
# 派发 phase:remember::phase.remember.host。remember 是 terminal-of-typing 节点,
# 不发出 port,直接吃 typed upstream 决策/观察/反思并写 memory。

id: remember.subgraph
region: phase:remember
purpose: remember 单步 — admit typed upstream ports into memory

nodes:
  - id: remember.host
    factory: phase.remember.host
    inputs: [decision, observation, reflection]
    outputs: []
    config:
      max_visits: 8

edges: []
