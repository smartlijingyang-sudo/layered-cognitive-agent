# bundles/remember_subgraph.yaml — remember 多节点子图
# ADR-0217 Bundle Graph Schema v2 + ADR-0221 six-phase subgraph cutover.
#
# 拓扑:write → fold(双节点 typed port pipeline)。
# write mint memory envelope + 调 effect_gateway dispatch;fold 转发
# ``memory_receipt`` port 到 outer。

id: remember.subgraph
region: phase:remember
purpose: remember 双步执行 — write (mint envelope + dispatch) → fold (memory_receipt)

nodes:
  - id: remember.write
    factory: phase.remember.write
    inputs: [decision, observation, reflection]
    outputs: [memory_receipt]
    config:
      max_visits: 1

  - id: remember.fold
    factory: phase.remember.fold
    inputs: [memory_receipt]
    outputs: [memory_receipt]
    config:
      max_visits: 1

edges:
  - from: remember.write
    to: remember.fold
    when: true
