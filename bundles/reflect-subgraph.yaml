# Edge-level subgraph reference — minimum experiment bundle.
#
# Referenced from ``bundles/declarative-phase-graph.yaml`` via one
# ``PhaseEdge.subgraph_ref`` pointing at this bundle's plan_ref. The
# ``binding_edge`` in that reference names ``reflect.main`` — which is
# the id of the outer edge — and one edge in this bundle below
# carries a matching ``subgraph_ref.plan_ref: reflect.main`` to satisfy
# the two-graph mutual-reference invariant (PG-004 at compile time).
#
# This is a deliberately small bundle: one entry topology plus one
# entry edges. The interpreter recurses into this plan from the outer
# ``reflect.main → remember.main`` edge and returns to the outer graph
# when the subgraph terminates.
#
# delete-when: the experiment moves to a fuller nested-graph runtime
# (depth > 1 or node-level refs); this bundle becomes the smallest
# regression fixture rather than a runtime entry.

entries:
  - id: phase.reflect.standard
    name: phase_reflect_standard
    $module: lca.plugins.loop.phase.reflect.standard.plugin
    config: {}

  - id: phase.topology.standard
    $name: phase_topology_reflect_subgraph
    $module: lca.plugins.loop.graph.topology.standard.plugin
    config:
      nodes:
        - id: reflect.inner_score
          phase: reflect
          binding: phase.reflect.standard
          max_visits: 4
          entry: true
        - id: reflect.inner_summarize
          phase: reflect
          binding: phase.reflect.standard
          max_visits: 4
          terminal: true

  # One bounded loop + one terminator, plus the back-reference edge
  # whose ``subgraph_ref.plan_ref`` is the outer edge id
  # (``reflect.main``). The assembler uses this back-reference to
  # confirm the two-graph mutual reference; the interpreter ignores
  # the back-reference field on edges inside the subgraph at runtime
  # (depth = 1).
  - id: phase.edge.standard
    $name: phase_edge_reflect_subgraph
    $module: lca.plugins.loop.graph.edges.standard.plugin
    config:
      edges:
        - source: reflect.inner_score
          target: reflect.inner_summarize
          when: result.payload.keep_going == true
          loop:
            max_iterations: 3
            budget: run.steps
            terminal_predicate: result.payload.keep_going == false
        - source: reflect.inner_summarize
          target: reflect.inner_score
          when: true
          # Mutual-reference edge: names the outer edge id so the
          # assembler sees both sides of the reference.
          subgraph_ref:
            plan_ref: reflect.main
            entry_node: reflect.inner_summarize
            binding_edge: reflect.inner_summarize
            return_on: next
