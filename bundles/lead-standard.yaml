# bundles/lead-standard.yaml — research-debate lead role bundle.
# Per spec §3.7.4: lead coordinates + publishes + replies; no shell, no file write.

entries:
  # Board team-lead (Tier-3) — the lead's coordination style.
  - id: lca-team-lead-board
    name: lca_team_lead_board
    $module: lca.plugins.team_lead.board
    config: {}

  # Team message tools — required by lead (publish + reply).
  - id: lca-tool-team-message-publish
    name: lca_tool_team_message_publish
    $module: lca.plugins.tools.team_message_publish
    config:
      allowed: true

  - id: lca-tool-team-message-reply
    name: lca_tool_team_message_reply
    $module: lca.plugins.tools.team_message_reply
    config:
      allowed: true
