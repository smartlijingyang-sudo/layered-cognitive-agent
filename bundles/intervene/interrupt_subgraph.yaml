# bundles/intervene/interrupt_subgraph.yaml — intervene 暂停端子图纯图描述。
#
# ADR-0228 §Decision 4 + §Decision 6: intervene is a cross-phase
# subgraph, not a six-phase primitive. The kernel reads the upstream
# ``decision`` + ``spine_seq`` ports, ``intervene.interrupt`` emits a
# typed ``Command`` plus ``RoutingDecision(should_terminate=True,
# next_hint="intervene.resume")``. The kernel pauses, persists the
# ``Command`` to the spine, and the next run resumes through
# ``intervene.resume`` which re-projects the persisted command as a
# typed ``decision`` port for the think phase.

id: interrupt.subgraph
region: intervene
purpose: intervene 暂停端 — Decision + spine_seq → typed Command + terminate routing

nodes:
  - id: intervene.interrupt
    factory: intervene.interrupt
    inputs: [decision, spine_seq]
    outputs: [command, routing]
    terminal: true
    config:

# terminal: intervene.interrupt 是 subgraph 的 terminal node;kernel 看到
#           RoutingDecision.should_terminate=True 后 pause 并持久化 Command,
#           恢复时进入 intervene.resume 节点。
