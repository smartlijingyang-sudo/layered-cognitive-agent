# bundles/researcher-web-tools.yaml — researcher (web) role bundle.
# Per spec §3.7.4: web researcher — search + fetch + cite; no shell, no fs.write.

entries:
  - id: lca-tool-web-search
    name: lca_tool_web_search
    $module: lca.plugins.tools.web_search
    config:
      allowed: true

  - id: lca-tool-web-fetch
    name: lca_tool_web_fetch
    $module: lca.plugins.tools.web_fetch
    config:
      allowed: true

  - id: lca-tool-doc-search
    name: lca_tool_doc_search
    $module: lca.plugins.tools.doc_search
    config:
      allowed: true
