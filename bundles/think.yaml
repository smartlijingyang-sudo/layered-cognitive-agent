# bundles/think.yaml — think 子图纯图描述(精简)
# ADR-0217 Bundle Graph Schema v2。
#
# 字段职责(每个字段都被框架读):
#   id       : bundle 身份;BundleSubgraphResolver sniff 用
#   region   : 子图 region 标签;FactoryResolver 反查上下文
#   purpose  : 子图整体职责;写入 phase_graph.metadata
#   nodes[]
#     id     : 节点拓扑身份(供 edges source/target 锚点)
#     region : 节点 region(可空,fallback 到 bundle.region)
#     factory: 业务语义名(如 think.shortcut);FactoryResolver 解析到 NodeExecutor
#     config : 节点级图配置(只图级参数)
#       max_visits : NodeContext.budget 透传,v2 driver 终止条件之一
#   edges[]
#     from/to : 节点 id 锚点
#     when    : bool-expr DSL;interpreter 在 node.end 后跑
#
# 不放(inputs/outputs/payload_port/result_kind):@plugin 装饰器不读,
# v2 driver 不读,observer 不消费——纯摆设。
#
# 节点 plugin 注册走 @plugin(...) 装饰器;plugin 实现通过 factory 业务名
# 由 FactoryRegistry.resolve(semantic_name="think.<name>", region="phase:think")
# 解析到 Think<Name>Executor 实例。

id: think.subgraph
region: phase:think
purpose: think 5 步执行 — shortcut 可 short-circuit,route → reason → classify → gate 收敛

nodes:
  - id: think.shortcut
    factory: think.shortcut
    config:
      max_visits: 1

  - id: think.route
    factory: think.route
    config:
      max_visits: 1

  - id: think.reason
    factory: think.reason
    inputs: [in_assembled_manifest]
    outputs: [response]
    config:
      max_visits: 8
      sub_spec_ref:
        plan_ref: bundles/think_reason.yaml
        entry_node: think.reason.plan
        binding_edge: think.reason
      emit_on_enter: []
      emit_on_exit:  []

  - id: think.classify
    factory: think.classify.ref
    inputs: [response]
    outputs: [decision]
    config:
      max_visits: 1
      emit_on_enter: []
      emit_on_exit:  []
      # ADR-0220 P6: think.classify 改为 sub_spec_ref delegate 到
      # concept.decision.classify (P5 落地的 3 节点 typed parse/compose
      # pipeline)。typed response port 由上游 think.reason 经 close-out
      # 投影转发,inner 图第一节点 decision.parse.tool_calls 直接消费。
      sub_spec_ref:
        plan_ref: bundles/concept/decision_classify.yaml
        entry_node: decision.parse.tool_calls
        binding_edge: think.classify

  - id: think.gate
    factory: think.gate.ref
    inputs: [decision]
    outputs: [decision]
    config:
      max_visits: 8
      emit_on_enter: []
      emit_on_exit:  []
      # ADR-0220 P6: think.gate 改为 sub_spec_ref delegate 到
      # concept.decision.enforce (P5 落地的 2 节点 gate chain + reject
      # stamp)。typed decision port 由上游 think.classify 经 close-out
      # 投影转发,inner 图第一节点 gate.chain.run 直接消费。state port
      # 缺失时 gate chain run 走 no-op(decision 不被 enforce),保证 think
      # 路径不依赖 AgentState 透传。
      sub_spec_ref:
        plan_ref: bundles/concept/decision_enforce.yaml
        entry_node: gate.chain.run
        binding_edge: think.gate

edges:
  # shortcut → route: 没命中(decision 缺失)走 route;命中直接到 gate
  - from: think.shortcut
    to: think.route
    when: result.payload == None
  - from: think.shortcut
    to: think.gate
    when: result.payload != null

  # route → reason → classify → gate
  - from: think.route
    to: think.reason
    when: true
  - from: think.reason
    to: think.classify
    when: true
  - from: think.classify
    to: think.gate
    when: true

# terminal: think.gate 直接回 outer graph(binding_edge=think.main),
#           无需显式返回边。