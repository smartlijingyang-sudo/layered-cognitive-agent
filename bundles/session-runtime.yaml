# bundles/session-runtime.yaml — Session runtime plugin（PR-3c 骨架）。
#
# DSH 风格 in-memory Session runtime：append-only 日志真值 +
# observer contained fire + reentry 拒绝 + 增量 request_header fold。
#
# 骨架期约定：
#   - 尚无任何 profile 引用本 bundle —— 后续 PR 把 session.store 接入
#     run 路径时在此叠加引用；接入前本文件只完成 plugin id ↔ $module
#     绑定（plugin-shape gate orphan 维度 + lca-ops inspect-tree 可见）。
#   - 不接 PersistenceWorker / DeliveryQueue（ADR-0184 落盘链）；
#     不发任何事件（与 16 个 publisher / EventSpine 正交）。

name: session-runtime
description: |
  Session runtime skeleton: in-memory SessionStore + DSH 风格 Session 实体。

entries:
  - id: lca.plugins.session.runtime
    name: session_runtime
    $module: lca.plugins.session.runtime.plugin
    config: {}
