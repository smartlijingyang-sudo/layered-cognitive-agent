# assistant domain events — Session spine SSOT (debug / audit).

consumer_rules:
  - prefix: "spine.assistant."
    subscribers:
      - lca.plugins.events.sinks.spine_file_sink.sink.SpineFileSink

events:
  - category: spine.assistant.created
    plane: lca.contracts.event.Plane.STRUCTURAL
    payload_class: lca_kernel.events.payloads.spine.SpineEventPayload
    fields: {}
    publishers:
      - lca.loop.fact_gateway.DefaultFactGateway

  - category: spine.assistant.bootstrap.completed
    plane: lca.contracts.event.Plane.STRUCTURAL
    payload_class: lca_kernel.events.payloads.spine.SpineEventPayload
