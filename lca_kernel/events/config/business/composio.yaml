# composio domain events — Session spine SSOT (debug / audit).

consumer_rules:
  - prefix: "spine.composio."
    subscribers:
      - lca.plugins.events.sinks.spine_file_sink.sink.SpineFileSink

events:
  - category: spine.composio.oauth.callback.received
    plane: lca.contracts.event.Plane.STRUCTURAL
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields: {}
    publishers:
      - lca.loop.fact_gateway.DefaultFactGateway

  - category: spine.composio.oauth.callback.failed
    plane: lca.contracts.event.Plane.STRUCTURAL
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields: {}
    publishers:
      - lca.loop.fact_gateway.DefaultFactGateway

  - category: spine.composio.oauth.callback.processed
    plane: lca.contracts.event.Plane.STRUCTURAL
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
