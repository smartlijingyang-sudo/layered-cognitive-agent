  - category: spine.llm.request.header
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      model: str
      prompt_preview: str
    publishers:
      - events.spine_reflector_body_llm

  # ── Exception（PR-3）─────────────────────────────────────────
  - category: spine.exception.caught
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      boundary: str
      exc_type: str
      message: str
      trace_id: str
    publishers:
      - events.spine_reflector_runtime

  - category: spine.exception.finally
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      boundary: str
      trace_id: str
      outcome: str
    publishers:
      - events.spine_reflector_runtime

  # ── Runtime observed（PR-3 与 exception 一起迁，PR-6 新加 runtime.observed 类别）──
  - category: spine.runtime.reducer.apply
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
