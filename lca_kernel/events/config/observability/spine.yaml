    fields:
      run_id: str
      trace_id: str
    publishers:
      - events.spine_reflector_transport

  # ── Agent loop + agent + loop fork（PR-4）─────────────────────────
  - category: spine.agent_loop.iteration.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
