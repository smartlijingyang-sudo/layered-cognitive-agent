    payload_class: lca_kernel.events.payloads.spine.SpineEventPayload
    fields:
      state_id: str
      activation_ref: str
    publishers:
      - lca.loop.fact_gateway.DefaultFactGateway

  - category: spine.cognition.critic.eval.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads.spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
      activation_ref: str
    publishers:
      - lca.loop.fact_gateway.DefaultFactGateway

  - category: spine.cognition.reasoner.reason.start
