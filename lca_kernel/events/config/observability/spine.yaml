  - category: spine.runtime.resume.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      plan_ref: str
      state_ref: str
      node_id: str
      outcome: str
    publishers:
      - events.spine_reflector_runtime

  - category: spine.runtime.event_publisher.publish
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      event_type: str
      trace_id: str
      outcome: str
    publishers:
      - events.spine_reflector_runtime

  # ── Transport（PR-4）─────────────────────────────────────────────
  - category: spine.transport.route.enter
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      path: str
      method: str
      run_id: str
