    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      run_id: str
    publishers:
      - events.spine_reflector_writable
      - events.spine_writable_matrix

  - category: spine.writable.iteration.close
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      run_id: str
    publishers:
      - events.spine_reflector_writable
      - events.spine_writable_matrix

  # ── Phase（PR-5）────────────────────────────────────────────────
