# spine 事件 SSOT（ADR-0181 D3 / ADR-0183 PR-6）
#
# consumer_rules：subscriber 鉴权按前缀规则声明。某 category 的授权 =
# 命中的所有规则的 subscribers 并集；更细前缀的规则为子树追加订阅者。
# 删-when（PR-9）：lca/infrastructure/observability/spine/manifest.py
# 全量迁完后 rg "EXECUTION_POINTS" lca/ = 0
consumer_rules:
  - prefix: "spine."
    subscribers:
      - events.spine_chain_sink
      - lca.events.subscriber.console_projector
  # perceive 子树：SpineStepTreeAccumulator 额外构建 step tree
  - prefix: "spine.cognition.brain.perceive."
    subscribers:
      - events.spine_step_tree_accumulator

events:
  # ── Cognition（试点 + PR-2 一次性全迁，删-when：cognition reflector 旧
  # lca/plugins/observability/spine/reflectors/cognition.py 删 + rg
  # "emit_brain_\|emit_critic_\|emit_reasoner_\|emit_prompt_assembler_\|emit_synthesizer_\|emit_skill_router_\|emit_memory_" lca/ = 0）
  - category: spine.cognition.brain.perceive.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.brain.perceive.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.brain.think.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.brain.think.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.brain.gate.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.brain.gate.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.critic.eval.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.critic.eval.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.reasoner.reason.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.reasoner.reason.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.prompt_assembler.assemble.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      template_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.prompt_assembler.assemble.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      template_id: str
      section_count: int
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.synthesizer.merge
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.skill_router.route
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      decision_path: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.memory.read
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  - category: spine.cognition.memory.write
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      state_id: str
      outcome: str
    publishers:
      - events.spine_reflector_cognition

  # ── Body（PR-3）─────────────────────────────────────────────
  - category: spine.body.tool.execute.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      tool_name: str
      invocation_id: str
      attempt: int
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.body.tool.execute.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      tool_name: str
      invocation_id: str
      attempt: int
      outcome: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.body.tool.retry
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      tool_name: str
      invocation_id: str
      attempt: int
      reason: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.body.sandbox.enter
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      invocation_id: str
      tool_name: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.body.sandbox.exit
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      invocation_id: str
      tool_name: str
      outcome: str
    publishers:
      - events.spine_reflector_body_llm

  # ── Lifecycle normalization（PR-3，ADR-0166 S5）───────────────
  - category: spine.lifecycle.finally
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      boundary: str
      trace_id: str
    publishers:
      - events.spine_reflector_runtime

  # ── LLM（PR-3）──────────────────────────────────────────────
