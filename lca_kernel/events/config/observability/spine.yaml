      profile: str
    publishers:
      - events.spine_reflector_kernel_loop

  - category: spine.kernel.boot.completed
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      profile: str
      outcome: str
    publishers:
      - events.spine_reflector_kernel_loop

  - category: spine.kernel.run.start
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      run_id: str
      trace_id: str
    publishers:
      - events.spine_reflector_transport

  - category: spine.kernel.run.stop
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
