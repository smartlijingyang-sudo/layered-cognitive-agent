    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      model: str
      stream: bool
      prompt_preview: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.llm.call.end
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      model: str
      stream: bool
      outcome: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.llm.stream.token
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
    fields:
      model: str
      text_delta: str
      seq: int
      channel_kind: str
    publishers:
      - events.spine_reflector_body_llm

  - category: spine.llm.stream.stall
    plane: lca.contracts.event.Plane.OBSERVABILITY
    payload_class: lca_kernel.events.payloads_spine.SpineEventPayload
