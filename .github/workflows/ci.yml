name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - run: uv python install 3.10
      - run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Envelope schema_version drift (ADR-0096)
        run: uv run python scripts/check_protocol_schema_version.py
      - name: 架构契约（import-linter）
        run: uv run lint-imports
      - name: 包契约一致性（L1↔L2↔L3↔actual import + L1↔__all__）
        run: uv run python scripts/check_package_contracts.py
      - name: 文件名边界（filename linter，warning）
        run: uv run python scripts/check_filename_boundaries.py || echo "::warning::filename violations found"
      - name: Package organization gates (Phase D — advisory)
        run: uv run python -m lca.infrastructure.cli.cli diagnose-package-organization --verbose || echo "::warning::package-organization gates reported issues"
      - name: mypy
        run: uv run mypy lca
      - name: pytest
        run: uv run pytest --cov=lca --cov-report=xml
      - name: 依赖漏洞扫描
        run: uv run pip-audit
      - name: 死代码扫描
        run: uv run vulture --config pyproject.toml --min-confidence 80
      - name: LobeHub 补丁一致性检查
        run: |
          # Verify patch registry consistency (no lobehub-ui/ needed)
          uv run python deploy/lobehub/patch_lobehub.py list


