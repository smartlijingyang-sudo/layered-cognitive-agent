[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_lab"
version = "0.1.0"
description = "Config-driven ant-worker graph framework prototype (ADR-0206)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_lab*"]