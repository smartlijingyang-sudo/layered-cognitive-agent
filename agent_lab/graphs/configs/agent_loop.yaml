# =============================================================================
# agent_loop — root loop (ADR-0206 §2)
# =============================================================================
# Owns five cognitive phase hosts (perceive / think / act / reflect /
# remember). Control graphs are sibling graph.call hosts with parent data
# edges — not extra sub_specs on the same phase host. Stop is not a peer
# cognitive phase: stop_decide / stop_focus sit beside remember after persist.
#
# model_eye is NOT mounted here. It is perceive's child (perceive.yaml#eye).
# perceive.out_manifest is already the frozen ContextManifest think reads.
#
# Cross-spec project (owned by act.yaml):
#   act.observe.observation ──project──► model_eye.see.observation
#
# Local data:
#   perceive.out_manifest  ──► think.in_assembled_manifest
#   perceive.out_manifest  ──► think.perceive_out
#   think.decision_out     ──► act / reflect / remember / think_guard / stop_*
#   act.out_observation    ──► reflect / remember / remember_admit / stop_decide
#   reflect.reflection_out ──► remember / stop_decide
#   remember.state_ref     ──► stop_decide / stop_focus
# =============================================================================

id: agent_loop
version: 0.1.0
region: phase:agent_loop
description: Root graph for the agent loop. Five cognitive phase hosts plus
  sibling control hosts. model_eye lives under perceive.

# -----------------------------------------------------------------------------
# GRAPH — organizational metadata (not data flow). Used by self-describe.
# -----------------------------------------------------------------------------
graph:
  id: agent_loop
  layer: phase
  purpose: Orchestrate the agent loop as nested sub-graphs wired by sub_spec.
  members:
    - perceive              # host → perceive.yaml (which mounts model_eye)
    - think                 # host → think.yaml
    - act                   # host → act.yaml
    - reflect               # host → reflect.yaml
    - remember              # host → remember.yaml
    - perceive_context      # sibling host → control/perceive_context.yaml
    - think_guard           # sibling host → control/think_guard.yaml (passthrough)
    - remember_admit        # sibling host → control/remember_admit.yaml
    - stop_decide           # sibling host → control/stop_decide.yaml
    - stop_focus            # sibling host → control/stop_focus.yaml
  references:
    - perceive
    - think
    - act
    - reflect
    - remember
    - perceive_context
    - think_guard
    - remember_admit
    - stop_decide
    - stop_focus
  relations:
    - { graph: act, kind: contains, role: act_phase }
  capabilities:
    provides: [agent_run_loop, five_phase_orchestration]
    requires: [perceive, act, llm_call]

# -----------------------------------------------------------------------------
# INITIAL PORTS — what a caller must supply when running this graph.
# Each port_id here corresponds to one edge with from.node = "_initial"
# (see EDGES below). These are the external inputs the loop accepts.
# -----------------------------------------------------------------------------
# initial.system     : system prompt (text artifact)
# initial.history    : prior conversation (openai.messages.v1)
# initial.config     : LLM runtime config (temperature, etc.)
# initial.user_turn  : this turn's user message (+ optional tool_calls)
# initial.state      : AgentState snapshot (step, history, retrieved_context,
#                     extra) — fed into perceive so the Hub can fold the
#                     prior context into the new ContextManifest. Other
#                     fields are tolerated and routed into state.extra.
# Tool schemas are owned by perceive.inventory → model_eye → ContextManifest;
# think peels them from the frozen manifest (no initial.tools bypass).

# -----------------------------------------------------------------------------
# NODES — local workers + sub_spec hosts. Identity stubs are passthroughs;
# non-trivial nodes are tagged with a one-line role comment.
# -----------------------------------------------------------------------------
nodes:

  # ===== PHASE: perceive (host) =============================================
  # Mounts perceive.yaml: Hub fold + inventory schemas → model_eye.
  # Feeds state + header + user_turn; exposes out_manifest for think.
  - id: perceive
    region: phase:perceive
    factory: graph.call
    ins: [user_turn, state, system, history, config]
    outs: [perceive_out, out_manifest]

  # ===== CONTROL: perceive_context (sibling of perceive) ====================
  # Mounts control/perceive_context.yaml. Reads the same user_turn as perceive.
  - id: perceive_context
    region: control
    factory: graph.call
    ins: [in_args]
    outs: [allowed]

  # ===== PHASE: think (host) ================================================
  # Receives perceive.out_manifest as in_assembled_manifest (already assembled
  # by model_eye inside perceive; includes tools). No tools bypass port.
  - id: think
    region: phase:think
    factory: graph.call
    ins: [in_assembled_manifest, perceive_out, in_state]
    outs: [decision_out, think_signal]

  # ===== CONTROL: think_guard (sibling of think) ============================
  # Passthrough sibling. think.yaml#guard is DecisionGate SSOT; this host
  # does not re-enforce and does not replace think.decision_out consumers.
  - id: think_guard
    region: control
    factory: graph.call
    ins: [in_decision]
    outs: [out_decision]

  # ===== PHASE: act (host) ==================================================
  # Mounts act.yaml. Receives think.decision_out as in_decision; exposes
  # out_observation after shape→authorize→execute→observe.
  - id: act
    region: phase:act
    factory: graph.call
    ins: [in_decision]
    outs: [out_observation]

  # ===== PHASE: reflect (host) =============================================
  # Mounts `reflect.yaml` as a nested graph. Receives the act's observation
  # + think's decision + an optional prior-turn reflection. Emits the
  # current Reflection + memory candidates + a barrier signal.
  # Reflect does not write Session/Memory (remember owns that).
  - id: reflect
    region: phase:reflect
    factory: graph.call
    ins: [in_observation, in_decision, in_prior_reflection]
    outs: [reflection_out, memory_candidates, reflect_signal]

  # ===== PHASE: remember (host) ============================================
  # Mounts `remember.yaml` as a nested graph: admit → commit → snapshot.
  # Receives reflect/act/think artifacts + memory_candidates; emits
  # journal_fact + state_ref + remember_signal. Stop control is sibling hosts
  # below, not extra sub_specs on this host.
  - id: remember
    region: phase:remember
    factory: graph.call
    ins: [in_reflection, in_observation, in_decision, in_candidates]
    outs: [journal_fact, state_ref, remember_signal]

  # ===== CONTROL: remember_admit (sibling of remember) ======================
  - id: remember_admit
    region: control
    factory: graph.call
    ins: [in_observation]
    outs: [admit_verdict]

  # ===== CONTROL: stop_decide / stop_focus (siblings of remember) ===========
  - id: stop_decide
    region: control
    factory: graph.call
    ins: [state_ref, in_decision, in_observation, in_reflection]
    outs: [stop_decision, terminal]
  - id: stop_focus
    region: control
    factory: graph.call
    ins: [state_ref, in_decision]
    outs: [focus_verdict]

# -----------------------------------------------------------------------------
# EDGES — local data flow. Edges are grouped by their destination node so
# the file reads top-to-bottom in the same order as the data path.
# Cross-spec project edges from this root: NONE. act's project edge into
# model_eye is declared in act.yaml, not here.
# -----------------------------------------------------------------------------
edges:

  # ── initial → perceive (sensing + header for model_eye) ──
  - id: e_init_user_to_perceive
    from: { spec: agent_loop, node: _initial, port: user_turn }
    to:   { spec: agent_loop, node: perceive, port: user_turn }
    kind: data
  - id: e_init_user_to_perceive_context
    from: { spec: agent_loop, node: _initial, port: user_turn }
    to:   { spec: agent_loop, node: perceive_context, port: in_args }
    kind: data
  - id: e_init_state_to_perceive
    from: { spec: agent_loop, node: _initial, port: state }
    to:   { spec: agent_loop, node: perceive, port: state }
    kind: data
  - id: e_init_system_to_perceive
    from: { spec: agent_loop, node: _initial, port: system }
    to:   { spec: agent_loop, node: perceive, port: system }
    kind: data
  - id: e_init_history_to_perceive
    from: { spec: agent_loop, node: _initial, port: history }
    to:   { spec: agent_loop, node: perceive, port: history }
    kind: data
  - id: e_init_config_to_perceive
    from: { spec: agent_loop, node: _initial, port: config }
    to:   { spec: agent_loop, node: perceive, port: config }
    kind: data
  - id: e_init_state_to_think
    from: { spec: agent_loop, node: _initial, port: state }
    to:   { spec: agent_loop, node: think,    port: in_state }
    kind: data

  # ── perceive → think (manifest + barrier signal) ──
  - id: e_perceive_manifest_to_think
    from: { spec: agent_loop, node: perceive, port: out_manifest }
    to:   { spec: agent_loop, node: think,    port: in_assembled_manifest }
    kind: data
  - id: e_perceive_to_think
    from: { spec: agent_loop, node: perceive, port: out_manifest }
    to:   { spec: agent_loop, node: think,    port: perceive_out }
    kind: data

  # ── think → act (enforced Decision feeds act.shape) ──
  - id: e_think_to_act
    from: { spec: agent_loop, node: think, port: decision_out }
    to:   { spec: agent_loop, node: act,   port: in_decision }
    kind: data

  # ── act → reflect → remember (cognitive tail; stop is a sibling host) ──
  - id: e_act_to_reflect_obs
    from: { spec: agent_loop, node: act,      port: out_observation }
    to:   { spec: agent_loop, node: reflect,  port: in_observation }
    kind: data
  - id: e_think_to_reflect_dec
    from: { spec: agent_loop, node: think,    port: decision_out }
    to:   { spec: agent_loop, node: reflect,  port: in_decision }
    kind: data
  - id: e_reflect_to_remember
    from: { spec: agent_loop, node: reflect,  port: reflection_out }
    to:   { spec: agent_loop, node: remember, port: in_reflection }
    kind: data
  - id: e_act_obs_to_remember
    from: { spec: agent_loop, node: act,      port: out_observation }
    to:   { spec: agent_loop, node: remember, port: in_observation }
    kind: data
  - id: e_think_dec_to_remember
    from: { spec: agent_loop, node: think,    port: decision_out }
    to:   { spec: agent_loop, node: remember, port: in_decision }
    kind: data
  - id: e_reflect_candidates_to_remember
    from: { spec: agent_loop, node: reflect,  port: memory_candidates }
    to:   { spec: agent_loop, node: remember, port: in_candidates }
    kind: data

  # ── think → think_guard (passthrough sibling; think.yaml#guard is SSOT) ──
  - id: e_think_dec_to_think_guard
    from: { spec: agent_loop, node: think, port: decision_out }
    to:   { spec: agent_loop, node: think_guard, port: in_decision }
    kind: data

  # ── act → remember_admit (sibling of remember) ──
  - id: e_act_obs_to_remember_admit
    from: { spec: agent_loop, node: act, port: out_observation }
    to:   { spec: agent_loop, node: remember_admit, port: in_observation }
    kind: data

  # ── remember / think / act / reflect → stop_decide ──
  - id: e_remember_state_to_stop_decide
    from: { spec: agent_loop, node: remember, port: state_ref }
    to:   { spec: agent_loop, node: stop_decide, port: state_ref }
    kind: data
  - id: e_think_dec_to_stop_decide
    from: { spec: agent_loop, node: think, port: decision_out }
    to:   { spec: agent_loop, node: stop_decide, port: in_decision }
    kind: data
  - id: e_act_obs_to_stop_decide
    from: { spec: agent_loop, node: act, port: out_observation }
    to:   { spec: agent_loop, node: stop_decide, port: in_observation }
    kind: data
  - id: e_reflect_to_stop_decide
    from: { spec: agent_loop, node: reflect, port: reflection_out }
    to:   { spec: agent_loop, node: stop_decide, port: in_reflection }
    kind: data
  - id: e_remember_state_to_stop_focus
    from: { spec: agent_loop, node: remember, port: state_ref }
    to:   { spec: agent_loop, node: stop_focus, port: state_ref }
    kind: data
  - id: e_think_dec_to_stop_focus
    from: { spec: agent_loop, node: think, port: decision_out }
    to:   { spec: agent_loop, node: stop_focus, port: in_decision }
    kind: data

# -----------------------------------------------------------------------------
# SUBSPECS — mount points for nested graphs. Each entry says:
#   "this local node is a sub_spec host; the named nested graph runs in its
#    place, with this input_map and output_map glued to the local ports."
#
# input_map:  parent port_id  ->  nested graph's port_id
# output_map: nested graph's port_id  ->  parent port_id
# -----------------------------------------------------------------------------
sub_specs:

  # ── perceive stage: Hub fold + inventory → model_eye → frozen manifest ──
  - node: perceive
    sub_spec: perceive
    input_map:
      user_turn: user_turn
      state:     state
      system:    system
      history:   history
      config:    config
    output_map:
      manifest: out_manifest

  # ── think stage: Brain.think → Decision ──
  # Reads perceive.out_manifest (messages + tools already frozen by model_eye).
  - node: think
    sub_spec: think
    input_map:
      in_assembled_manifest: in_assembled_manifest
      perceive_out:          perceive_out
      in_state:              in_state
    output_map:
      enforced_decision: decision_out
      think_signal:       think_signal

  # ── act stage: Decision → Observation (shape→authorize→execute→observe) ──
  # Nested graph: act. Projects observation into model_eye.see via
  # kind:project (declared in act.yaml).
  - node: act
    sub_spec: act
    input_map:
      in_decision: decision
    output_map:
      observation: out_observation

  # ── reflect stage: Brain.reflect = join → critique → extract ──
  # Nested graph: reflect. Produces Reflection + memory candidates;
  # durable write is remember's job.
  - node: reflect
    sub_spec: reflect
    input_map:
      in_observation:      in_observation
      in_decision:         in_decision
      in_prior_reflection: in_prior_reflection
    output_map:
      reflection_out:     reflection_out
      memory_candidates:  memory_candidates
      reflect_signal:     reflect_signal

  # ── remember stage: admit → commit → snapshot ──
  - node: remember
    sub_spec: remember
    input_map:
      in_reflection:  in_reflection
      in_observation: in_observation
      in_decision:    in_decision
      in_candidates:  in_candidates
    output_map:
      journal_fact:    journal_fact
      state_ref:       state_ref
      remember_signal: remember_signal

  # ── perceive_context: sibling of perceive ──
  - node: perceive_context
    sub_spec: perceive_context
    input_map:
      in_args: in_args
    output_map:
      allowed: allowed

  # ── think_guard: passthrough sibling of think (think.yaml#guard is SSOT) ──
  - node: think_guard
    sub_spec: think_guard
    input_map:
      in_decision: in_decision
    output_map:
      out_decision: out_decision

  # ── remember_admit: sibling of remember ──
  - node: remember_admit
    sub_spec: remember_admit
    input_map:
      in_observation: in_observation
    output_map:
      admit_verdict: admit_verdict

  - node: stop_decide
    sub_spec: stop_decide
    input_map:
      state_ref: in_state
      in_decision: in_decision
      in_observation: in_observation
      in_reflection: in_reflection
    output_map:
      stop_decision: stop_decision
      terminal: terminal
  - node: stop_focus
    sub_spec: stop_focus
    input_map:
      state_ref: in_state
      in_decision: in_decision
    output_map:
      focus_verdict: focus_verdict

# -----------------------------------------------------------------------------
# PLUGINS — cross-cutting behavior attached to this graph's lifecycle.
#
# Plugins are the agent_lab extension point for things that don't belong
# inside a single node's execute(): event sinks (durable fact writing),
# metrics/tracing, parse rules, memory policies, etc.
# The compile hook fans ``before_compile`` / ``after_compile`` into every
# plugin; the runner fans every ``node_start`` / ``node_end`` /
# ``edge_fire`` / ``subgraph_enter`` / ``subgraph_exit`` into the same
# plugin list. See agent_lab/plugins/base.py.
# -----------------------------------------------------------------------------
plugins:

  - id: default_event_sink
    kind: event_sink
    binds: []
    config:
      sink_id: agent_loop

  - id: default_observer
    kind: observer
    binds: []
    config:
      metric_prefix: agent_loop

  # --- Business-logic plugins (drive parse / observation / extract / dispatch)
  # Each plugin replaces a branch that used to live in a node's execute():

  - id: default_parse_decision
    kind: parse_decision
    binds:
      - { kind: event_kind, value: on_decision }
    config: {}

  - id: default_observation_render
    kind: observation_render
    binds:
      - { kind: event_kind, value: on_observation }
    config: {}

  - id: default_memory_extract
    kind: memory_extract
    binds:
      - { kind: event_kind, value: on_reflection }
    config: {}

  - id: default_tool_dispatch_guard
    kind: tool_dispatch_guard
    binds:
      - { kind: event_kind, value: on_decision }
    config: {}
