# =============================================================================
# model_eye — perceive's sub-graph: the model's field of view (ADR-0206 §5.3)
# =============================================================================
# Mounted by: perceive.eye (see perceive.yaml#sub_specs). NOT mounted by
# think / agent_loop.assemble_for_think — eyes belong to perception.
#
# Answers one question: what will the LLM see this turn?
#   see → guard → shape → freeze → frozen ContextManifest
#   ContextManifest = { messages, tools, digest, committed }
#
# Inbound:
#   - context_manifest / system / history / config / tools / user_turn
#     (via perceive.eye sub_spec; tools usually from perceive.inventory)
#   - act.observe.observation ──project──► see.observation
# =============================================================================

id: model_eye
version: 1.1.0
region: model_visible
description: >
  Derive and freeze the model-visible messages + tool schemas for the next
  LLM turn. Owned by perceive; think only reads the result.

graph:
  id: model_eye
  layer: model_visible
  purpose: Session derive + Hub + inventory schemas → frozen ContextManifest.
  members: [see, guard, shape, freeze]
  references: [perceive, act, toolbox]
  relations:
    - { graph: perceive, kind: child_of, role: model_eye }
    - { graph: act, kind: accepts_from, role: project_observation }
    - { graph: toolbox, kind: accepts_from, role: tool_schemas }
  capabilities:
    provides: [model_eye_manifest]
    requires: [session_reader, context_manifest]

# initial.context_manifest : Hub ContextManifest from perceive.commit
# initial.system/history/config/tools/user_turn : header + this-turn user
# initial.observation : optional; usually arrives via project from effect

nodes:

  - id: see
    region: model_visible
    factory: model_eye.see
    ins: [context_manifest, observation, system, history, config, tools, user_turn]
    outs: [sight]

  - id: guard
    region: model_visible
    factory: model_eye.guard
    config:
      trustable_kinds: [text, message, manifest, fact]
      keep: 200
      patterns: ["<internal>", "sk-XXXX"]
    ins: [sight]
    outs: [safe_sight]

  - id: shape
    region: model_visible
    factory: model_eye.shape
    ins: [safe_sight]
    outs: [messages, tools]

  - id: freeze
    region: model_visible
    factory: model_eye.freeze
    config:
      required_roles: [user]
    ins: [messages, tools]
    outs: [manifest]

edges:

  - id: e_init_manifest_to_see
    from: { spec: model_eye, node: _initial, port: context_manifest }
    to:   { spec: model_eye, node: see, port: context_manifest }
    kind: data
  - id: e_init_system_to_see
    from: { spec: model_eye, node: _initial, port: system }
    to:   { spec: model_eye, node: see, port: system }
    kind: data
  - id: e_init_history_to_see
    from: { spec: model_eye, node: _initial, port: history }
    to:   { spec: model_eye, node: see, port: history }
    kind: data
  - id: e_init_config_to_see
    from: { spec: model_eye, node: _initial, port: config }
    to:   { spec: model_eye, node: see, port: config }
    kind: data
  - id: e_init_tools_to_see
    from: { spec: model_eye, node: _initial, port: tools }
    to:   { spec: model_eye, node: see, port: tools }
    kind: data
  - id: e_init_user_to_see
    from: { spec: model_eye, node: _initial, port: user_turn }
    to:   { spec: model_eye, node: see, port: user_turn }
    kind: data
  - id: e_init_observation_to_see
    from: { spec: model_eye, node: _initial, port: observation }
    to:   { spec: model_eye, node: see, port: observation }
    kind: data

  - id: e_see_to_guard
    from: { spec: model_eye, node: see, port: sight }
    to:   { spec: model_eye, node: guard, port: sight }
    kind: data
  - id: e_guard_to_shape
    from: { spec: model_eye, node: guard, port: safe_sight }
    to:   { spec: model_eye, node: shape, port: safe_sight }
    kind: data
  - id: e_shape_messages_to_freeze
    from: { spec: model_eye, node: shape, port: messages }
    to:   { spec: model_eye, node: freeze, port: messages }
    kind: data
  - id: e_shape_tools_to_freeze
    from: { spec: model_eye, node: shape, port: tools }
    to:   { spec: model_eye, node: freeze, port: tools }
    kind: data
