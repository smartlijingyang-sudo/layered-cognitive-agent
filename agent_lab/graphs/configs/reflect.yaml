# =============================================================================
# reflect — brain-reflect sub-graph (ADR-0206 §5, first-principles)
# =============================================================================
# Equivalent to LCA's ``Brain.reflect(state, observation) -> Reflection``
# flattened into a graph:
#
#   join → critique → extract
#
# Reflect judges outcome vs intent and proposes learnable candidates.
# It does NOT write Session / MemorySystem (that is remember).
#
# Mounted by: agent_loop.reflect (see agent_loop.yaml#sub_specs).
# =============================================================================

id: reflect
version: 1.0.0
region: phase:reflect
description: >
  Join observation+decision(+prior), critique into a Reflection, and extract
  memory candidates. One Brain.reflect per loop turn. No durable write.

graph:
  id: reflect
  layer: phase
  purpose: Brain.reflect = join → critique → extract.
  members: [join, critique, extract]
  references: [agent_loop]
  relations:
    - { graph: agent_loop, kind: child_of, role: reflect_phase }
  capabilities:
    provides: [reflection_out, memory_candidates, reflect_signal]
    requires: [critic]

# -----------------------------------------------------------------------------
# INITIAL PORTS
# -----------------------------------------------------------------------------
# initial.in_observation      : Observation from act
# initial.in_decision         : Decision from think
# initial.in_prior_reflection : optional prior-turn Reflection

nodes:

  # ----- join: observation + decision (+ prior) → combined -------------------
  - id: join
    region: phase:reflect
    factory: reflect.join
    config: {}
    ins: [in_observation, in_decision, in_prior_reflection]
    outs: [combined]

  # ----- critique: Critic.critique → Reflection ------------------------------
  - id: critique
    region: phase:reflect
    factory: reflect.critique
    config:
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_reflect:LcaReflectCriticProvider
      provider_config: {}
    ins: [combined]
    outs: [reflection]

  # ----- extract: Reflection → candidates + signal (no durable write) --------
  - id: extract
    region: phase:reflect
    factory: reflect.extract
    config: {}
    ins: [reflection]
    outs: [reflection_out, memory_candidates, reflect_signal]

edges:

  - id: e_init_obs_to_join
    from: { spec: reflect, node: _initial, port: in_observation }
    to:   { spec: reflect, node: join,     port: in_observation }
    kind: data
  - id: e_init_dec_to_join
    from: { spec: reflect, node: _initial, port: in_decision }
    to:   { spec: reflect, node: join,     port: in_decision }
    kind: data
  - id: e_init_prior_to_join
    from: { spec: reflect, node: _initial, port: in_prior_reflection }
    to:   { spec: reflect, node: join,     port: in_prior_reflection }
    kind: data

  - id: e_join_to_critique
    from: { spec: reflect, node: join,     port: combined }
    to:   { spec: reflect, node: critique, port: combined }
    kind: data
  - id: e_critique_to_extract
    from: { spec: reflect, node: critique, port: reflection }
    to:   { spec: reflect, node: extract,  port: reflection }
    kind: data
