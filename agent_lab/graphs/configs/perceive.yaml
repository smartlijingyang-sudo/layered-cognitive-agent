# =============================================================================
# perceive — phase sub-graph (post-fusion v3, first-principles).
# =============================================================================
# Sense (user / tool_results / memory) → aggregate(perceive.bundle) →
# model_eye (see→guard→shape→freeze) → frozen ContextManifest.
#
# model_eye is a CHILD of perceive (sub_spec on the `eye` host). Think does
# not mount model_eye; it only reads perceive's out_manifest.
#
# Per ADR-0194 C4 + ADR-0191 DSH: facts live in Session log; perceive never
# writes state.* and never calls a Hub.
#
# Mounted by: agent_loop.perceive (see agent_loop.yaml#sub_specs).
# =============================================================================

id: perceive
version: 1.0.0
region: phase:perceive
description: >
  Sense then call model_eye to produce the frozen ContextManifest think reads.

graph:
  id: perceive
  layer: phase
  purpose: Perceive = fold(sensors) → model_eye → ContextManifest.
  members: [sense_user, sense_tool_results, memory_resolve, memory_query, memory_normalize, perceive_aggregate, eye]
  references: [agent_loop, model_eye]
  relations:
    - { graph: agent_loop, kind: child_of, role: perceive_phase }
    - { graph: model_eye, kind: contains, role: model_eye }
  capabilities:
    provides: [context_manifest, perceive_bundle]
    requires: [sensor_fold, memory_perceive, model_eye]

# initial.user_turn / tool_results / state : sensing inputs
# initial.system / history / config / tools : header feeds for model_eye

nodes:

  - id: sense_user
    region: phase:perceive
    factory: perceive.sense.user
    ins: [user_turn_in]
    outs: [user_turn_out]

  - id: sense_tool_results
    region: phase:perceive
    factory: perceive.sense.tool_results
    ins: [tool_results_in]
    outs: [tool_results_out]

  - id: memory_resolve
    region: phase:perceive:sensor:memory
    factory: perceive.sense.memory.resolve
    ins: []
    outs: [memory_system]

  - id: memory_query
    region: phase:perceive:sensor:memory
    factory: perceive.sense.memory.query
    ins: [memory_system]
    outs: [raw_items]

  - id: memory_normalize
    region: phase:perceive:sensor:memory
    factory: perceive.sense.memory.normalize
    ins: [raw_items]
    outs: [retrieved_context]

  - id: perceive_aggregate
    region: phase:perceive
    factory: perceive.aggregate
    ins: [user_turn, tool_results, retrieved_context]
    outs: [bundle]

  # Host for model_eye sub-graph. Identity forwards freeze.manifest → manifest.
  - id: eye
    region: model_visible
    factory: identity
    config: { from: manifest, to: manifest }
    ins: [perceive_bundle, system, history, config, tools]
    outs: [manifest]

edges:

  - id: e_init_user_to_sense_user
    from: { spec: perceive, node: _initial, port: user_turn }
    to:   { spec: perceive, node: sense_user, port: user_turn_in }
    kind: data
  - id: e_sense_user_to_aggregate
    from: { spec: perceive, node: sense_user, port: user_turn_out }
    to:   { spec: perceive, node: perceive_aggregate, port: user_turn }
    kind: data

  - id: e_init_tr_to_sense_tr
    from: { spec: perceive, node: _initial, port: tool_results }
    to:   { spec: perceive, node: sense_tool_results, port: tool_results_in }
    kind: data
  - id: e_sense_tr_to_aggregate
    from: { spec: perceive, node: sense_tool_results, port: tool_results_out }
    to:   { spec: perceive, node: perceive_aggregate, port: tool_results }
    kind: data

  - id: e_memory_resolve_to_query
    from: { spec: perceive, node: memory_resolve, port: memory_system }
    to:   { spec: perceive, node: memory_query, port: memory_system }
    kind: data
  - id: e_memory_query_to_normalize
    from: { spec: perceive, node: memory_query, port: raw_items }
    to:   { spec: perceive, node: memory_normalize, port: raw_items }
    kind: data
  - id: e_memory_normalize_to_aggregate
    from: { spec: perceive, node: memory_normalize, port: retrieved_context }
    to:   { spec: perceive, node: perceive_aggregate, port: retrieved_context }
    kind: data

  - id: e_aggregate_to_eye
    from: { spec: perceive, node: perceive_aggregate, port: bundle }
    to:   { spec: perceive, node: eye, port: perceive_bundle }
    kind: data
  - id: e_init_system_to_eye
    from: { spec: perceive, node: _initial, port: system }
    to:   { spec: perceive, node: eye, port: system }
    kind: data
  - id: e_init_history_to_eye
    from: { spec: perceive, node: _initial, port: history }
    to:   { spec: perceive, node: eye, port: history }
    kind: data
  - id: e_init_config_to_eye
    from: { spec: perceive, node: _initial, port: config }
    to:   { spec: perceive, node: eye, port: config }
    kind: data
  - id: e_init_tools_to_eye
    from: { spec: perceive, node: _initial, port: tools }
    to:   { spec: perceive, node: eye, port: tools }
    kind: data

sub_specs:

  - node: eye
    sub_spec: model_eye
    input_map:
      perceive_bundle: perceive_bundle
      system: system
      history: history
      config: config
      tools: tools
    output_map:
      manifest: manifest
