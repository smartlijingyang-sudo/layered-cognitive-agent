# =============================================================================
# perceive — phase sub-graph (LCA production path, first-principles)
# =============================================================================
# SequentialPerceiveHub._fold decomposed into workers, then model_eye:
#
#   resolve → sense ─┐
#            memory ─┼─► trim → commit.context_manifest ─► eye(model_eye)
#            policy ─┘
#
# Hub owns world facts (sensors / memory / policy). Session messages /
# user_turn / tool observations belong to model_eye (DSH + act project).
#
# Mounted by: agent_loop.perceive
# =============================================================================

id: perceive
version: 2.0.0
region: phase:perceive
description: >
  Fold sensors, memory, and policy facts into ContextManifest, then freeze
  the model-visible messages via model_eye.

graph:
  id: perceive
  layer: phase
  purpose: Perceive = Hub fold (resolve→sense/memory/policy→trim→commit) → model_eye.
  members: [resolve, sense, memory, policy, trim, commit, eye]
  references: [agent_loop, model_eye]
  relations:
    - { graph: agent_loop, kind: child_of, role: perceive_phase }
    - { graph: model_eye, kind: contains, role: model_eye }
  capabilities:
    provides: [context_manifest, model_eye_manifest]
    requires: [sensors, memory_system, session_reader, model_eye]

# initial.state : AgentState snapshot for Hub fold
# initial.system / history / config / tools / user_turn : model_eye header feeds

nodes:

  - id: resolve
    region: phase:perceive
    factory: perceive.resolve
    config:
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_perceive:LcaPerceiveResolveProvider
      provider_config: {}
    ins: [state]
    outs: [sensors, memory_ref]

  - id: sense
    region: phase:perceive
    factory: perceive.sense
    config: {}
    ins: [sensors, state]
    outs: [sensor_items]

  - id: memory
    region: phase:perceive
    factory: perceive.memory
    config: {}
    ins: [memory_ref, state]
    outs: [memory_items]

  - id: policy
    region: phase:perceive
    factory: perceive.policy
    config: {}
    ins: [state]
    outs: [policy_items]

  - id: trim
    region: phase:perceive
    factory: perceive.trim
    config: {}
    ins: [sensor_items, memory_items, policy_items]
    outs: [trimmed_items]

  - id: commit
    region: phase:perceive
    factory: perceive.commit
    config: {}
    ins: [trimmed_items]
    outs: [context_manifest]

  - id: eye
    region: model_visible
    factory: identity
    config: { from: manifest, to: manifest }
    ins: [context_manifest, system, history, config, tools, user_turn]
    outs: [manifest]

edges:

  - id: e_init_state_to_resolve
    from: { spec: perceive, node: _initial, port: state }
    to:   { spec: perceive, node: resolve,  port: state }
    kind: data
  - id: e_init_state_to_sense
    from: { spec: perceive, node: _initial, port: state }
    to:   { spec: perceive, node: sense,    port: state }
    kind: data
  - id: e_init_state_to_memory
    from: { spec: perceive, node: _initial, port: state }
    to:   { spec: perceive, node: memory,   port: state }
    kind: data
  - id: e_init_state_to_policy
    from: { spec: perceive, node: _initial, port: state }
    to:   { spec: perceive, node: policy,   port: state }
    kind: data

  - id: e_resolve_sensors_to_sense
    from: { spec: perceive, node: resolve, port: sensors }
    to:   { spec: perceive, node: sense,   port: sensors }
    kind: data
  - id: e_resolve_memory_to_memory
    from: { spec: perceive, node: resolve, port: memory_ref }
    to:   { spec: perceive, node: memory,  port: memory_ref }
    kind: data

  - id: e_sense_to_trim
    from: { spec: perceive, node: sense, port: sensor_items }
    to:   { spec: perceive, node: trim,  port: sensor_items }
    kind: data
  - id: e_memory_to_trim
    from: { spec: perceive, node: memory, port: memory_items }
    to:   { spec: perceive, node: trim,   port: memory_items }
    kind: data
  - id: e_policy_to_trim
    from: { spec: perceive, node: policy, port: policy_items }
    to:   { spec: perceive, node: trim,   port: policy_items }
    kind: data

  - id: e_trim_to_commit
    from: { spec: perceive, node: trim,   port: trimmed_items }
    to:   { spec: perceive, node: commit, port: trimmed_items }
    kind: data

  - id: e_commit_to_eye
    from: { spec: perceive, node: commit, port: context_manifest }
    to:   { spec: perceive, node: eye,    port: context_manifest }
    kind: data
  - id: e_init_system_to_eye
    from: { spec: perceive, node: _initial, port: system }
    to:   { spec: perceive, node: eye,      port: system }
    kind: data
  - id: e_init_history_to_eye
    from: { spec: perceive, node: _initial, port: history }
    to:   { spec: perceive, node: eye,      port: history }
    kind: data
  - id: e_init_config_to_eye
    from: { spec: perceive, node: _initial, port: config }
    to:   { spec: perceive, node: eye,      port: config }
    kind: data
  - id: e_init_tools_to_eye
    from: { spec: perceive, node: _initial, port: tools }
    to:   { spec: perceive, node: eye,      port: tools }
    kind: data
  - id: e_init_user_to_eye
    from: { spec: perceive, node: _initial, port: user_turn }
    to:   { spec: perceive, node: eye,      port: user_turn }
    kind: data

sub_specs:

  - node: eye
    sub_spec: model_eye
    input_map:
      context_manifest: context_manifest
      system: system
      history: history
      config: config
      tools: tools
      user_turn: user_turn
    output_map:
      manifest: manifest
