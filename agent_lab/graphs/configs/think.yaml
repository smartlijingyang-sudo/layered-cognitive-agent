# =============================================================================
# think — brain-think sub-graph (ADR-0206 §5, first-principles B)
# =============================================================================
# Sibling of perceive / act / reflect / remember (stop is control on remember).
# Own workers (not a ModularBrain clone):
#
#   expose → reason → classify → guard
#
# Eyes belong to perceive/model_eye. Think only reads the frozen
# ContextManifest (messages + tools), calls the LLM, classifies, and guards.
# Gate ⊂ Think; control-slot think_guard is passthrough.
#
# Mounted by: agent_loop.think (see agent_loop.yaml#sub_specs).
# =============================================================================

id: think
version: 1.1.0
region: phase:think
description: >
  Peel frozen messages + tools, call the LLM, classify into a Decision,
  and enforce via DecisionGate. One think turn per loop.

graph:
  id: think
  layer: phase
  purpose: Brain.think = expose → reason → classify → guard.
  members: [expose, reason, classify, guard]
  references: [agent_loop]
  relations:
    - { graph: agent_loop, kind: child_of, role: think_phase }
  capabilities:
    provides: [decision, think_signal]
    requires: [context_manifest, llm_call, decision_parse, decision_gate]

# -----------------------------------------------------------------------------
# INITIAL PORTS
# -----------------------------------------------------------------------------
# initial.in_assembled_manifest : frozen ContextManifest from perceive/model_eye
#                                 (messages + tools already committed)
# initial.perceive_out          : optional barrier / perception signal
# initial.in_state              : optional AgentState snapshot for guard

nodes:

  # ----- expose: committed ContextManifest → messages + tools ----------------
  - id: expose
    region: phase:think
    factory: think.expose
    config:
      from: in_assembled_manifest
      to: messages
      tools_to: tools
    ins: [in_assembled_manifest]
    outs: [messages, tools]

  # ----- reason: messages + tools → LLMResponse ------------------------------
  - id: reason
    region: phase:think
    factory: think.reason
    config:
      from: messages
      to: response
      adapter_kwargs: {}
    ins: [messages, tools]
    outs: [response]

  # ----- classify: LLMResponse → Decision (lab action_type) ------------------
  - id: classify
    region: phase:think
    factory: think.classify
    config:
      from: response
      to: decision
    ins: [response]
    outs: [decision]

  # ----- guard: DecisionGate.enforce → Decision + think_signal ---------------
  # Prototype default: explicit null_gate (no silent identity).
  # Production: replace with gate_factory.members listing real DecisionGates.
  - id: guard
    region: phase:think
    factory: think.guard
    config:
      from: decision
      to: enforced_decision
      null_gate: true
    ins: [decision, in_state]
    outs: [enforced_decision, think_signal]

edges:

  - id: e_init_manifest_to_expose
    from: { spec: think, node: _initial, port: in_assembled_manifest }
    to:   { spec: think, node: expose,   port: in_assembled_manifest }
    kind: data

  - id: e_init_state_to_guard
    from: { spec: think, node: _initial, port: in_state }
    to:   { spec: think, node: guard,    port: in_state }
    kind: data

  - id: e_expose_messages_to_reason
    from: { spec: think, node: expose, port: messages }
    to:   { spec: think, node: reason, port: messages }
    kind: data
  - id: e_expose_tools_to_reason
    from: { spec: think, node: expose, port: tools }
    to:   { spec: think, node: reason, port: tools }
    kind: data
  - id: e_reason_to_classify
    from: { spec: think, node: reason,   port: response }
    to:   { spec: think, node: classify, port: response }
    kind: data
  - id: e_classify_to_guard
    from: { spec: think, node: classify, port: decision }
    to:   { spec: think, node: guard,    port: decision }
    kind: data
