# =============================================================================
# toolbox — named-tool inventory graph (ADR-0206 §5)
# =============================================================================
# Single responsibility: project the non-executable tool inventory.
#
# Two exits from one load:
#   load_registry → expose_schemas     → tools (openai schemas for model_eye)
#   load_registry → trust → dedup → resolve_tool  (name → Tool instance)
#
# No tool execution happens here. perceive.inventory uses expose_schemas
# directly; this graph is the full inventory surface for demos / resolve.
# =============================================================================

id: toolbox
version: 0.2.0
region: model_visible
description: >
  Named-tool inventory — openai schemas for model-visible and name→Tool
  resolve for callers that need an instance.

graph:
  id: toolbox
  layer: model_visible
  purpose: Inventory schemas + optional name resolve; never executes tools.
  members: [load_registry, expose_schemas, trust_classify, dedup, resolve_tool]
  references: [perceive, model_eye]
  relations:
    - { graph: perceive, kind: feeds, role: tool_schemas }
    - { graph: model_eye, kind: feeds, role: tool_schemas }
  capabilities:
    provides: [tool_schemas, tool_resolve]
    requires: [tool_registry]

nodes:

  - id: load_registry
    region: model_visible
    factory: registry_loader
    config:
      to: registry_payload
      registry_path: agent_lab/tools/registry.yaml
    ins: []
    outs: [registry_payload]

  - id: expose_schemas
    region: model_visible
    factory: expose_schemas
    config:
      to: tools
    ins: [registry_payload]
    outs: [tools]

  - id: trust_classify
    region: model_visible
    factory: trust_classify
    config:
      trustable_kinds: [fact]
    ins: [any_in]
    outs: [labels]

  - id: dedup
    region: model_visible
    factory: dedup
    config:
      from: labels
      to: deduped
    ins: [from]
    outs: [to]

  - id: resolve_tool
    region: model_visible
    factory: resolve_tool
    config:
      from: deduped
      to: tool_instance
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_toolbox:LcaToolboxResolveProvider
      provider_config: {}
    ins: [in_tool_name, registry_data]
    outs: [tool_instance]

edges:

  - id: e_init_tool_name_to_resolve
    from: { spec: toolbox, node: _initial, port: in_tool_name }
    to:   { spec: toolbox, node: resolve_tool, port: in_tool_name }
    kind: data

  - id: e_load_to_expose
    from: { spec: toolbox, node: load_registry, port: registry_payload }
    to:   { spec: toolbox, node: expose_schemas, port: registry_payload }
    kind: data

  - id: e_load_to_trust
    from: { spec: toolbox, node: load_registry, port: registry_payload }
    to:   { spec: toolbox, node: trust_classify, port: any_in }
    kind: data
  - id: e_trust_to_dedup
    from: { spec: toolbox, node: trust_classify, port: labels }
    to:   { spec: toolbox, node: dedup, port: from }
    kind: data
  - id: e_dedup_to_resolve
    from: { spec: toolbox, node: dedup, port: to }
    to:   { spec: toolbox, node: resolve_tool, port: registry_data }
    kind: data
