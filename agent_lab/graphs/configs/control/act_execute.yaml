# =============================================================================
# act_execute — control-slot sub-graph for act.execute (ADR-0206 §5)
# =============================================================================
# NOT auto-mounted. Grant SSOT is act.authorize in configs/act.yaml.
# Single-node graph wrapping LCA's act.execute control slot.
# Owner: act phase. Safe execution gate — wraps LeadBudgetPolicy or similar.
# Fallback: identity (always allow).
# =============================================================================

id: act_execute
version: 0.1.0
region: phase:act
description: Wraps a callable that gates safe execution of the authorized
  action. Fallback is identity (always allow).

nodes:
  - id: act_execute_slot
    region: phase:act
    factory: act_execute_node
    config:
      from: in_args
      to: allowed
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_control_act:LcaControlActExecuteProvider
      provider_config: {}
    ins: [in_args]
    outs: [allowed]

edges:
  - id: e_init_args_to_slot
    from: { spec: act_execute, node: _initial, port: in_args }
    to:   { spec: act_execute, node: act_execute_slot, port: in_args }
    kind: data
