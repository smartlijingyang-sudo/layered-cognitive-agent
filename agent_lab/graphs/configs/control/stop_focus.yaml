# =============================================================================
# stop_focus — control-slot sub-graph for stop.focus (ADR-0206 §5)
# =============================================================================
# Single-node graph wrapping LCA's stop.focus control slot. Owner host:
# remember (memory). Attached after persist via control_slots. Wraps the
# focus-aware STOP governance executor
# (``lca.plugins.loop.control.stop_focus.FocusStopExecutor``).
#
# A turn is stagnant only if it has an unsuccessful observation, its
# reflection explicitly reports correction/blockage, and its action
# intent is unchanged from the immediately preceding stagnant turn.
# The executor returns ``verdict=allow`` while the consecutive
# stagnation count is below ``max_consecutive_stagnant_turns`` (default
# 3, matching the bundle's ``control.stop.focus`` entry), else
# ``verdict=stop``.
#
# Worker region: phase:stop. Owner host: remember.
# =============================================================================

id: stop_focus
version: 0.1.0
region: phase:stop
description: Focus-aware STOP governance — counts consecutive stagnant
  turns and emits a focus_verdict (allow while count < limit, stop once
  count reaches limit). Mirrors LCA's FocusStopExecutor semantics.

graph:
  id: stop_focus
  layer: control
  purpose: Stagnation-counting stop governance after remember persist.
  members: [stop_focus_handler]
  references: []
  relations:
    - { graph: agent_loop, kind: child_of, role: stop_focus_slot }
  capabilities:
    provides: [control_stop_focus]
    requires: [state_history]

nodes:

  - id: stop_focus_handler
    region: phase:stop
    factory: stop_focus_node
    config:
      to: focus_verdict
      max_consecutive_stagnant_turns: 3
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_control:LcaControlStopFocusProvider
      provider_config: {}
    ins: [in_state, in_decision]
    outs: [focus_verdict]