# =============================================================================
# stop_decide — control sub-graph for ControlSlot.STOP_DECIDE
# =============================================================================
# Single-node handler wrapping StopPolicy.decide.
# Owner host: remember (memory). Attached after persist via control_slots —
# not a peer cognitive phase. Worker region stays phase:stop for catalog.
# =============================================================================

id: stop_decide
version: 0.1.0
region: phase
description: Control-slot handler for stop.decide — runs StopPolicy.decide
  after remember and emits StopDecision + terminal.

graph:
  id: stop_decide
  layer: control
  purpose: StopPolicy continue/halt verdict after remember persist.
  members: [stop_decide_handler]
  references: []
  relations:
    - { graph: agent_loop, kind: child_of, role: stop_decide_slot }
  capabilities:
    provides: [control_stop_decide, terminal]
    requires: [stop_policy]

nodes:

  - id: stop_decide_handler
    region: phase:stop
    factory: stop_decide_node
    config:
      to: stop_decision
      provider_config: {}
    ins: [in_state, in_decision, in_observation, in_reflection]
    outs: [stop_decision, terminal]
