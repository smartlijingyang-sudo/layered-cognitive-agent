# =============================================================================
# remember — phase:remember sub-graph (ADR-0206 §5, first-principles)
# =============================================================================
# Answers one question: what from this turn becomes durable?
#
#   admit → commit → snapshot
#
# Reflect proposes memory_candidates; remember admits them, appends the turn
# fact via Session.append, then snapshots AgentState via StateStore.save.
#
# Mounted by: agent_loop.remember (see agent_loop.yaml#sub_specs).
# =============================================================================

id: remember
version: 1.0.0
region: phase:remember
description: >
  Admit memory candidates, commit the turn fact to Session, and snapshot
  AgentState. Sole durable-write phase for the loop turn.

graph:
  id: remember
  layer: phase
  purpose: Remember = admit → commit → snapshot.
  members: [admit, commit, snapshot]
  references: [agent_loop]
  relations:
    - { graph: agent_loop, kind: child_of, role: remember_phase }
  capabilities:
    provides: [journal_fact, state_ref, remember_signal]
    requires: [session_append, state_store, memory_admit_policy]

# -----------------------------------------------------------------------------
# INITIAL PORTS
# -----------------------------------------------------------------------------
# initial.in_reflection  : Reflection from reflect
# initial.in_observation : Observation from act
# initial.in_decision    : Decision from think
# initial.in_candidates  : memory_candidates from reflect.extract

nodes:

  # ----- admit: memory_candidates → admitted ---------------------------------
  - id: admit
    region: phase:remember
    factory: remember.admit
    config:
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_control:LcaControlRememberAdmitProvider
      provider_config: {}
    ins: [in_candidates, in_observation]
    outs: [admitted]

  # ----- commit: Session.append(turn fact) -----------------------------------
  - id: commit
    region: phase:remember
    factory: remember.commit
    config:
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_memory:LcaRememberJournalProvider
      provider_config: {}
    ins: [in_reflection, in_observation, in_decision, admitted]
    outs: [journal_fact]

  # ----- snapshot: StateStore.save + remember_signal -------------------------
  - id: snapshot
    region: phase:remember
    factory: remember.snapshot
    config:
      provider_kind: lca
      provider_ref: agent_lab.adapters.lca_memory:LcaRememberStateStoreProvider
      provider_config: {}
    ins: [journal_fact]
    outs: [state_ref, remember_signal]

edges:

  - id: e_init_candidates_to_admit
    from: { spec: remember, node: _initial, port: in_candidates }
    to:   { spec: remember, node: admit,    port: in_candidates }
    kind: data
  - id: e_init_obs_to_admit
    from: { spec: remember, node: _initial, port: in_observation }
    to:   { spec: remember, node: admit,    port: in_observation }
    kind: data

  - id: e_init_reflection_to_commit
    from: { spec: remember, node: _initial, port: in_reflection }
    to:   { spec: remember, node: commit,   port: in_reflection }
    kind: data
  - id: e_init_observation_to_commit
    from: { spec: remember, node: _initial, port: in_observation }
    to:   { spec: remember, node: commit,   port: in_observation }
    kind: data
  - id: e_init_decision_to_commit
    from: { spec: remember, node: _initial, port: in_decision }
    to:   { spec: remember, node: commit,   port: in_decision }
    kind: data
  - id: e_admit_to_commit
    from: { spec: remember, node: admit,  port: admitted }
    to:   { spec: remember, node: commit, port: admitted }
    kind: data

  - id: e_commit_to_snapshot
    from: { spec: remember, node: commit,   port: journal_fact }
    to:   { spec: remember, node: snapshot, port: journal_fact }
    kind: data
