# =============================================================================
# mv_assemble — model-visible assembly sub-graph (ADR-0206 §5.3)
# =============================================================================
# Layer 3 of 3. Builds the frozen ContextManifest that the LLM will see
# on the next think turn. Pure data-transformation pipeline; no LLM call,
# no tool call.
#
# Mounted by: agent_loop.assemble_for_think (see agent_loop.yaml#sub_specs).
#
# Inbound cross-spec edges:
#   - effect_dispatch.integrate.observation  ──project──►  classify.results
#     (declared in effect_dispatch.yaml; C1/C2 closure)
#
# Shape (two parallel branches off `classify` and `merge`):
#
#     ┌── classify ─► dedupe ─► rank ─► redact ─►┐
#  ──►                                            ├──► merge ─► validate
#     └── system / history / results ───────────►┘           ├──► commit (→ manifest)
#                                                              └──► assemble_lca (→ lca_manifest)
# =============================================================================

id: mv_assemble
version: 0.1.0
region: model_visible
description: Build a frozen ContextManifest for the next LLM turn. Inputs
  flow through trust classification, dedup, ranking, redaction, message
  merge, schema validation, and manifest commit.

# -----------------------------------------------------------------------------
# GRAPH — organizational metadata.
# -----------------------------------------------------------------------------
graph:
  id: mv_assemble
  layer: model_visible
  purpose: Assemble and freeze the next ContextManifest for the LLM.
  # Local members (declared in this file).
  members: [classify, dedupe, rank, redact, merge, validate, commit, assemble_lca]
  # Cross-spec relations. We are called by agent_loop and we receive a
  # cross-spec project edge from effect_dispatch.
  references: [agent_loop, effect_dispatch]
  relations:
    - { graph: agent_loop,      kind: child_of,  role: think_phase }
    - { graph: effect_dispatch, kind: accepts_from, role: project_observation }
  capabilities:
    provides: [context_manifest, manifest_validation, lca_model_visible_request]
    requires: [trust_classification, dedup, redaction, message_merge]

# -----------------------------------------------------------------------------
# INITIAL PORTS — what the parent (agent_loop.assemble_for_think) and the
# cross-spec project edge supply. The parent feeds 5 inputs verbatim; the
# project edge from effect_dispatch lands on `classify.results`; the
# project edge from perceive lands on `classify.perceive_manifest`.
# -----------------------------------------------------------------------------
# initial.system  : system prompt
# initial.history : prior conversation
# initial.config  : LLM runtime config
# initial.tools   : tool schemas
# initial.results : prior tool observations
# initial.perceive_manifest : the frozen ContextManifest produced by
#                             perceive (closed via the C1/C2 closure
#                             declared in perceive.yaml). Distinct from
#                             `classify.results` so two project edges
#                             don't collide.
#  + cross-spec project into classify.results       (effect_dispatch)
#  + cross-spec project into classify.perceive_manifest (perceive)

# -----------------------------------------------------------------------------
# NODES — two parallel pipelines that meet at `merge`.
#   LEFT:  classify → dedupe → rank → redact            (transform the results feed)
#   RIGHT: system / history come in directly             (bypass the transform)
#   MERGE: merge → {validate, commit, assemble_lca}      (fan-out to 3 final nodes)
# -----------------------------------------------------------------------------
nodes:

  # ===== LEFT BRANCH (input cleaning) ======================================

  # ----- classify: tag every input with a trust label ----------------------
  # Receives {results, system, history, perceive_manifest} and emits a
  # single FACT listing each input's port / kind / trust / digest.
  # ``manifest`` is in the trustable_kinds allowlist so the perceive
  # ContextManifest is tagged `trusted` (it's produced by LCA's own
  # PerceiveHub inside the same trust boundary).
  - id: classify
    region: model_visible
    factory: trust_classify
    config:
      trustable_kinds: [text, message, manifest]
    ins: [results, system, history, perceive_manifest]
    outs: [labels]

  # ----- dedupe: collapse repeated lines ----------------------------------
  - id: dedupe
    region: model_visible
    factory: dedup
    config: { split_on: "\n" }
    ins: [labels]
    outs: [deduped]

  # ----- rank: keep top-K entries -----------------------------------------
  - id: rank
    region: model_visible
    factory: rank
    config: { keep: 50, split_on: "\n" }
    ins: [deduped]
    outs: [ranked]

  # ----- redact: scrub known-sensitive patterns ---------------------------
  - id: redact
    region: model_visible
    factory: redact
    config: { patterns: ["<internal>", "sk-XXXX"] }
    ins: [ranked]
    outs: [sanitized]

  # ===== RIGHT BRANCH (bypass) ============================================
  # system and history do NOT go through the left branch — they enter the
  # merge step directly. No edges in this file, but the merge node's
  # `config.order` lists them as input keys.

  # ===== MERGE + FAN-OUT ===================================================

  # ----- merge: order [system, sanitized, history] into one message list ---
  # Inputs come from three places:
  #   - system, history  : directly from _initial  (bypass left branch)
  #   - sanitized         : from redact             (end of left branch)
  # The output `messages` is the single source-of-truth payload the LLM
  # will read.
  - id: merge
    region: model_visible
    factory: merge_messages
    config: { order: [system, sanitized, history] }
    ins: [system, sanitized, history]
    outs: [messages]

  # ----- validate: schema sanity check (required roles, non-empty) ---------
  # Pure gate. Does not block; emits a verdict artifact the caller can read.
  - id: validate
    region: model_visible
    factory: validate_manifest
    config: { required_roles: [user] }
    ins: [messages]
    outs: [validation]

  # ----- commit: wrap messages into a frozen ContextManifest ---------------
  # LOCAL path. The parent (agent_loop) reads this from the output_map as
  # the primary `out_manifest`.
  - id: commit
    region: model_visible
    factory: commit_manifest
    config: { from: messages, to: manifest }
    ins: [messages]
    outs: [manifest]

  # ----- assemble_lca: same merge, routed through LCA's ModelContextAssembler
  # Alternative manifest shape (ModelVisibleRequest). Emitted on a
  # DISTINCT port `lca_manifest` so the caller can pick the right one
  # (commit vs lca) explicitly. Reads messages + system + config + tools.
  - id: assemble_lca
    region: model_visible
    factory: assemble_lca_mv
    config: { to: lca_manifest, step: 0 }
    ins: [messages, system, config, tools]
    outs: [lca_manifest]

# -----------------------------------------------------------------------------
# EDGES — two parallel branches that meet at `merge`, then fan out to 3 sinks.
# Edges are grouped by destination node so the file reads top-to-bottom
# in the same order as the data path.
# Cross-spec project edges from this file: NONE. The project edges INTO
# classify.results (effect_dispatch) and classify.perceive_manifest
# (perceive) are declared in their owning specs.
# -----------------------------------------------------------------------------
edges:

  # ── initial → classify (4 parallel feeds; results + perceive_manifest
  #    are the two cross-spec project targets; system + history bypass) ──
  - id: e_results_to_classify
    from: { spec: mv_assemble, node: _initial, port: results }
    to:   { spec: mv_assemble, node: classify,    port: results }
    kind: data
  - id: e_system_to_classify
    from: { spec: mv_assemble, node: _initial, port: system }
    to:   { spec: mv_assemble, node: classify,    port: system }
    kind: data
  - id: e_history_to_classify
    from: { spec: mv_assemble, node: _initial, port: history }
    to:   { spec: mv_assemble, node: classify,    port: history }
    kind: data
  - id: e_perceive_manifest_to_classify
    from: { spec: mv_assemble, node: _initial, port: perceive_manifest }
    to:   { spec: mv_assemble, node: classify,    port: perceive_manifest }
    kind: data

  # ── left branch: classify → dedupe → rank → redact ──
  - id: e_classify_to_dedupe
    from: { spec: mv_assemble, node: classify, port: labels }
    to:   { spec: mv_assemble, node: dedupe,   port: labels }
    kind: data
  - id: e_dedupe_to_rank
    from: { spec: mv_assemble, node: dedupe, port: deduped }
    to:   { spec: mv_assemble, node: rank,   port: deduped }
    kind: data
  - id: e_rank_to_redact
    from: { spec: mv_assemble, node: rank,    port: ranked }
    to:   { spec: mv_assemble, node: redact,  port: ranked }
    kind: data
  - id: e_redact_to_merge_sanitized
    from: { spec: mv_assemble, node: redact, port: sanitized }
    to:   { spec: mv_assemble, node: merge, port: sanitized }
    kind: data

  # ── right branch: initial → merge (system + history bypass) ──
  - id: e_system_to_merge
    from: { spec: mv_assemble, node: _initial, port: system }
    to:   { spec: mv_assemble, node: merge,    port: system }
    kind: data
  - id: e_history_to_merge
    from: { spec: mv_assemble, node: _initial, port: history }
    to:   { spec: mv_assemble, node: merge,    port: history }
    kind: data

  # ── fan-out: merge.messages → {validate, commit, assemble_lca} ──
  - id: e_merge_to_validate
    from: { spec: mv_assemble, node: merge,    port: messages }
    to:   { spec: mv_assemble, node: validate, port: messages }
    kind: data
  - id: e_merge_to_commit
    from: { spec: mv_assemble, node: merge,    port: messages }
    to:   { spec: mv_assemble, node: commit,   port: messages }
    kind: data
  - id: e_merge_to_assemble_lca
    from: { spec: mv_assemble, node: merge,       port: messages }
    to:   { spec: mv_assemble, node: assemble_lca, port: messages }
    kind: data

  # ── assemble_lca's auxiliary inputs come from _initial ──
  - id: e_init_system_to_assemble_lca
    from: { spec: mv_assemble, node: _initial, port: system }
    to:   { spec: mv_assemble, node: assemble_lca, port: system }
    kind: data
  - id: e_init_config_to_assemble_lca
    from: { spec: mv_assemble, node: _initial, port: config }
    to:   { spec: mv_assemble, node: assemble_lca, port: config }
    kind: data
  - id: e_init_tools_to_assemble_lca
    from: { spec: mv_assemble, node: _initial, port: tools }
    to:   { spec: mv_assemble, node: assemble_lca, port: tools }
    kind: data
