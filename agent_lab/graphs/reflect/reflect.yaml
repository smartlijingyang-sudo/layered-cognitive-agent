# reflect — phase sub-graph (canonical copy: graphs/configs/reflect.yaml).
# Workers: join → critique → extract.
id: reflect
version: 1.0.0
region: phase:reflect
description: >
  Join observation+decision(+prior), critique into a Reflection, extract
  memory candidates. No durable write (remember owns Session/Memory).

graph:
  id: reflect
  layer: phase
  purpose: Brain.reflect = join → critique → extract.

nodes:
  - id: extract
    region: phase:reflect
    factory: reflect.extract
    ins: [reflection]
    outs: [reflection_out, memory_candidates, reflect_signal]
