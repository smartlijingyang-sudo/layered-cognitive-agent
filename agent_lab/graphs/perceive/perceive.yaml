# perceive — phase sub-graph (post-fusion v2).
#
# perceive is PURE SENSING. NO merge. NO commit. NO trust_label.
# Output: an enriched AgentState (not a ContextManifest — that's
# model_visible's job, via commit_manifest).
#
# Chain (state evolves through each sense, ONE field per node):
#
#   initial.state         ──► sense_user.state
#   initial.user_turn     ──► sense_user.user_turn
#   sense_user.out        ──► sense_tool_results.state
#   initial.tool_results  ──► sense_tool_results.tool_results
#   sense_tool_results.out ──► sense_memory.state
#   sense_memory.out      ──► host.out (= final enriched state)
#
# Mounted by agent_loop as a sub_spec on its perceive host node.
# The parent's user_turn + tool_results initial ports feed into the
# subgraph via the host's input_map.
id: perceive
version: 0.1.0
region: phase:perceive
description: Pure sensing phase — enrich AgentState from user/tool/memory.

graph:
  id: perceive
  layer: phase
  purpose: Perceive = sense(user, tool_results, memory).
  members: [sense_user, sense_tool_results, sense_memory]

nodes:

  # ── sense.user — write user_turn into state.user_input ────────────────
  - id: sense_user
    region: phase:perceive
    factory: perceive.sense.user
    ins: [state, user_turn]
    outs: [state]

  # ── sense.tool_results — write tool_results into state.tool_results ────
  - id: sense_tool_results
    region: phase:perceive
    factory: perceive.sense.tool_results
    ins: [state, tool_results]
    outs: [state]

  # ── sense.memory — query MemorySystem, enrich state.retrieved_context ──
  - id: sense_memory
    region: phase:perceive
    factory: perceive.sense.memory
    ins: [state]
    outs: [state]

  # ── host: identity entry point (sub_spec mount target) ──────────────────
  # Forwards the initial state (and exposes user_turn / tool_results as
  # separate inputs that the agent_loop's perceive host passes through).
  - id: host
    region: phase:perceive
    factory: passthrough__identity
    ins: [in]
    outs: [out]

sub_specs:

  # Mount: agent_loop mounts the perceive subgraph via its perceive host.
  # The parent's "state" port flows into the subgraph via the identity
  # host; the subgraph reads user_turn + tool_results from its own
  # initial ports (wired by the parent via input_map at the mount site).
  - node: host
    sub_spec: perceive
    input_map:
      in: state
    output_map:
      out: state
