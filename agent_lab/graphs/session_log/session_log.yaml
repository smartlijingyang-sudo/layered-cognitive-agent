# session_log — single fact-write surface (post-fusion v2).
# 18 single-responsibility workers around a shared LCA Session:
#
#   WRITE — domain facts (5):
#     write_decision / write_observation / write_reflection /
#     write_tool_result / write_checkpoint
#
#   TRACE — framework lifecycle events (7):
#     trace_node_start / trace_node_end / trace_edge_fire /
#     trace_subgraph_enter / trace_subgraph_exit /
#     trace_before_compile / trace_after_compile
#
#   READ — fold/snapshot/seal (3):
#     read_events / read_header / read_seq
#
#   HOOK — observer + consumption (3):
#     register_observer / fanout_observers / consume_events
#
# Architecture: single identity host + 18 internal workers. No internal
# data edges — each node is an independent endpoint, callable from any
# other graph via sub_spec mounting.
#
# Singleton Session: agent_lab._session_holder.session()
# Configured at boot via configure_session(...); falls back to an
# in-memory default Session if not set.
#
# Framework integration: runner._emit() in runtime/runner.py automatically
# calls the corresponding append_*trace* node when lifecycle events fire
# (node_start, node_end, edge_fire, subgraph_enter, subgraph_exit). This
# graph is the single durable sink for both domain facts AND framework
# trace events.
id: session_log
version: 0.1.0
region: lineage
description: Single fact-write surface for agent_lab. Writes domain facts
  (decision / observation / reflection / tool_result / checkpoint) and
  framework lifecycle events (node_start/end, edge_fire, subgraph_enter/exit,
  before/after_compile) to a shared LCA Session.

graph:
  id: session_log
  layer: lineage
  purpose: Session-backed single fact-write seam (ADR-0186/0191/0194) +
    framework lifecycle tracing.
  members:
    # WRITE — domain facts
    - write_decision
    - write_observation
    - write_reflection
    - write_tool_result
    - write_checkpoint
    # TRACE — framework events
    - trace_node_start
    - trace_node_end
    - trace_edge_fire
    - trace_subgraph_enter
    - trace_subgraph_exit
    - trace_before_compile
    - trace_after_compile
    # READ
    - read_events
    - read_header
    - read_seq
    # HOOK
    - register_observer
    - fanout_observers
    - consume_events

# ──────────────────────────────────────────────────────────────────────
# NODES — 18 single-responsibility workers + 1 identity host.
# ──────────────────────────────────────────────────────────────────────
nodes:

  # ── WRITE: domain facts (per C11 closed set) ─────────────────────────

  - id: write_decision
    region: lineage
    factory: session_log__append_decision
    ins: [decision]
    outs: [seq_ref]

  - id: write_observation
    region: lineage
    factory: session_log__append_observation
    ins: [observation]
    outs: [seq_ref]

  - id: write_reflection
    region: lineage
    factory: session_log__append_reflection
    ins: [reflection]
    outs: [seq_ref]

  - id: write_tool_result
    region: lineage
    factory: session_log__append_tool_result
    ins: [tool_message]
    outs: [seq_ref]

  - id: write_checkpoint
    region: lineage
    factory: session_log__append_checkpoint
    ins: [checkpoint]
    outs: [seq_ref]

  # ── TRACE: framework lifecycle events ───────────────────────────────

  - id: trace_node_start
    region: lineage
    factory: session_log__append_node_start
    ins: [event]
    outs: [seq_ref]

  - id: trace_node_end
    region: lineage
    factory: session_log__append_node_end
    ins: [event]
    outs: [seq_ref]

  - id: trace_edge_fire
    region: lineage
    factory: session_log__append_edge_fire
    ins: [event]
    outs: [seq_ref]

  - id: trace_subgraph_enter
    region: lineage
    factory: session_log__append_subgraph_enter
    ins: [event]
    outs: [seq_ref]

  - id: trace_subgraph_exit
    region: lineage
    factory: session_log__append_subgraph_exit
    ins: [event]
    outs: [seq_ref]

  - id: trace_before_compile
    region: lineage
    factory: session_log__append_before_compile
    ins: [event]
    outs: [seq_ref]

  - id: trace_after_compile
    region: lineage
    factory: session_log__append_after_compile
    ins: [event]
    outs: [seq_ref]

  # ── READ ──────────────────────────────────────────────────────────────

  - id: read_events
    region: lineage
    factory: session_log__snapshot_events
    config: { from_seq: 0, limit: 1000 }
    ins: []
    outs: [events]

  - id: read_header
    region: lineage
    factory: session_log__fold_header
    ins: []
    outs: [header]

  - id: read_seq
    region: lineage
    factory: session_log__session_seq
    ins: []
    outs: [seq]

  # ── HOOK: observer + consumption ─────────────────────────────────────

  - id: register_observer
    region: lineage
    factory: session_log__register_observer
    ins: [observer]
    outs: [cancel]

  - id: fanout_observers
    region: lineage
    factory: session_log__fanout_observers
    ins: [observer]
    outs: [pump]

  - id: consume_events
    region: lineage
    factory: session_log__consume_events
    config: { from_seq: 0, limit: 1000 }
    ins: [consumer]
    outs: [results]

  # ── HOST: identity — sub_spec mount entry point ─────────────────────
  - id: host
    region: lineage
    factory: passthrough__identity
    ins: [in]
    outs: [out]
