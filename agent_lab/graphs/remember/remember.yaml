# remember — phase sub-graph (first-principles).
# Workers: admit → commit → snapshot.
# All durable writes funnel into Session.append + StateStore.save.
id: remember
version: 1.0.0
region: phase:remember
description: Admit memory candidates, commit turn fact, snapshot AgentState.

graph:
  id: remember
  layer: phase
  purpose: Remember phase — admit → commit → snapshot.

nodes:
  - id: admit
    region: phase:remember
    factory: remember.admit
    ins: [in_candidates, in_observation]
    outs: [admitted]
  - id: commit
    region: phase:remember
    factory: remember.commit
    ins: [in_reflection, in_observation, in_decision, admitted]
    outs: [journal_fact]
  - id: snapshot
    region: phase:remember
    factory: remember.snapshot
    ins: [journal_fact]
    outs: [state_ref, remember_signal]
