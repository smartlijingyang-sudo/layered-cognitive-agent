# =============================================================================
# Tool registry — every Tool the agent loop is allowed to dispatch.
# =============================================================================
# This file is NOT a graph (no nodes / edges). It is a *named-tool inventory*
# read by ``agent_lab.tools.registry.ToolRegistry.load_from_yaml`` at boot.
#
# Entry shape:
#   ref:     <python-module>:<Factory>      — factory returning a real Tool
#   kwargs:  { ... }                        — optional kwargs to the factory
#
# To add a new tool: append an entry here.  No code change in the dispatch
# graph is needed as long as the effect graph's ``dispatch`` node lists
# the new tool name in its ``tools:`` range.
#
# To remove a tool: drop the entry.  Any dispatch graph that still lists
# its name will fail loudly at dispatch time (ToolNotFoundError).
# =============================================================================

tools:

  # ----- Real LCA tool (lca/plugins/tools/bash.py) --------------------------
  # Subprocess-backed shell executor. NOT idempotent (subprocess.run is
  # non-idempotent in general). Used by Creator for lightweight self-checks
  # in the preset / workspace directory; upper layer (SafeExecutor +
  # ToolPermissionManifest) is responsible for gating dangerous commands.
  - ref: lca.plugins.tools.bash:build_bash_tool
    kwargs: {}

  # ----- Real LCA tool (lca/plugins/tools/file_write.py) -------------------
  # Write text to a path on disk. Idempotent (same content → same state).
  - ref: lca.plugins.tools.file_write:build_file_write_tool
    kwargs: {}

  # ----- agent_lab adapter tool (adapters/tools/read_file.py) --------------
  # Read a text file from disk. Idempotent. Truncates at ``max_bytes``
  # (default 1 MiB). Lives in agent_lab (not lca) because file reads are
  # not a Creator-only concern; they belong to the agent loop's read tool
  # surface.
  - ref: agent_lab.adapters.tools.read_file:build_read_file_tool
    kwargs: {}
