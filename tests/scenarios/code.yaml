# Scenario 3: code — standard + CodeMode executor strategy.
# CodeMode is a SafeExecutor internal strategy (NOT a new primitive).

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-code.yaml

patch: []

profile:
  id: code
  description: "标准 + Code Mode SDK（一次 model call 多次工具调用）"
  trust: system
  bundle_overrides:
    - id: lca-safe-executor
      config:
        mode: code
        single_call_multi_tool: true
