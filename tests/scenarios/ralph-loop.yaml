# Scenario 5: ralph-loop — workflow automation (patch-then-test cycle).
# Per spec §13.4: 完全由 v3 现有原语组合实现，零新增原语.
# Uses GoalStack + LoopBreaker + TaskContract.

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-ralph.yaml

patch: []

profile:
  id: ralph-loop
  description: "patch-then-test 工作流自动化（Geoffrey Huntley 风格 Ralph Loop）"
  trust: system
  task_contract:
    goal: "修复 issue：跑测试 → 写 patch → 重测 → 通过"
    allowed_actions: [use_tool, RESPOND, STOP]
    forbidden_actions: [DELEGATE, HANDOFF]
    success_criteria:
      - kind: verifiable_fact
        description: "测试套件全绿"
        validator_ref: tool.test_run
    budget:
      call_limit: 100
      time_limit_s: 600
    risk_level: MEDIUM
  goal_stack_policy:
    max_retries: 3
    retry_on: ["test_failed", "build_failed"]
  tools_allow:
    - tool.fs.read
    - tool.fs.write
    - tool.shell
    - tool.test_run
    - tool.git
