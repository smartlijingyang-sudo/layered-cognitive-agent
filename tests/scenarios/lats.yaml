# Scenario 9: lats — Brain replacement + Critic + GoalStack tree search.
# Per spec §13.5.4: Brain 内部跑 MCTS — 树搜索 / rollout / 价值评估 / backprop.

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-lats.yaml

patch: []

profile:
  id: lats
  description: "LATS / MCTS 风格树搜索 + 价值评估"
  trust: system
  brain:
    type: lats
    n_simulations: 50
    rollout_depth: 5
    exploration_constant: 1.4
  critic:
    type: value_network
    evaluation_dimensions: [correctness, completeness, efficiency]
  memory_policy:
    private_layers: [working, semantic]
    tree_evaluation_cache: true
