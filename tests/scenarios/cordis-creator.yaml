# Scenario 4: cordis-creator — four-face Creator Tool + internal Composer lifecycle.
# The agent uses inspect, author, validate and promote; Composer mount/retire remains internal.
# C3/C4/C5/PR12/§23.2 invariants gate promotion.

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml

patch: []

profile:
  id: cordis-creator
  description: "标准 + 运行时检查 + 插件实验 + preset 创作"
  trust: system
  role: cordis-creator
  capability_grant:
    - cordis_control.inspect
    - cordis_control.author
    - cordis_control.validate
    - cordis_control.promote
    - tool_fs.write
    - tool_bash
