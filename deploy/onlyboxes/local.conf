<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- ADR-0244: System-level Fontconfig CJK Aliases & Fallbacks.
         Resolves sans-serif, serif, monospace, and common Chinese font families
         (SimHei, Microsoft YaHei, Arial, Helvetica) directly to installed CJK faces
         (WenQuanYi Zen Hei, WenQuanYi Micro Hei, Noto Sans CJK SC).
         This eliminates the need for application-level monkey-patching (matplotlibrc). -->

    <!-- Default sans-serif CJK fallback -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>WenQuanYi Zen Hei</string>
            <string>WenQuanYi Micro Hei</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <!-- Default serif CJK fallback -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Serif CJK SC</string>
            <string>WenQuanYi Zen Hei</string>
        </edit>
    </match>

    <!-- Default monospace CJK fallback -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>WenQuanYi Zen Hei Mono</string>
            <string>Noto Sans Mono CJK SC</string>
        </edit>
    </match>

    <!-- Common explicit font families requested by LLM code -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>SimHei</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>WenQuanYi Zen Hei</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>Microsoft YaHei</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>WenQuanYi Zen Hei</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>Arial</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>WenQuanYi Zen Hei</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>Helvetica</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>WenQuanYi Zen Hei</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
</fontconfig>
