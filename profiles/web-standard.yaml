# web-standard profile — default deployment configuration.
# Bundles: base (Tier-1 services + Tier-2 providers) + web-app (Tier-3 behaviors)
# + scenario-cordis-creator（Creator §13.3 工具集注册到全局 tools 服务，
# 但启用受 model=cordis-creator 请求触发 + RoleProfile.tool_permission_manifest 闸控）
# + loop_cursor.spine_default (PR-8 §7.6.6 — 19-plugin EventSpine composition with
# source-level introspection **mandatory**; ADR-2026-09-02 §D3; ADR-0174 profile 装配).
# + observability-default (PR-7 五缝 plugin 装配 — LoopCursor / ProjectionHost /
# ModelVisibleCapture / CloseBarrier / Persistence seam + provider).
# + session-runtime (ADR-0186 Session SSOT: session.store before event-bus so
#   the capability is live when publishers/sinks boot; RunSessionBuilder binds
#   a per-run Session onto publish/observe slots).
# + think-orchestrator + think-orchestrator-graph: register the
#   phase.think.orchestrator PhaseExecutor that drives the 5-step think
#   phase graph (shortcut/route/reason/classify/gate). ``think.main``
#   itself is rebound to ``phase.think.orchestrator`` via the topology
#   patch below — the shared ``declarative-phase-graph`` bundle stays
#   untouched, so other profiles importing that bundle continue to use
#   ``phase.think.standard``.
# LLM secrets are owned by lca-llm-resolver (loads project .env at setup).

bundles:
  - bundles/base.yaml
  - bundles/observability-default.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/loop_cursor.spine_default.yaml
  - bundles/session-runtime.yaml
  - bundles/event-bus-components.yaml
  - bundles/think-orchestrator.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true

  # EventSpine file sink — boot events process-local; run events under
  # traces/runs/<run_id>/<run_id>.spine.jsonl (ADR-0165.1 layout / PR-27 L10 / PR-4).
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/boot-spine.jsonl
      runs_root: traces/runs

  # Decompose think.main into the 5-step think subgraph. List fields replace
  # wholesale (lca/harness/profile/plan/declarations.py deep_merge), so we
  # repeat all 6 nodes verbatim and swap think.main's binding only.
  - id: phase.topology.standard
    config:
      nodes:
        - id: perceive.main
          phase: perceive
          binding: phase.perceive.standard
          max_visits: 8
          entry: true
          # PR-C (ADR-0214 §6.3): PG-007 三件套
          precondition: perceive.has_minimum_context
          terminal_predicate: perceive.context_complete
        - id: think.main
          phase: think
          binding: phase.think.orchestrator
          max_visits: 8
        - id: act.main
          phase: act
          binding: phase.act.standard
          max_visits: 8
        - id: reflect.main
          phase: reflect
          binding: phase.reflect.standard
          max_visits: 8
        - id: remember.main
          phase: remember
          binding: phase.remember.standard
          max_visits: 8
        - id: stop.main
          phase: stop
          binding: phase.stop.standard
          max_visits: 8
          terminal: true
