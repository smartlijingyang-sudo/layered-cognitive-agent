# web-standard profile — default deployment configuration.
# Bundles: base (Tier-1 services + Tier-2 providers) + web-app (Tier-3 behaviors)
# + scenario-cordis-creator（Creator §13.3 工具集注册到全局 tools 服务，
# 但启用受 model=cordis-creator 请求触发 + RoleProfile.tool_permission_manifest 闸控）
# + loop_cursor.spine_default (PR-8 §7.6.6 — 19-plugin EventSpine composition with
# source-level introspection **mandatory**; ADR-2026-09-02 §D3; ADR-0174 profile 装配).
# + observability-default (PR-7 五缝 plugin 装配 — LoopCursor / ProjectionHost /
# ModelVisibleCapture / CloseBarrier / Persistence seam + provider).
# + session-runtime (ADR-0186 Session SSOT: session.store before event-bus so
#   the capability is live when publishers/sinks boot; RunSessionBuilder binds
#   a per-run Session onto publish/observe slots).
# + think + act + perceive + reflect + remember + stop subgraph bundles
#   (ADR-0217/0220; six-phase subgraph cutover 2026-09-12).
# LLM secrets are owned by lca-llm-resolver (loads project .env at setup).

bundles:
  - bundles/base.yaml
  - bundles/observability-default.yaml
  - bundles/observation-9module.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/loop_cursor.spine_default.yaml
  - bundles/session-runtime.yaml
  - bundles/event-bus-components.yaml
  - bundles/think.yaml
  - bundles/act.yaml
  - bundles/perceive_subgraph.yaml
  - bundles/reflect_subgraph.yaml
  - bundles/remember_subgraph.yaml
  - bundles/stop_subgraph.yaml

patch:
  # EventSpine file sink — boot events process-local; run events under
  # traces/runs/<run_id>/<run_id>.spine.jsonl (ADR-0165.1 layout / PR-27 L10 / PR-4).
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/boot-spine.jsonl
      runs_root: traces/runs

  # Patch topology to add PR-C (ADR-0214 §6.3) PG-007 preconditions and
  # terminal predicates on perceive.main. Each phase main carries a
  # node-level sub_spec_ref (Node Note 2026-09-09-phase-node-sub-spec-ref,
  # ADR-0217 BundleGraphSpec v2) that delegates to the phase's subgraph
  # bundle; the interpreter enters the subgraph via ``sub_spec_ref``
  # and dispatches NodeExecutor plugins (think/act pattern; six-phase
  # subgraph cutover 2026-09-12). Framework subtree no longer sees
  # PhaseExecutor/PhaseInput/PhaseResult.
  - id: phase.topology.standard
    config:
      nodes:
        - id: perceive.main
          phase: perceive
          max_visits: 8
          entry: true
          # PR-C (ADR-0214 §6.3): PG-007 三件套
          precondition: perceive.has_minimum_context
          terminal_predicate: perceive.context_complete
          sub_spec_ref:
            plan_ref: bundles/perceive_subgraph.yaml
            entry_node: perceive.host
            binding_edge: perceive.main
        - id: think.main
          phase: think
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/think.yaml
            entry_node: think.shortcut
            binding_edge: think.main
        - id: act.main
          phase: act
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/act.yaml
            entry_node: act.validate
            binding_edge: act.main
        - id: reflect.main
          phase: reflect
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/reflect_subgraph.yaml
            entry_node: reflect.host
            binding_edge: reflect.main
        - id: remember.main
          phase: remember
          max_visits: 8
          sub_spec_ref:
            plan_ref: bundles/remember_subgraph.yaml
            entry_node: remember.host
            binding_edge: remember.main
        - id: stop.main
          phase: stop
          max_visits: 8
          terminal: true
          sub_spec_ref:
            plan_ref: bundles/stop_subgraph.yaml
            entry_node: stop.host
            binding_edge: stop.main
