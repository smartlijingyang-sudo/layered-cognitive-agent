# web-standard profile — default deployment configuration.
# Bundles: base (Tier-1 services + Tier-2 providers) + web-app (Tier-3 behaviors)
# LLM secrets are owned by lca-llm-resolver (loads project .env at setup).

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true
