# web-standard profile — default deployment configuration.
# Bundles: base (Tier-1 services + Tier-2 providers) + web-app (Tier-3 behaviors)
# + scenario-cordis-creator（Creator §13.3 工具集注册到全局 tools 服务，
# 但启用受 model=cordis-creator 请求触发 + RoleProfile.tool_permission_manifest 闸控）
# + loop_cursor.spine_default (PR-8 §7.6.6 — 19-plugin EventSpine composition with
# source-level introspection **mandatory**; ADR-2026-09-02 §D3; ADR-0174 profile 装配).
# + observability-default (PR-7 五缝 plugin 装配 — LoopCursor / ProjectionHost /
# ModelVisibleCapture / CloseBarrier / Persistence seam + provider).
# LLM secrets are owned by lca-llm-resolver (loads project .env at setup).

bundles:
  - bundles/base.yaml
  - bundles/observability-default.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/loop_cursor.spine_default.yaml
  - bundles/event-bus-components.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true

  # EventSpine file sink — boot events process-local; run events under
  # traces/runs/<run_id>/<run_id>.spine.jsonl (ADR-0165.1 layout / PR-27 L10 / PR-4).
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/boot-spine.jsonl
      runs_root: traces/runs
