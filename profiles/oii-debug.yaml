# oii-debug profile — keeps production web-standard semantics but routes
# the file sink to a debug-distinct path so OII traces don't overwrite
# the production journal.
#
# As of ADR-2026-09-02-i17-traceback §D3, ``spine.reflector.source`` is
# mandatory in ``spine-default``; this profile no longer needs the
# separate ``spine-oii-debug`` bundle for attacher presence. It keeps
# the bundle only to apply the custom debug boot-path.

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/spine-default.yaml
  - bundles/spine-oii-debug.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true

  # EventSpine file sink — debug trace directory, kept distinct from
  # the production web-standard path.
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/oii-debug-boot-events.jsonl
      runs_root: traces/runs
