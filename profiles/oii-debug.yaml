# oii-debug profile — extends web-standard with deep introspection.
#
# Source-level attacher (spine.reflector.source) is enabled here for OII
# debugging. The web-standard bundle does not declare this plugin at
# all; this profile adds it via bundles/spine-oii-debug.yaml. Source-
# level fields carry a 4 KB locals snapshot with secret redaction per
# §7.6.6 — keep this profile off the production gateway.
#
# Same LLM patch and base / web-app / scenario / phase-graph bundles as
# web-standard; the spine composition is augmented with the source
# bundle and the file sink path is renamed to keep debug traces
# separate.

bundles:
  - bundles/base.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/spine-default.yaml
  - bundles/spine-oii-debug.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true

  # EventSpine file sink — debug trace directory, kept distinct from
  # the production web-standard path.
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/oii-debug-boot-events.jsonl
      runs_root: traces/runs
