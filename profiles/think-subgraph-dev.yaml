# think-subgraph-dev — production loop with decomposed think phase graph.
#
# Same bundles as web-standard;think 5 步子图走 ADR-0217 BundleGraphSpec v2
# (bundles/think.yaml)。plugin 注册走 5 个 @plugin(...) 装饰器;FactoryRegistry
# 按 factory 业务语义名解析到 NodeExecutor。
#
# Not the factory default. Use:
#   uv run python -m lca_kernel serve --profile profiles/think-subgraph-dev.yaml

bundles:
  - bundles/base.yaml
  - bundles/observability-default.yaml
  - bundles/web-app.yaml
  - bundles/scenario-cordis-creator.yaml
  - bundles/declarative-phase-graph.yaml
  - bundles/loop_cursor.spine_default.yaml
  - bundles/session-runtime.yaml
  - bundles/event-bus-components.yaml
  - bundles/think-cordis.yaml
  - bundles/think.yaml

patch:
  - id: lca-llm-resolver
    config:
      default_model: qwen3.7-plus
      load_dotenv: true
  - id: spine.sink.file
    config:
      boot_path: .lca/spine/boot-spine.jsonl
      runs_root: traces/runs
  - id: phase.topology.standard
    config:
      nodes:
        - id: perceive.main
          phase: perceive
          binding: phase.perceive.standard
          max_visits: 8
          entry: true
        - id: think.main
          phase: think
          binding: phase.think.standard
          max_visits: 8
          # Node Note 2026-09-09-phase-node-sub-spec-ref: 节点级嵌套 think 子图。
          sub_spec_ref:
            plan_ref: bundles/think.yaml
            entry_node: think.shortcut
            binding_edge: think.main
        - id: act.main
          phase: act
          binding: phase.act.standard
          max_visits: 8
        - id: reflect.main
          phase: reflect
          binding: phase.reflect.standard
          max_visits: 8
        - id: remember.main
          phase: remember
          binding: phase.remember.standard
          max_visits: 8
        - id: stop.main
          phase: stop
          binding: phase.stop.standard
          max_visits: 8
          terminal: true
