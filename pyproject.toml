[project]
name = "lca-framework"
version = "0.1.0"
description = "Layered Cognitive Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "httpx>=0.28.1",
    "openai>=2.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "starlette>=0.46",
    "structlog>=26.1.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=14.0",
    "taiyi-cordis",
    "taiyi-cosmokit",
    "taiyi-schemastery",
]

[tool.uv.sources]
taiyi-cordis      = { path = "vendor/cordis" }
taiyi-cosmokit    = { path = "vendor/cosmokit" }
taiyi-schemastery = { path = "vendor/schemastery" }

[tool.importlinter]
root_package = "lca"
include_external_packages = true

# ── 契约 1: L0→L1→L2→L3 + contracts 严格单向分层 ──
# 每层只能 import 直接下方一层；contracts 是最底层
[[tool.importlinter.contracts]]
name = "严格分层: contracts → L0 → L1 → L2 → L3"
type = "layers"
layers = [
    "lca.layer3_agent",
    "lca.layer2_runtime",
    "lca.layer1_cognitive",
    "lca.layer0_infra",
    "lca.contracts",
]

# ── 契约 2: L4 作为组合根，可依赖所有下层 ──
# 但下层不得反向依赖 L4（用 forbidden 约束）
[[tool.importlinter.contracts]]
name = "L4 组合根: 下层禁止反向依赖"
type = "forbidden"
source_modules = [
    "lca.contracts",
    "lca.layer0_infra",
    "lca.layer1_cognitive",
    "lca.layer2_runtime",
    "lca.layer3_agent",
]
forbidden_modules = ["lca.layer4_app"]

# ── 契约 3: contracts 是纯数据契约层，不得 import 任何实现细节 ──
[[tool.importlinter.contracts]]
name = "contracts 纯净性: 不得依赖任何具体实现"
type = "forbidden"
source_modules = ["lca.contracts"]
forbidden_modules = [
    "lca.layer0_infra",
    "lca.layer1_cognitive",
    "lca.layer2_runtime",
    "lca.layer3_agent",
    "lca.layer4_app",
    "lca.harness",
    "lca.plugins",
]

# ── 契约 4: harness 实现不得反向依赖认知/运行时/组合根 ──
[[tool.importlinter.contracts]]
name = "harness: 不得依赖 L1–L4"
type = "forbidden"
source_modules = ["lca.harness"]
forbidden_modules = [
    "lca.layer1_cognitive",
    "lca.layer2_runtime",
    "lca.layer3_agent",
    "lca.layer4_app",
]

# ── 契约 5: LCA plugin 不得反向依赖 Gateway ──
# Drivers live in gateway because they bind gateway protocol types
# (RunSession, PlaneBindings, SOLO_MODE_KEY) to LCA runtime. LCA plugins
# only provide/require capabilities; they never import gateway directly.
# Gateway boot calls register_default_drivers() after the plugin tree
# is up (ADR-0062 §6 / PR-5).
[[tool.importlinter.contracts]]
name = "plugins: 不得依赖 gateway"
type = "forbidden"
source_modules = ["lca.plugins"]
forbidden_modules = ["gateway"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "security" },
]
lint = [
    "ruff>=0.16.0",
]
typecheck = [
    "mypy>=1.13",
    "pydantic>=2.9",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
]
security = [
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "vulture>=2.13",
    "interrogate>=1.7",
]
llm-openai = [
    "openai>=2.0",
    "python-dotenv>=1.0",
]
observability-langfuse = [
    "langfuse>=3.0",
]
web = [
    "starlette>=0.46",
    "uvicorn>=0.34",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# SKILL.md files embed Python code blocks; ruff 0.16+ misinterprets the file as
# Python when the embedded block parses cleanly. Treat all .md as out of scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "S",
    "N",
    "RUF",
    "TCH",
]
ignore = [
    "E501",
    "RUF001",  # 中文全角标点（字符串）
    "RUF002",  # 中文全角标点（docstring）
    "RUF003",  # 中文全角标点（注释）
    "TC001",   # 运行时 import 与 TYPE_CHECKING 混用，首版暂不强制
    "TC003",   # 同上
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"gateway/*" = ["TC002"]
"scripts/*" = ["S101"]
"lca/contracts/protocols/**/*.py" = ["ARG002"]
"lca/contracts/mechanisms.py" = ["ARG002"]
"lca/contracts/action.py" = ["ARG002"]
"lca/layer0_infra/ops/cli.py" = ["B008", "S603"]  # typer defaults + tail logs
"lca/layer0_infra/ops/config.py" = ["S105"]  # sudo_pass_file is a path, not a secret
"lca/layer0_infra/ops/sudo.py" = ["S603"]  # privileged subprocess wrapper
"lca/layer0_infra/ops/service.py" = ["S603", "S607", "S110", "SIM105"]  # subprocess for process management
"lca/layer0_infra/ops/services/*.py" = ["S603", "S607", "S110", "SIM105"]  # subprocess for service management

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
# lca/packages/* 是上游 deepseek-harness 的源码镜像，目录名带连字符（非合法 Python 包），
# mypy 会静默跳过扫描整个 lca/ 并返回 0，导致类型检查实际失效。这里显式排除。
exclude = [
    "^lca/packages/.*",
    "^lca/contracts/protocols/.*",
    "^lca/layer0_infra/llm_adapter/openai_compat/.*",
]
# contracts 层使用 stdlib dataclass，不迁移到 Pydantic

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "lca.layer0_infra.llm_adapter.openai_compat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "dotenv", "yaml", "cordis", "cordis.*", "langfuse", "deepseek_harness"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway.*", "starlette", "starlette.*", "uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --cov=lca --cov-report=term-missing -m 'not real_llm'"
testpaths = ["tests"]
markers = [
    "real_llm: 需要 LLM_API_KEY 才会执行的真实 LLM 集成测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:lca",
]

[tool.vulture]
paths = ["lca"]
exclude = [
    "lca/contracts/protocols",
    "lca/layer0_infra/llm_adapter/anthropic_llm.py",
    "lca/layer0_infra/llm_adapter/openai_compat/",
]
ignore_names = ["n", "predicted_state", "version", "agent_card", "context_refs", "subtask"]
