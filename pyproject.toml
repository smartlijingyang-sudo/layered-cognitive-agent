[project]
name = "lca-framework"
version = "0.1.0"
description = "Layered Cognitive Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "httpx>=0.28.1",
    "openai>=2.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "starlette>=0.46",
    "structlog>=26.1.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=14.0",
    "taiyi-cordis",
    "taiyi-cosmokit",
    "taiyi-schemastery",
    "ulid-py>=1.0.0",
]

[tool.uv.sources]
taiyi-cordis      = { path = "vendor/cordis" }
taiyi-cosmokit    = { path = "vendor/cosmokit" }
taiyi-schemastery = { path = "vendor/schemastery" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lca*", "gateway*", "lca_kernel"]
exclude = ["tests*", "skills*", "roles*", "profiles*", "bundles*", "history*", "packages*", "deploy*", "vendor*"]

[tool.importlinter]
root_package = "lca"
include_external_packages = true

# ── 契约 1: L0→L1→L2→L3 + contracts 严格单向分层 ──
# 每层只能 import 直接下方一层；contracts 是最底层
[[tool.importlinter.contracts]]
name = "严格分层: contracts → L0 → L1 → L2 → L3"
type = "layers"
layers = [
    "lca.agent",
    "lca.runtime",
    "lca.cognition",
    "lca.infrastructure",
    "lca.contracts",
]

# ── 契约 2: L4 作为组合根，可依赖所有下层 ──
# 但下层不得反向依赖 L4（用 forbidden 约束）
[[tool.importlinter.contracts]]
name = "L4 组合根: 下层禁止反向依赖"
type = "forbidden"
source_modules = [
    "lca.contracts",
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
]
forbidden_modules = ["lca.application"]

# ── 契约 3: contracts 是纯数据契约层，不得 import 任何实现细节 ──
[[tool.importlinter.contracts]]
name = "contracts 纯净性: 不得依赖任何具体实现"
type = "forbidden"
source_modules = ["lca.contracts"]
forbidden_modules = [
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
    "lca.application",
    "lca.harness",
    "lca.plugins",
]

# ── 契约 4: harness 实现不得反向依赖认知/运行时/组合根 ──
[[tool.importlinter.contracts]]
name = "harness: 不得依赖 L1–L4"
type = "forbidden"
source_modules = ["lca.harness"]
forbidden_modules = [
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
    "lca.application",
]

# ── 契约 5: LCA plugin 不得反向依赖 Gateway ──
# Drivers live in gateway because they bind gateway protocol types
# (RunSession, PlaneBindings, SOLO_MODE_KEY) to LCA runtime. LCA plugins
# only provide/require capabilities; they never import gateway directly.
# Gateway boot calls register_default_drivers() after the plugin tree
# is up (ADR-0062 §6 / PR-5).
[[tool.importlinter.contracts]]
name = "plugins: 不得依赖 gateway (ADR-0119 followup 收紧)"
type = "forbidden"
source_modules = ["lca.plugins"]
forbidden_modules = ["gateway"]
# ADR-0119 决定 1 followup(本 commit):gateway/ 95 个业务文件全部迁出,
# ``gateway/`` 目录物理删除,本 contract 永远满足(任何 plugin 不得 import gateway.*)。
# 紧跟在 PR-2 后的 lca.* namespace 收敛(95 业务文件已迁),ignore_imports 不再需要。

# ── 契约 6: 下层 (L0–L3) 不得 import lca_kernel 内部模块 ──
# ADR-0115 决定 3: lca_kernel 是顶层 host 包,下层禁止 import。
# 严格说应禁 lca_kernel 整包 + 公共面(application/cli 走 spawn 入口),
# 但 CLI kernel command + transport lifespan_adapter 需要走公共面。
# 用 forbidden (top-level lca_kernel) + ignore_imports 列白名单。
# 真正对子模块(source/plan/...) 的访问,由
# ``tests/lca_kernel/test_boundary.py`` AST 检查覆盖。
[[tool.importlinter.contracts]]
name = "kernel-domain-isolation: L0–L3 不得 import lca_kernel"
type = "forbidden"
source_modules = [
    "lca.contracts",
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
]
forbidden_modules = ["lca_kernel"]
ignore_imports = [
    # CLI 是 kernel 的合法调用方(``lca-ops kernel {boot,serve,stop,compose}``);
    # 走公共面 import (compile_profile / run_kernel / stop_kernel)。
    "lca.infrastructure.cli.commands.kernel -> lca_kernel",
]

# ── 契约 7: transport plugin 不得 import kernel 内部 + cognition/agent/runtime ──
# ADR-0115 决定 3: transport (lca/plugins/transport/**) 是独立 transport
# namespace。通过 ctx.inject 跟 kernel 交互,不直接 import kernel 内部。
# 公共面(lca_kernel.run_kernel_lifespan / run_kernel / Stage / PatchConfig)
# 允许走 lifespan_adapter。
[[tool.importlinter.contracts]]
name = "transport-isolation: lca.plugins.transport 不得 import cognition / agent / runtime"
type = "forbidden"
source_modules = ["lca.plugins.transport"]
forbidden_modules = [
    "lca.cognition",
    "lca.agent",
    "lca.runtime",
]
# lca_kernel 公共面是 transport 的合法依赖,这里只禁认知/运行/Agent 实现。

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "security" },
]
lint = [
    "ruff>=0.16.0",
]
typecheck = [
    "mypy>=1.13",
    "pydantic>=2.9",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
]
security = [
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "vulture>=2.13",
    "interrogate>=1.7",
]
llm-openai = [
    "openai>=2.0",
    "python-dotenv>=1.0",
]
observability-langfuse = [
    "langfuse>=3.0",
]
web = [
    "starlette>=0.46",
    "uvicorn>=0.34",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# SKILL.md files embed Python code blocks; ruff 0.16+ misinterprets the file as
# Python when the embedded block parses cleanly. Treat all .md as out of scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "S",
    "N",
    "RUF",
    "TCH",
]
ignore = [
    "E501",
    "RUF001",  # 中文全角标点（字符串）
    "RUF002",  # 中文全角标点（docstring）
    "RUF003",  # 中文全角标点（注释）
    "TC001",   # 运行时 import 与 TYPE_CHECKING 混用，首版暂不强制
    "TC003",   # 同上
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"tests/lca_plugins/transport/**/*.py" = ["TC002"]
"gateway/*" = ["TC002"]
"scripts/*" = ["S101"]
"lca/contracts/protocols/**/*.py" = ["ARG002", "TC002"]
"lca/contracts/mechanisms.py" = ["ARG002"]
"lca/contracts/action.py" = ["ARG002"]
"lca/plugins/transport/**/*.py" = ["TC002"]
"lca.infrastructure.cli/cli.py" = ["B008", "S603"]  # typer defaults + tail logs
"lca.infrastructure.cli/commands/*.py" = ["B008", "S603"]  # typer defaults + tail logs
"lca.infrastructure.cli/config.py" = ["S105"]  # sudo_pass_file is a path, not a secret
"lca.infrastructure.cli/sudo.py" = ["S603"]  # privileged subprocess wrapper
"lca.infrastructure.cli/service.py" = ["S603", "S607", "S110", "SIM105"]  # subprocess for process management
"lca.infrastructure.cli/services/*.py" = ["S603", "S607", "S110", "SIM105"]  # subprocess for service management
"deploy/lobehub/engine.py" = ["S603", "S607"]  # git describe on .lobehub-upstream (controlled path)
"lca_kernel/*" = ["N999", "TC002", "RUF006"]  # top-level pkg; Stage re-imported at runtime; fire-and-forget create_task

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    "^lca/contracts/protocols/.*",
    "^lca/infrastructure/llm_adapter/openai_compat/.*",
]
# contracts 层使用 stdlib dataclass，不迁移到 Pydantic

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "lca.infrastructure.llm_adapter.openai_compat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "dotenv", "yaml", "cordis", "cordis.*", "langfuse", "deepseek_harness"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway.*", "starlette", "starlette.*", "uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --cov=lca --cov-report=term-missing -m 'not real_llm'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_llm: 需要 LLM_API_KEY 才会执行的真实 LLM 集成测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:lca",
]

[tool.vulture]
paths = ["lca"]
exclude = [
    "lca/contracts/protocols",
    "lca/infrastructure/llm_adapter/anthropic_llm.py",
    "lca/infrastructure/llm_adapter/openai_compat/",
]
ignore_names = ["n", "predicted_state", "version", "agent_card", "context_refs", "subtask"]

[tool.lca.lint-checks]
# Architecture / contract gates. Executed via pre-commit and standalone
# ``uv run python <script>``. CI runs this list's newest ADR-0096 gate.
checks = [
    "scripts/check_protocol_impl.py",
    "scripts/check_plugin_typing.py",
    "scripts/check_no_any.py",
    "scripts/check_no_bare_strings.py",
    "scripts/check_assembly_purity.py",
    "scripts/check_no_flat_runs.py",
    "scripts/check_protocol_schema_version.py",
    "scripts/check_patch_integrity.py",
    # Package organization (2026-08-30 cleanup batch):
    "scripts/check_package_size.py",
    "scripts/check_package_contracts.py",
    "scripts/check_package_noun.py",
    "scripts/check_filename_boundaries.py",
    "scripts/check_no_utility_modules.py",
    "scripts/check_no_barrel_glob.py",
    "scripts/check_package_integrity.py",
    "scripts/check_readme_filled.py",
    # Plugin metadata completeness (PR-4 gate):
    "scripts/check_plugin_metadata.py",
]

[tool.lca.package_contracts]

[tool.lca.package_contracts."lca"]
responsibility = "LCA 一级包命名空间；根层"
not_responsible_for = "具体业务（见各子包）"
allowed_dependencies = []
forbidden_dependencies = []
side_effects = []
public_api = [
    "lca",
]
schema_version = "1.0.0"

[tool.lca.package_contracts."lca.agent"]
responsibility = "lca.agent: 单 Agent、Team、委派和编排。本 README 由脚手架生成，待包负责人补充具体细节。"
not_responsible_for = "跨层职责（详见 spec §3.4 闭集纪律）"
allowed_dependencies = [
    "lca.contracts",
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
]
forbidden_dependencies = [
    "lca.application",
    "lca.harness",
    "lca.plugins",
    "gateway",
]
side_effects = [
    "log:emit",
]
public_api = [
    "lca.agent",
]
schema_version = "1.0.0"

[tool.lca.package_contracts."lca.agent.orchestration_strategies"]
responsibility = "lca.agent.orchestration_strategies: 编排策略。本 README 由脚手架生成，待包负责人补充具体细节。"
not_responsible_for = "跨层职责（详见 spec §3.4 闭集纪律）"
allowed_dependencies = [
    "lca.contracts",
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
]
forbidden_dependencies = [
    "lca.application",
    "lca.harness",
    "lca.plugins",
    "gateway",
]
side_effects = []
public_api = [
    "lca.agent.orchestration_strategies",
]
schema_version = "1.0.0"

[tool.lca.package_contracts."lca.application"]
responsibility = "lca.application: 组合根、用例入口、依赖注入、命令处理。本 README 由脚手架生成，待包负责人补充具体细节。"
not_responsible_for = "跨层职责（详见 spec §3.4 闭集纪律）"
allowed_dependencies = [
    "lca.contracts",
    "lca.infrastructure",
    "lca.cognition",
    "lca.runtime",
    "lca.agent",
    "lca.application",
]
forbidden_dependencies = [
    "lca.harness",
    "lca.plugins",
    "gateway",
]
side_effects = [
    "log:emit",
    "file:read",
    "file:write",
]
public_api = [
    "lca.application",
]
# filename_whitelist = ["all"]: per ADR-0105 §3.3, this package
# is structurally inseparable (multiple data/protocol types in
# one concept; splitting would fragment cross-cutting concerns).
filename_whitelist = ["all"]
schema_version = "1.0.0"

