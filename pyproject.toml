[project]
name = "lca-framework"
version = "0.1.0"
description = "Layered Cognitive Agent Framework"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
]

[tool.importlinter]
root_package = "lca"

# ── 契约 1: L0→L1→L2→L3 + contracts 严格单向分层 ──
# 每层只能 import 直接下方一层；contracts 是最底层
[[tool.importlinter.contracts]]
name = "严格分层: contracts → L0 → L1 → L2 → L3"
type = "layers"
layers = [
    "lca.layer3_agent",
    "lca.layer2_runtime",
    "lca.layer1_cognitive",
    "lca.layer0_infra",
    "lca.contracts",
]

# ── 契约 2: L4 作为组合根，可依赖所有下层 ──
# 但下层不得反向依赖 L4（用 forbidden 约束）
[[tool.importlinter.contracts]]
name = "L4 组合根: 下层禁止反向依赖"
type = "forbidden"
source_modules = [
    "lca.contracts",
    "lca.layer0_infra",
    "lca.layer1_cognitive",
    "lca.layer2_runtime",
    "lca.layer3_agent",
]
forbidden_modules = ["lca.layer4_app"]

# ── 契约 3: contracts 是纯数据契约层，不得 import 任何实现细节 ──
[[tool.importlinter.contracts]]
name = "contracts 纯净性: 不得依赖任何具体实现"
type = "forbidden"
source_modules = ["lca.contracts"]
forbidden_modules = [
    "lca.layer0_infra",
    "lca.layer1_cognitive",
    "lca.layer2_runtime",
    "lca.layer3_agent",
    "lca.layer4_app",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "security" },
]
lint = [
    "ruff>=0.16.0",
]
typecheck = [
    "mypy>=1.13",
    "pydantic>=2.9",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
]
security = [
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "vulture>=2.13",
    "interrogate>=1.7",
]
llm-openai = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "S",
    "N",
    "RUF",
    "TCH",
]
ignore = [
    "E501",
    "RUF001",  # 中文全角标点（字符串）
    "RUF002",  # 中文全角标点（docstring）
    "RUF003",  # 中文全角标点（注释）
    "TC001",   # 运行时 import 与 TYPE_CHECKING 混用，首版暂不强制
    "TC003",   # 同上
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"lca/contracts/protocols.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
# contracts 层使用 stdlib dataclass，不迁移到 Pydantic（ADR-0012）

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "lca.layer0_infra.llm_adapter.openai_compat"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "dotenv"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --cov=lca --cov-report=term-missing -m 'not real_llm'"
testpaths = ["tests"]
markers = [
    "real_llm: 需要 LLM_API_KEY 才会执行的真实 LLM 集成测试",
]

[tool.vulture]
paths = ["lca"]
exclude = [
    "lca/contracts/protocols.py",
    "lca/layer0_infra/llm_adapter/anthropic_llm.py",
    "lca/layer0_infra/llm_adapter/openai_compat.py",
]
ignore_names = ["n", "predicted_state", "version", "agent_card", "context_refs", "subtask"]
