[project]
name = "taiyi-cosmokit"
version = "0.1.0"
description = "taiyi-cosmokit — 1:1 Python port of @deepseek-ai/cosmokit utility library"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmokit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/cosmokit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N", "ASYNC"]
# N802, N806, N815, N816 — 1:1 port keeps upstream TS camelCase identifiers
# (``isNullable``, ``mapValues``, ``formatProperty``, ``valueMap``, …).
ignore = ["E501", "B008", "N802", "N806", "N815", "N816"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["src/cosmokit", "tests"]
exclude = ["invariant"]
