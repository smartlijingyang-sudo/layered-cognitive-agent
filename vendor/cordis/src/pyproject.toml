[project]
name = "taiyi-cordis"
version = "0.1.0"
description = "taiyi-cordis — 1:1 Python port of @deepseek-ai/cordis plugin framework"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cordis"]
