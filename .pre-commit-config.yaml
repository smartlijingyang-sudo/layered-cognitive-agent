repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.4
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: import-linter
        name: 五层架构契约检查
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy 类型检查
        entry: uv run mypy lca
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-any
        name: 禁止裸 Any 类型标注
        entry: python scripts/check_no_any.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-bare-strings
        name: 禁止领域语义裸字符串
        entry: python scripts/check_no_bare_strings.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-assembly-purity
        name: 装配期纯度校验（契约 2：只读不算）
        entry: python scripts/check_assembly_purity.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-protocol-impl
        name: Protocol 实现必须显式继承
        entry: python scripts/check_protocol_impl.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-plugin-typing
        name: 插件 setup / build_ 工厂类型标注完整性
        entry: python scripts/check_plugin_typing.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-evidence-atomic
        name: Evidence 摘要不匹配必须显式 raise（ADR-0065 L5）
        entry: python scripts/check_evidence_atomic.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-preview-fields
        name: Journal event 不允许 *_preview 字段（ADR-0065 §四 / PR-3）
        entry: python scripts/check_no_preview_fields.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-double-encoding
        name: Journal payload 不允许 JSON 字符串化（ADR-0065 §四 / PR-3）
        entry: python scripts/check_no_double_encoding.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-plugin-capability
        name: 新 capability key 必须有 seam + provider（ADR-0065 PR-3）
        entry: python scripts/check_plugin_capability.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-gateway-no-direct-journal-new
        name: gateway/runs/ 不允许直接 new Journal/LiveTail/ProcessJournal（ADR-0065 L9 / PR-5）
        entry: python scripts/check_gateway_no_direct_journal_new.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-journal-write-in-coding-agent
        name: Coding Agent Tools 不允许写账本（ADR-0065 L6 / PR-8）
        entry: python scripts/check_no_journal_write_in_coding_agent.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-run-naming
        name: Run 目录命名必须是不可猜测 run_<hex>（ADR-0065 §七 / PR-10）
        entry: python scripts/check_run_naming.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-flat-runs
        name: traces/runs/ 顶层禁 flat <id>.jsonl / .doctor.json 残留（ADR-0065 §七 / PR-11）
        entry: python scripts/check_no_flat_runs.py
        language: system
        pass_filenames: false
        types: [python]

      - id: vulture
        name: 死代码检测 vulture（≥80% 置信度）
        entry: uv run vulture lca --min-confidence 80
        language: system
        pass_filenames: false
        types: [python]

      - id: check-adr-supervision
        name: ADR-0074 tracker 一致性(ADR-0066/0067/0068/0069/0074 监督)
        entry: uv run python scripts/check_adr_supervision.py
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
