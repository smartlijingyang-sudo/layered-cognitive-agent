repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.4
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: import-linter
        name: 五层架构契约检查
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy 类型检查
        entry: uv run mypy lca
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-any
        name: 禁止裸 Any 类型标注（ADR-0017）
        entry: python scripts/check_no_any.py
        language: system
        pass_filenames: false
        types: [python]

      - id: check-no-bare-strings
        name: 禁止领域语义裸字符串（ADR-0017）
        entry: python scripts/check_no_bare_strings.py
        language: system
        pass_filenames: false
        types: [python]

      - id: vulture
        name: 死代码检测 vulture（≥80% 置信度）
        entry: uv run vulture lca --min-confidence 80
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
