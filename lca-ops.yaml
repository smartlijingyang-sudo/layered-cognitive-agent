# lca-ops.yaml — LCA Platform Configuration (SSOT)
#
# Single source of truth for all LCA platform services.
# This replaces: stack.yaml + lca-host.yaml + .env.lca fragmentation.
#
# Load order: defaults → this file → environment variables.

# ── Kernel serve (LCA API network config) ─────────────────────────────
# ADR-0119 决定 4:lca-ops 不再管 LCA 进程 — LCA 进程入口是
#   ``uv run python -m lca_kernel serve --profile X --host H --port P``
# SIGTERM 由 K6 lca_kernel.lifecycle 守护。
# 本段只保留 host/port/health_path 给 daemon 派生 ws_url 用。
# ADR-0119 followup-2:原 ``gateway:`` 段改为 ``kernel_serve:``。
kernel_serve:
  host: "127.0.0.1"
  port: 8765
  health_path: /health
  # 助理域（ADR-0187）：web-assistant = web-standard + assistant-runtime bundle。
  # 换回 profiles/web-standard.yaml 即关闭助理能力（存量路径不受影响，I-A1）。
  profile: profiles/web-assistant.yaml

# ── LobeHub (Next.js frontend) ────────────────────────────────────────
lobehub:
  host: "127.0.0.1"
  release: v2.2.13
  dir: lobehub-ui
  dev_port: 3010
  spa_port: 9876
  env_template: deploy/lobehub/.env.lca

# ── Infrastructure (docker-compose) ───────────────────────────────────
infra:
  host: "127.0.0.1"
  compose_dir: lobehub-ui/docker-compose/dev
  services:
    - postgresql
    - redis
    - rustfs
    - rustfs-init
  ports:
    postgres: 25432
    redis: 6379

# ── Daemon (sandbox-user CLI connect) ─────────────────────────────────
daemon:
  kernel_serve_ws_url: ""  # empty = derive from kernel_serve config (ADR-0119 followup-2)
  user: sandbox-user
  workspace: /home/sandbox-user
  host_config: lca-host.yaml

# ── Onlyboxes (terminalExec worker runtime) ───────────────────────────
onlyboxes:
  worker_service: onlyboxes-worker-docker
  terminal_image: onlyboxes-terminal-local:lca

# ── Runtime state ─────────────────────────────────────────────────────
run_dir: .lca-ops
sudo_pass_file: .lobehub-stack/sudo.pass
